<script>
// ============================================================================
//  CADÊNCIA DE LIGAÇÕES — interface (HTML/JS puro, sem dependências)
//  Módulo isolado: estado próprio (CS), ações próprias (data-cact) e painéis
//  próprios (#csheet / #cmodalBg). Do app antigo reaproveita só o que é seguro:
//  leitor de planilhas (MRPlanilhas), normalização (MRCore), menu, tema,
//  tooltip, toast e o ciclo de render (MRApp.render).
// ============================================================================
(function () {
  'use strict';
  const C = window.MRCore, P = window.MRPlanilhas, K = window.CadCore, APP = window.MRApp;
  if (!C || !P || !K || !APP) return;
  const content = document.getElementById('conteudo');
  const S0 = APP.estado; // estado do app (página atual é compartilhada pelo menu)

  /* ============================== utilitários ============================== */
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const nf = n => Number(n || 0).toLocaleString('pt-BR');
  const pf = n => Number(n || 0).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%';
  const dec = n => Number(n || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const ic = (n, cls) => APP.ic(n, cls);
  const toast = m => APP.toast(m);
  const copiar = t => APP.copiar(t);
  const render = () => APP.render();
  const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* sem storage */ } };
  const stamp = () => { const d = new Date(); return C.chaveDia(d) + '_' + String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0'); };
  const fmtMin = m => (m == null ? '—' : m < 60 ? m + ' min' : Math.floor(m / 60) + 'h ' + String(m % 60).padStart(2, '0') + 'min');
  const pag = () => String(S0.pagina);
  const ativo = () => pag().indexOf('cad:') === 0;

  /* ================================ estado ================================ */
  const PAGS = [
    ['cad:visao', 'Visão geral da cadência', 'activity'],
    ['cad:operadores', 'Cadência por operador', 'users'],
    ['cad:dias', 'Leads atendidos por dia', 'calendar'],
    ['cad:leads', 'Detalhamento por lead', 'list'],
    ['cad:oport', 'Oportunidades de correção', 'alert'],
    ['cad:email', 'Relatório para e-mail', 'mail'],
    ['cad:importar', 'Importar base de ligações', 'upload'],
  ];
  const vazioArq = () => ({ status: 'vazio', nome: '', pasta: null, aba: '', tabela: null, map: {}, erro: '', origem: '' });

  const DCOLS = [
    { k: 'dia', l: 'Data', s: g => g.dia, h: g => esc(g.dataBR), x: g => g.dataBR },
    { k: 'operador', l: 'Operador', s: g => g.operadorN, h: g => esc(g.operador), x: g => g.operador },
    { k: 'supervisor', l: 'Supervisor', s: g => g.supervisor, h: g => esc(g.supervisor) || '<span class="muted">—</span>', x: g => g.supervisor },
    { k: 'lead_code', l: 'Código do lead', s: g => g.lead_code, h: g => (g.lead_code ? '<span class="mono">' + esc(g.lead_code) + '</span>' + copiaBtn(g.lead_code, 'código') : '<span class="badge b-orange">' + ic('alert') + ' Sem código</span>'), x: g => g.lead_code },
    { k: 'lead_name', l: 'Nome do lead', s: g => C.normName(g.lead_name), h: g => esc(g.lead_name) || '<span class="muted">—</span>', x: g => g.lead_name },
    { k: 'phone', l: 'Telefone', s: g => g.phone_norm, h: g => (g.phone ? '<span class="mono">' + esc(g.phone) + '</span>' : '<span class="muted">—</span>'), x: g => g.phone },
    { k: 'tipos', l: 'Tipo de chamada', s: g => g.tipos.join(','), h: g => esc(g.tipos.join(', ')), x: g => g.tipos.join(', ') },
    { k: 'n', l: 'Ligações no dia', num: 1, s: g => g.n, h: g => nf(g.n), x: g => g.n },
    { k: 'distintos', l: 'Horários distintos', num: 1, s: g => g.distintos, h: g => nf(g.distintos), x: g => g.distintos },
    { k: 'primeira', l: '1ª ligação', s: g => g.primeira, h: g => esc(g.primeira), x: g => g.primeira },
    { k: 'ultima', l: 'Última ligação', s: g => g.ultima, h: g => esc(g.ultima), x: g => g.ultima },
    { k: 'horarios', l: 'Horários das tentativas', s: g => g.primeira, h: g => '<span class="mono">' + esc(g.horarios.join(' · ')) + '</span>', x: g => g.horarios.join(', ') },
    { k: 'intervalo', l: 'Intervalo 1ª → última', num: 1, s: g => g.intervaloMin, h: g => (g.n > 1 ? fmtMin(g.intervaloMin) : '<span class="muted">—</span>'), x: g => (g.n > 1 ? g.intervaloMin : '') },
    { k: 'maxDur', l: 'Maior duração', num: 1, s: g => (g.maxDur == null ? -1 : g.maxDur), h: g => (g.maxDur == null ? '<span class="badge b-warn">' + ic('alert') + ' Inválida</span>' : C.fmtDuracao(g.maxDur)), x: g => (g.maxDur == null ? 'Inválida' : C.fmtDuracao(g.maxDur)) },
    { k: 'excecao', l: 'Efetiva > 01:30', s: g => (g.temExcecao ? 1 : 0), h: g => (g.temExcecao ? '<span class="badge b-ok">' + ic('check') + ' Sim</span>' : '<span class="badge b-neutral">Não</span>'), x: g => (g.temExcecao ? 'Sim' : 'Não') },
    { k: 'status', l: 'Status da cadência', s: g => (g.seguida ? 1 : 0), h: g => badgeStatus(g), x: g => g.status },
    { k: 'criterio', l: 'Critério atendido', s: g => g.criterio, h: g => esc(K.CRIT[g.criterio]), x: g => K.CRIT[g.criterio] },
    { k: 'classe', l: 'Classificação', s: g => g.classe, h: g => esc(g.classe), x: g => g.classe },
    { k: 'distrib', l: 'Qualidade da distribuição', s: g => g.distrib, h: g => badgeDist(g), x: g => g.distrib },
    { k: 'motivo', l: 'Motivo da não conformidade', s: g => g.motivo, h: g => (g.motivo ? '<span class="cad-wrap">' + esc(g.motivo) + '</span>' : '<span class="muted">—</span>'), x: g => g.motivo },
    { k: 'oport', l: 'Oportunidade identificada', s: g => g.oportunidade, h: g => (g.oportunidade ? '<span class="cad-wrap">' + esc(g.oportunidade) + '</span>' : '<span class="muted">—</span>'), x: g => g.oportunidade },
  ];
  const DCOLS_PADRAO = DCOLS.filter(c => c.k !== 'supervisor' && c.k !== 'classe').map(c => c.k);

  const CS = {
    arq: vazioArq(),
    base: null, // { calls, ignorados, dups, lidas, nomeArquivo, aba, importadoEm, parcial, map }
    opts: { ignorarDup: false, excluirUltimo: false },
    filtros: K.filtrosVazios(),
    filtrosAbertos: false,
    pop: null, popBusca: '',
    rankMin: lsGet('cad-rankmin', 30),
    expand: {},
    opSort: { k: 'taxa', d: -1 },
    dias: { gran: 'dia', sort: { k: 'chave', d: -1 }, page: 1 },
    det: { sort: { k: 'dia', d: -1 }, page: 1, size: lsGet('cad-pag', 50), cols: lsGet('cad-cols', DCOLS_PADRAO) },
    sheet: null, // { tipo:'lead', key } | { tipo:'grupo', key, gran }
    sheetPilha: [],
    modal: null, // { tipo:'imagem' }
    email: { versao: 'exec' },
    img: { modelo: 'ranking', top: 10, url: '', w: 0, h: 0 },
    processando: false,
  };
  if (!Array.isArray(CS.det.cols)) CS.det.cols = DCOLS_PADRAO.slice();
  if (![25, 50, 100, 250].includes(CS.det.size)) CS.det.size = 50;
  if (![0, 10, 30, 50, 100].includes(CS.rankMin)) CS.rankMin = 30;

  function mapaEquipes() {
    const m = new Map();
    for (const l of window.MR_EQUIPES || []) {
      if (!Array.isArray(l)) continue;
      const k = C.normName(l[0]);
      if (k) m.set(k, { supervisor: String(l[1] || '').trim(), equipe: String(l[2] || '').trim() });
    }
    return m;
  }

  /* ========================= dados derivados (cache) ========================= */
  let ver = 0;
  let cacheA = { k: '', v: null, porKey: null };
  function aval() {
    if (!CS.base) return null;
    const k = ver + '|' + CS.opts.ignorarDup + '|' + CS.opts.excluirUltimo;
    if (cacheA.k !== k) {
      const v = K.avaliar(CS.base.calls, { ignorarDup: CS.opts.ignorarDup, excluirDia: CS.opts.excluirUltimo ? CS.base.parcial.ultimo : '', equipes: mapaEquipes() });
      cacheA = { k, v, porKey: null };
    }
    return cacheA.v;
  }
  function grupoPorKey(key) {
    const a = aval();
    if (!a) return null;
    if (!cacheA.porKey) cacheA.porKey = new Map(a.grupos.map(g => [g.key, g]));
    return cacheA.porKey.get(key) || null;
  }
  const memo = fn => { let v; let ok = false; return () => (ok ? v : (ok = true, v = fn())); };
  let cacheF = { k: '', v: null };
  function dados() {
    const a = aval();
    if (!a) return null;
    const k = cacheA.k + '|' + JSON.stringify(CS.filtros);
    if (cacheF.k !== k) {
      const gs = K.aplicarFiltros(a.grupos, CS.filtros);
      cacheF = { k, v: { gs, res: K.resumo(gs), ops: memo(() => K.porOperador(gs)), serie: memo(() => K.serieDiaria(gs)), oport: memo(() => K.oportunidades(gs)) } };
    }
    return cacheF.v;
  }
  let cacheOpc = { k: '', m: {} };
  /** opções dos filtros de seleção múltipla, com contagem de registros (ligações) */
  function opcoes(campo) {
    const a = aval();
    if (!a) return [];
    if (cacheOpc.k !== cacheA.k) cacheOpc = { k: cacheA.k, m: {} };
    if (!cacheOpc.m[campo]) {
      const cnt = new Map();
      if (campo === 'supervisores') for (const g of a.grupos) { const v = g.supervisor || ''; cnt.set(v, (cnt.get(v) || 0) + g.n); }
      else for (const c of a.calls) { const v = campo === 'operadores' ? c.operador : c.tipo_chamada || ''; cnt.set(v, (cnt.get(v) || 0) + 1); }
      cacheOpc.m[campo] = [...cnt.entries()].sort((x, y) => (campo === 'operadores' ? String(x[0]).localeCompare(String(y[0]), 'pt-BR') : y[1] - x[1]));
    }
    return cacheOpc.m[campo];
  }
  function periodoAtual(res) {
    return { ini: res.ini || CS.filtros.dataIni, fim: res.fim || CS.filtros.dataFim };
  }

  /* ============================ pedaços de HTML ============================ */
  function badgeStatus(g) {
    return g.seguida
      ? '<span class="badge b-ok">' + ic('check') + ' Seguida</span>'
      : '<span class="badge b-err">' + ic('x') + ' Não seguida</span>';
  }
  function badgeDist(g) {
    const D = K.DIST;
    const m = { [D.BOA]: ['b-ok', 'check'], [D.POUCO]: ['b-orange', 'clock'], [D.CONC]: ['b-orange', 'alert'], [D.INCOMP]: ['b-neutral', 'x'], [D.NA]: ['b-acc', 'phone'] };
    const [cls, i] = m[g.distrib] || ['b-neutral', 'help'];
    return '<span class="badge ' + cls + '">' + ic(i) + ' ' + esc(g.distrib) + '</span>';
  }
  function copiaBtn(v, oque) {
    return '<span class="cell-actions"><button class="mini" data-cact="copiar" data-v="' + esc(v) + '" aria-label="Copiar ' + oque + '" data-tip="Copiar ' + oque + '">' + ic('copy') + '</button></span>';
  }
  function taxaBar(t, n) {
    return '<span class="cad-rate" data-tip="' + esc(pf(t) + ' de conformidade' + (n != null ? ' em ' + nf(n) + ' lead-dias' : '')) + '"><span class="cad-rate-bar"><b style="width:' + Math.max(0, Math.min(100, t)) + '%"></b></span><span class="cad-rate-v">' + pf(t) + '</span></span>';
  }
  function card(titulo, sub, corpo, direita, help) {
    return '<section class="card"><div class="card-h"><h3>' + esc(titulo) + '</h3>' + (help ? '<button class="help mini" data-tip="' + esc(help) + '" aria-label="Sobre: ' + esc(titulo) + '">' + ic('help') + '</button>' : '') + (direita ? '<div class="right">' + direita + '</div>' : '') + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div><div class="card-b">' + corpo + '</div></section>';
  }
  const legenda = itens => '<div class="legend">' + itens.map(([c, t]) => '<span><i class="' + c + '"></i>' + esc(t) + '</span>').join('') + '</div>';
  const vazio = msg => '<div class="chart-empty">' + esc(msg || 'Sem dados para os filtros atuais.') + '</div>';
  function th(sortState, act, k, l, num) {
    const at = sortState.k === k;
    return '<th class="' + (num ? 'num' : '') + '" aria-sort="' + (at ? (sortState.d > 0 ? 'ascending' : 'descending') : 'none') + '"><button class="sort" data-cact="' + act + '" data-k="' + k + '">' + esc(l) + (at ? (sortState.d > 0 ? ' ▲' : ' ▼') : '') + '</button></th>';
  }
  function paginacao(act, page, pags, tot, ini, size) {
    return '<span>' + (tot ? nf(ini + 1) + '–' + nf(Math.min(tot, ini + size)) + ' de ' + nf(tot) : '0 resultados') + '</span>' +
      '<div class="pg"><button class="btn sm" data-cact="' + act + '" data-v="1"' + (page <= 1 ? ' disabled' : '') + ' aria-label="Primeira página">«</button><button class="btn sm" data-cact="' + act + '" data-v="' + (page - 1) + '"' + (page <= 1 ? ' disabled' : '') + ' aria-label="Página anterior">‹</button><span>Página ' + page + ' de ' + pags + '</span><button class="btn sm" data-cact="' + act + '" data-v="' + (page + 1) + '"' + (page >= pags ? ' disabled' : '') + ' aria-label="Próxima página">›</button><button class="btn sm" data-cact="' + act + '" data-v="' + pags + '"' + (page >= pags ? ' disabled' : '') + ' aria-label="Última página">»</button></div>';
  }
  function ordenarPor(arr, getter, d, desempate) {
    return arr.map(x => [getter(x), x]).sort((a, b) => (a[0] < b[0] ? -d : a[0] > b[0] ? d : desempate ? desempate(a[1], b[1]) : 0)).map(x => x[1]);
  }

  /* ================================ gráficos ================================ */
  function hbars(id, items, o) {
    o = o || {};
    if (!items.length) return vazio(o.vazio);
    const lim = o.limite || 12;
    const vis = CS.expand[id] ? items : items.slice(0, lim);
    const max = o.max || Math.max(1, ...items.map(i => (o.empilhado ? i.a + i.b : i.value)));
    let h = '<div class="hb" role="list">';
    for (const i of vis) {
      const attrs = i.op != null ? ' data-cact="filtrarOp" data-v="' + esc(i.op) + '"' : ' tabindex="-1"';
      const barra = o.empilhado
        ? '<span class="' + (o.clsA || 'bg-ok') + '" style="width:' + (i.a / max) * 100 + '%"></span><span class="' + (o.clsB || 'bg-err') + '" style="width:' + (i.b / max) * 100 + '%"></span>'
        : '<span class="' + (i.cls || o.cls || 'bg-ok') + '" style="width:' + (i.value / max) * 100 + '%"></span>';
      h += '<button type="button" role="listitem" class="hb-row"' + attrs + ' data-tip="' + esc(i.tip || '') + '"><span class="hb-l">' + esc(i.label) + '</span><span class="hb-t">' + barra + '</span><span class="hb-v">' + (i.txt != null ? i.txt : nf(i.value)) + '</span></button>';
    }
    h += '</div>';
    if (items.length > lim) h += '<button class="btn ghost sm more-link" data-cact="expand" data-id="' + id + '">' + (CS.expand[id] ? 'Mostrar menos' : 'Mostrar todos (' + items.length + ')') + '</button>';
    return h;
  }
  function largura() {
    const cw = content.clientWidth - 40;
    return Math.max(260, Math.round((window.innerWidth > 1180 ? (cw - 16) / 2 : cw) - 30));
  }
  function eixoX(serie, W, L, R, H, x) {
    const cada = Math.max(1, Math.ceil(serie.length / Math.max(2, Math.floor((W - L - R) / 46))));
    let lx = '';
    serie.forEach((s, i) => { if (i % cada === 0 || i === serie.length - 1) lx += '<text x="' + x(i) + '" y="' + (H - 10) + '" text-anchor="middle">' + esc(s.label) + '</text>'; });
    return lx;
  }
  /** linha da taxa de conformidade por dia (0–100%) */
  function linhaTaxa(serie, media) {
    if (!serie.length) return vazio();
    const W = largura(), H = 230, L = 40, R = 12, T = 12, B = 30;
    const x = i => L + (serie.length === 1 ? (W - L - R) / 2 : (i * (W - L - R)) / (serie.length - 1));
    const y = v => T + (H - T - B) * (1 - v / 100);
    let g = '<g class="grid">';
    for (let k = 0; k <= 4; k++) { const v = k * 25, yy = y(v); g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '"/><text x="' + (L - 6) + '" y="' + (yy + 4) + '" text-anchor="end">' + v + '%</text>'; }
    g += '</g>';
    const path = serie.map((s, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(s.taxa).toFixed(1)).join(' ');
    const ym = y(media);
    let pts = '', hov = '';
    const larg = serie.length === 1 ? W - L - R : (W - L - R) / (serie.length - 1);
    serie.forEach((s, i) => {
      if (serie.length <= 62) pts += '<circle cx="' + x(i) + '" cy="' + y(s.taxa) + '" r="3" class="f-ok"/>';
      hov += '<rect x="' + (x(i) - larg / 2) + '" y="' + T + '" width="' + larg + '" height="' + (H - T - B) + '" fill="transparent" data-tip="' + esc(K.diaBR(s.dia) + '\nConformidade: ' + pf(s.taxa) + '\nSeguidas: ' + nf(s.seguidas) + ' de ' + nf(s.leadDias) + ' lead-dias\nLigações: ' + nf(s.ligacoes)) + '"/>';
    });
    return '<div class="chart"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Taxa de conformidade da cadência por dia">' + g + eixoX(serie, W, L, R, H, x) +
      '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + ym + '" y2="' + ym + '" class="s-acc" stroke-dasharray="5 4" stroke-width="1.5"/><text x="' + (W - R) + '" y="' + (ym - 5) + '" text-anchor="end" class="lbl-strong">média ' + pf(media) + '</text>' +
      '<path d="' + path + '" fill="none" class="s-ok" stroke-width="2.2"/>' + pts + hov + '</svg></div>';
  }
  /** colunas empilhadas seguida × não seguida por dia */
  function colunasDia(serie) {
    if (!serie.length) return vazio();
    const W = largura(), H = 230, L = 44, R = 12, T = 14, B = 30;
    const maxV = Math.max(1, ...serie.map(s => s.leadDias));
    const passo = Math.pow(10, Math.floor(Math.log10(maxV)));
    const topo = Math.ceil(maxV / passo) * passo;
    const bw = (W - L - R) / serie.length;
    const x = i => L + bw * i + bw / 2;
    const y = v => T + (H - T - B) * (1 - v / topo);
    let g = '<g class="grid">';
    for (let k = 0; k <= 4; k++) { const v = (topo * k) / 4, yy = y(v); g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '"/><text x="' + (L - 6) + '" y="' + (yy + 4) + '" text-anchor="end">' + nf(Math.round(v)) + '</text>'; }
    g += '</g>';
    const w = Math.max(2, Math.min(34, bw * 0.7));
    let bars = '';
    serie.forEach((s, i) => {
      const y0 = y(0), ys = y(s.seguidas), yt = y(s.leadDias);
      bars += '<g data-tip="' + esc(K.diaBR(s.dia) + '\nSeguidas: ' + nf(s.seguidas) + '\nNão seguidas: ' + nf(s.nao) + '\nConformidade: ' + pf(s.taxa)) + '"><rect x="' + (x(i) - w / 2) + '" y="' + ys + '" width="' + w + '" height="' + Math.max(0, y0 - ys) + '" class="f-ok"/><rect x="' + (x(i) - w / 2) + '" y="' + yt + '" width="' + w + '" height="' + Math.max(0, ys - yt) + '" class="f-err"/>' +
        '<rect x="' + (L + bw * i) + '" y="' + T + '" width="' + bw + '" height="' + (H - T - B) + '" fill="transparent"/></g>';
    });
    return '<div class="chart"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Cadência seguida e não seguida por dia">' + g + bars + eixoX(serie, W, L, R, H, x) + '</svg></div>';
  }

  /* ================================ filtros ================================ */
  function nFiltros() {
    const f = CS.filtros;
    let n = 0;
    for (const k of ['dataIni', 'dataFim', 'codigo', 'nome', 'telefone', 'texto', 'oport']) if (f[k]) n++;
    for (const k of ['status', 'criterio', 'distrib', 'qtd', 'excecao']) if (f[k] !== 'todos') n++;
    for (const k of ['operadores', 'tipos', 'supervisores']) if (f[k].length) n++;
    return n;
  }
  const rot = (lista, v) => (lista.find(x => x[0] === v) || [v, v])[1];
  function chipsLista() {
    const f = CS.filtros, out = [];
    if (f.dataIni) out.push(['dataIni', 'A partir de ' + K.diaBR(f.dataIni)]);
    if (f.dataFim) out.push(['dataFim', 'Até ' + K.diaBR(f.dataFim)]);
    if (f.operadores.length) out.push(['operadores', 'Operador: ' + (f.operadores.length <= 2 ? f.operadores.join(', ') : f.operadores.length + ' selecionados')]);
    if (f.supervisores.length) out.push(['supervisores', 'Supervisor: ' + f.supervisores.map(v => v || '(sem supervisor)').join(', ')]);
    if (f.status !== 'todos') out.push(['status', 'Status: ' + rot(K.STATUS_OPC, f.status)]);
    if (f.criterio !== 'todos') out.push(['criterio', 'Motivo: ' + rot(K.CRIT_OPC, f.criterio)]);
    if (f.distrib !== 'todos') out.push(['distrib', 'Distribuição: ' + f.distrib]);
    if (f.qtd !== 'todos') out.push(['qtd', 'Ligações no dia: ' + rot(K.QTD_OPC, f.qtd)]);
    if (f.excecao !== 'todos') out.push(['excecao', 'Efetiva > 01:30: ' + rot(K.EXC_OPC, f.excecao)]);
    if (f.tipos.length) out.push(['tipos', 'Tipo: ' + f.tipos.map(v => v || '(vazio)').join(', ')]);
    if (f.codigo) out.push(['codigo', 'Código: ' + f.codigo]);
    if (f.nome) out.push(['nome', 'Nome: ' + f.nome]);
    if (f.telefone) out.push(['telefone', 'Telefone: ' + f.telefone]);
    if (f.texto) out.push(['texto', 'Busca: ' + f.texto]);
    if (f.oport) out.push(['oport', 'Oportunidade: ' + (K.OPORT.find(o => o.k === f.oport) || { l: f.oport }).l]);
    return out;
  }
  function campoTexto(k, label, tipo, ph) {
    return '<div class="field"><label for="cf-' + k + '">' + label + '</label><input class="input" id="cf-' + k + '" type="' + (tipo || 'text') + '" data-cf="' + k + '" value="' + esc(CS.filtros[k]) + '"' + (ph ? ' placeholder="' + esc(ph) + '"' : '') + ' autocomplete="off"></div>';
  }
  function campoSelect(k, label, opts, help) {
    return '<div class="field"><label for="cf-' + k + '">' + label + (help ? ' <span class="warn-ic" style="color:var(--muted)" data-tip="' + esc(help) + '">' + ic('help') + '</span>' : '') + '</label><select class="select" id="cf-' + k + '" data-cf="' + k + '">' + opts.map(([v, t]) => '<option value="' + esc(v) + '"' + (CS.filtros[k] === v ? ' selected' : '') + '>' + esc(t) + '</option>').join('') + '</select></div>';
  }
  /** seleção múltipla com pesquisa (operadores, tipos, supervisores) */
  function multi(campo, label, todosTxt, unidade) {
    const sel = CS.filtros[campo];
    const aberto = CS.pop === 'ms:' + campo;
    const txt = !sel.length ? todosTxt : sel.length === 1 ? sel[0] || '(vazio)' : sel.length + ' selecionados';
    let h = '<div class="field ms cad-ms"><span class="lbl" id="clbl-' + campo + '">' + label + '</span><button type="button" class="btn ms-btn' + (sel.length ? ' has' : '') + '" data-cact="pop" data-id="ms:' + campo + '" aria-haspopup="listbox" aria-expanded="' + aberto + '" aria-labelledby="clbl-' + campo + '"><span class="v">' + esc(txt) + '</span>' + ic('chevron') + '</button>';
    if (aberto) {
      const q = C.normName(CS.popBusca);
      const ops = opcoes(campo);
      const lista = ops.filter(([v]) => !q || C.normName(v || '(vazio)').includes(q));
      const selN = new Set(sel.map(C.normName));
      h += '<div class="pop cpop" role="dialog" aria-label="' + esc(label) + '">' +
        '<div class="input-ic">' + ic('search') + '<input class="input" id="cpop-busca" data-cpopbusca="1" placeholder="Digite parte do nome…" value="' + esc(CS.popBusca) + '" aria-label="Pesquisar ' + esc(label) + '" autocomplete="off"></div>' +
        '<div class="ms-list" role="listbox" aria-multiselectable="true">' +
        '<label class="ms-opt cad-todos"><input type="checkbox" data-cmsall="' + campo + '"' + (!sel.length ? ' checked' : '') + '><span><b>' + esc(todosTxt) + '</b></span><span class="n">' + nf(ops.reduce((s, x) => s + x[1], 0)) + '</span></label>' +
        (lista.length ? lista.slice(0, 400).map(([v, n]) => '<label class="ms-opt"><input type="checkbox" data-cms="' + campo + '" data-v="' + esc(v) + '"' + (selN.has(C.normName(v)) ? ' checked' : '') + '><span>' + esc(v || '(vazio)') + '</span><span class="n">' + nf(n) + ' ' + unidade + '</span></label>').join('') : '<div class="muted small" style="padding:6px">Nada encontrado.</div>') +
        '</div><div class="ms-foot"><span>' + (sel.length ? sel.length + ' selecionado(s)' : 'Todos') + '</span><span>' +
        (q && lista.length ? '<button class="btn sm ghost" data-cact="msTodosBusca" data-k="' + campo + '">Marcar os ' + lista.length + ' encontrados</button> ' : '') +
        '<button class="btn sm ghost" data-cact="msLimpar" data-k="' + campo + '">Limpar</button> <button class="btn sm" data-cact="popFechar">Fechar</button></span></div></div>';
    }
    return h + '</div>';
  }
  function painelFiltros() {
    const n = nFiltros(), ch = chipsLista();

    return '<section class="card filters" aria-label="Filtros da cadência">' +
      '<div class="filters-top">' +
      multi('operadores', 'Operador', 'Todos os operadores', 'lig.') +
      campoTexto('dataIni', 'Data inicial', 'date') + campoTexto('dataFim', 'Data final', 'date') +
      campoSelect('status', 'Status da cadência', K.STATUS_OPC) +

      '<div class="actions-row" style="align-self:flex-end">' +

      (n ? '<button class="btn ghost danger" data-cact="limparFiltros">' + ic('x') + ' Limpar filtros</button>' : '') +
      '</div></div>' +
      '<div class="chips" aria-label="Filtros ativos">' + ch.map(([k, t]) => '<span class="chip"><span title="' + esc(t) + '">' + esc(t) + '</span><button data-cact="rmChip" data-k="' + esc(k) + '" aria-label="Remover filtro ' + esc(t) + '">' + ic('x') + '</button></span>').join('') + '</div>' +
      (CS.filtrosAbertos ? '<div class="filters-backdrop" data-cact="toggleFiltros" aria-hidden="true"></div>' : '') +
      '<div class="filters-adv" id="cFiltrosAdv"' + (CS.filtrosAbertos ? '' : ' hidden') + '>' +
      '<div class="filters-sheet-head"><strong>Filtros da cadência</strong><button class="btn icon ghost" data-cact="toggleFiltros" aria-label="Fechar filtros">' + ic('x') + '</button></div>' +
      campoSelect('criterio', 'Motivo da conformidade', K.CRIT_OPC, 'Qual regra fez o lead-dia ficar conforme: ligação efetiva acima de 01:30 ou 3 ou mais ligações no dia.') +
      campoSelect('distrib', 'Qualidade da distribuição', K.DIST_OPC, 'Bem distribuídos: 3+ horários e 30 min ou mais entre a 1ª e a última. Pouco espaçados: menos de 30 min. Concentradas: mesmo minuto ou até 2 min.') +
      campoSelect('qtd', 'Quantidade de ligações no dia', K.QTD_OPC) +
      campoSelect('excecao', 'Ligação efetiva > 01:30', K.EXC_OPC, 'Effective = 1 e duração estritamente maior que 01:30. Exatamente 01:30 não conta.') +
      multi('tipos', 'Tipo da chamada', 'Todos os tipos', 'lig.') +
      (temSup ? multi('supervisores', 'Supervisor', 'Todos os supervisores', 'lig.') : '') +
      campoTexto('codigo', 'Código do lead', 'search', 'Ex.: 3286906') + campoTexto('nome', 'Nome do lead', 'search', 'Parte do nome') + campoTexto('telefone', 'Telefone', 'search', 'Só números') +
      campoSelect('oport', 'Oportunidade de correção', [['', 'Todas']].concat(K.OPORT.map(o => [o.k, o.l]))) +
      '<div class="field" style="align-self:end"><button class="btn" data-cact="limparFiltros">' + ic('x') + ' Limpar filtros</button></div>' +
      '</div></section>' + barraOpcoes();
  }
  /** duplicidades e dia parcial: opções que mudam a base considerada */
  function barraOpcoes() {
    const b = CS.base;
    if (!b) return '';

    const p = b.parcial;

      h += '<div class="cad-notice" role="note">' + ic('alert') + '<div style="flex:1;min-width:220px"><b>O último dia da base (' + K.diaBR(p.ultimo) + ') parece estar incompleto.</b> Os resultados desse dia devem ser analisados considerando o horário de extração' + (p.extracao ? ' (' + esc(p.extracao) + ')' : '') + '. Última ligação registrada às ' + esc(p.ultimaHora) + '. <span class="small">Motivo do aviso: ' + esc(p.motivos.join('; ')) + '.</span></div>' +
        '<div class="seg" role="group" aria-label="Último dia"><button data-cact="parcial" data-v="incluir" aria-pressed="' + !CS.opts.excluirUltimo + '">Incluir o dia parcial</button><button data-cact="parcial" data-v="excluir" aria-pressed="' + CS.opts.excluirUltimo + '">Excluir o último dia</button></div></div>';
    }
    h += '<div class="cad-opts small">' + ic('layers') + '<span>Possíveis duplicidades (mesmo operador, lead, data, minuto e duração): <b>' + nf(b.dups) + '</b> registro(s).</span>' +
      '<div class="seg" role="group" aria-label="Duplicidades"><button data-cact="dup" data-v="todos" aria-pressed="' + !CS.opts.ignorarDup + '">Contar todos os registros</button><button data-cact="dup" data-v="ignorar" aria-pressed="' + CS.opts.ignorarDup + '"' + (b.dups ? '' : ' disabled') + '>Desconsiderar possíveis duplicidades' + (b.dups ? ' (−' + nf(b.dups) + ')' : '') + '</button></div></div>';

  }

      ['Atendidas por 3 ou mais ligações', nf(r.tres), 'Lead-dias sem efetiva acima de 01:30, mas com 3 ou mais ligações no dia.', 't-ok', r.seguidas ? pf((r.tres / r.seguidas) * 100) + ' das seguidas' : '', 'tres'],

      ['Lead-dias com apenas 1 tentativa', nf(r.uma), 'Uma única ligação no dia e nenhuma efetiva acima de 01:30.', 't-err', r.leadDias ? pf((r.uma / r.leadDias) * 100) + ' dos lead-dias' : '', 'uma'],

    ];
    return '<div class="kpis">' + itens.map(([l, v, t, cls, s, st]) =>
      '<div class="card kpi ' + cls + (st ? ' cad-kpi-link' : '') + '"' + (st ? ' data-cact="kpiIr" data-v="' + st + '" role="button" tabindex="0" aria-label="' + esc(l + ': ' + v + '. Ver no detalhamento') + '"' : '') + '><div class="k-l">' + esc(l) + '<button class="help" data-tip="' + esc(t) + '" aria-label="O que é: ' + esc(l) + '">' + ic('help') + '</button></div><div class="k-v">' + v + '</div>' + (s ? '<div class="k-s">' + esc(s) + '</div>' : '') + '</div>').join('') + '</div>';
  }
  function segMin() {
    return '<div class="seg" role="group" aria-label="Volume mínimo do ranking">' + [[0, 'Todos'], [10, '≥ 10'], [30, '≥ 30'], [50, '≥ 50'], [100, '≥ 100']].map(([v, l]) => '<button data-cact="rankMin" data-v="' + v + '" aria-pressed="' + (CS.rankMin === v) + '" data-tip="' + (v ? 'Somente operadores com pelo menos ' + v + ' lead-dias' : 'Todos os operadores') + '">' + l + '</button>').join('') + '</div>';
  }
  function gRanking(D, id) {
    const rk = K.ranking(D.ops(), CS.rankMin);
    const fora = D.ops().length - rk.length;
    return card('Ranking de conformidade por operador', 'Lead-dias com cadência seguida ÷ lead-dias avaliados. ' + (CS.rankMin ? 'Só entram operadores com pelo menos <b>' + CS.rankMin + ' lead-dias</b>' + (fora ? ' (' + fora + ' abaixo do mínimo ficam fora do ranking, mas continuam nas tabelas)' : '') + '.' : 'Todos os operadores.') + ' Clique para filtrar.',
      hbars(id, rk.map(o => ({ label: o.operador, value: o.taxa, op: o.operador, txt: pf(o.taxa) + ' <span class="muted small">(' + nf(o.seguidas) + '/' + nf(o.leadDias) + ')</span>', tip: o.operador + (o.supervisor ? ' · ' + o.supervisor : '') + '\nConformidade: ' + pf(o.taxa) + '\nSeguidas: ' + nf(o.seguidas) + ' de ' + nf(o.leadDias) + ' lead-dias\nSem cadência: ' + nf(o.nao) })), { max: 100, cls: 'bg-ok', vazio: 'Nenhum operador com o volume mínimo escolhido. Diminua o mínimo.' }), segMin(),
      'Comparação justa: o volume mínimo evita destacar um operador com só 1 ou 2 registros. Padrão gerencial: 30 lead-dias.');
  }
  function pagVisao(D) {
    const r = D.res;
    if (!D.gs.length) return kpiCards(r) + '<section class="card empty">' + ic('filter', 'big') + '<h2>Nenhum lead-dia com os filtros atuais</h2><p>Ajuste ou limpe os filtros para ver os resultados.</p><button class="btn" data-cact="limparFiltros">Limpar filtros</button></section>';
    const ops = D.ops();
    const porLeads = ops.slice().sort((a, b) => b.leadDias - a.leadDias);
    const naoConf = ops.filter(o => o.nao > 0).sort((a, b) => b.nao - a.nao);
    const conc = ops.filter(o => o.concentradas > 0).sort((a, b) => b.concentradas - a.concentradas);
    return kpiCards(r) +
      '<div class="grid2">' +
      card('Evolução da conformidade por dia', legenda([['bg-ok', 'Taxa de conformidade do dia'], ['bg-acc', 'Média do período']]), linhaTaxa(D.serie(), r.taxa)) +
      card('Cadência seguida × não seguida por dia', legenda([['bg-ok', 'Seguida'], ['bg-err', 'Não seguida']]) + '<span class="muted small">Quantidade de lead-dias.</span>', colunasDia(D.serie())) + '</div>' +
      '<div class="grid2">' + gRanking(D, 'gRank') +
      card('Leads atendidos por operador', 'Lead-dias avaliados (um lead em uma data). Clique para filtrar.',
        hbars('gLeads', porLeads.map(o => ({ label: o.operador, value: o.leadDias, op: o.operador, cls: 'bg-acc', txt: nf(o.leadDias), tip: o.operador + '\nLead-dias: ' + nf(o.leadDias) + '\nLeads únicos: ' + nf(o.leads) + '\nLigações: ' + nf(o.ligacoes) + '\nMédia: ' + dec(o.media) + ' ligações por lead-dia' })))) + '</div>' +
      '<div class="grid2">' +
      card('Não conformes: 1 ou 2 tentativas', legenda([['bg-err', 'Apenas 1 tentativa'], ['bg-orange', 'Apenas 2 tentativas']]) + '<span class="muted small">No total: ' + nf(r.uma) + ' com 1 tentativa (' + pf(r.nao ? (r.uma / r.nao) * 100 : 0) + ') e ' + nf(r.duas) + ' com 2 tentativas (' + pf(r.nao ? (r.duas / r.nao) * 100 : 0) + ') dos ' + nf(r.nao) + ' lead-dias sem cadência.</span>',
        hbars('gNao', naoConf.map(o => ({ label: o.operador, a: o.uma, b: o.duas, op: o.operador, txt: nf(o.uma) + ' + ' + nf(o.duas), tip: o.operador + '\nApenas 1 tentativa: ' + nf(o.uma) + '\nApenas 2 tentativas: ' + nf(o.duas) + '\nTotal sem cadência: ' + nf(o.nao) + ' de ' + nf(o.leadDias) })), { empilhado: true, clsA: 'bg-err', clsB: 'bg-orange', vazio: 'Nenhum lead-dia sem cadência nos filtros atuais.' })) +
      card('Chamadas concentradas por operador', 'Cadências cumpridas com 3+ ligações, mas com menos de 30 min entre a 1ª e a última tentativa.',
        hbars('gConc', conc.map(o => ({ label: o.operador, value: o.concentradas, op: o.operador, cls: 'bg-orange', txt: nf(o.concentradas) + ' <span class="muted small">de ' + nf(o.tres) + '</span>', tip: o.operador + '\nConcentradas: ' + nf(o.concentradas) + ' de ' + nf(o.tres) + ' cadências por 3+ ligações\nNo mesmo minuto: ' + nf(o.mesmoMinuto) })), { vazio: 'Nenhuma cadência concentrada nos filtros atuais.' })) + '</div>' +
      card('Como a cadência é avaliada', '', regraHtml());
  }
  function regraHtml() {
    return '<ol class="steps small">' +
      '<li>Cada combinação de <b>operador + data + lead</b> é um <b>lead-dia</b>. O lead é identificado pelo <code>lead_code</code>; sem código, pelo <code>phone</code>; em último caso, pelo nome normalizado.</li>' +
      '<li><b>Regra A:</b> 3 ou mais ligações registradas no mesmo dia → cadência seguida.</li>' +
      '<li><b>Regra B (exceção):</b> pelo menos uma ligação com <code>effective</code> = 1 <b>e</b> duração <b>estritamente maior</b> que 01:30 → cadência seguida mesmo com menos de 3 tentativas. Uma ligação de exatamente 01:30 não aciona a exceção.</li>' +
      '<li><b>Distribuição</b> (só quando a cadência depende das 3 ligações): bem distribuídos = 3+ horários distintos e 30 min ou mais entre a 1ª e a última; pouco espaçados = menos de 30 min; concentradas = mesmo minuto ou até 2 min. Não tira a conformidade, mas vira oportunidade.</li>' +
      '<li>Duração inválida nunca vira zero: a ligação conta como tentativa, mas não aciona a exceção.</li></ol>';
  }

  /* ---- operadores ---- */
  const OCOLS = [
    ['operador', 'Operador', 0], ['supervisor', 'Supervisor', 0], ['ligacoes', 'Total de ligações', 1], ['leads', 'Leads únicos', 1], ['leadDias', 'Lead-dias avaliados', 1],
    ['seguidas', 'Cadências seguidas', 1], ['nao', 'Cadências não seguidas', 1], ['taxa', 'Taxa de conformidade', 1], ['efetiva', 'Por efetiva > 01:30', 1],
    ['tres', 'Por 3+ ligações', 1], ['boa', 'Boa distribuição', 1], ['concentradas', 'Concentradas', 1], ['uma', '1 tentativa', 1], ['duas', '2 tentativas', 1], ['media', 'Média lig./lead-dia', 1],
  ];
  function tabelaOperadores(D) {
    const ops = D.ops();
    if (!ops.length) return vazio();
    const k = CS.opSort.k, d = CS.opSort.d;
    const ord = ordenarPor(ops, o => (k === 'operador' || k === 'supervisor' ? C.normName(o[k] || '~') : o[k]), d, (a, b) => b.leadDias - a.leadDias);
    const sel = new Set(CS.filtros.operadores.map(C.normName));
    const r = D.res;
    const cel = (o, kk) => {
      if (kk === 'operador') return '<td><b>' + esc(o.operador) + '</b>' + (o.leadDias < CS.rankMin ? ' <span class="badge b-neutral" data-tip="Abaixo do volume mínimo do ranking (' + CS.rankMin + ' lead-dias). Continua na tabela.">baixo volume</span>' : '') + '</td>';
      if (kk === 'supervisor') return '<td>' + (esc(o.supervisor) || '<span class="muted">—</span>') + '</td>';
      if (kk === 'taxa') return '<td class="num">' + taxaBar(o.taxa, o.leadDias) + '</td>';
      if (kk === 'media') return '<td class="num">' + dec(o.media) + '</td>';
      if (kk === 'seguidas') return '<td class="num"><span class="ok-text">' + ic('check') + '</span> ' + nf(o.seguidas) + '</td>';
      if (kk === 'nao') return '<td class="num">' + (o.nao ? '<span class="err-text">' + ic('x') + '</span> ' : '') + nf(o.nao) + '</td>';
      if (kk === 'concentradas') return '<td class="num">' + (o.concentradas ? '<span class="warn-ic">' + ic('alert') + '</span> ' : '') + nf(o.concentradas) + '</td>';
      return '<td class="num">' + nf(o[kk]) + '</td>';
    };
    const tot = { operador: 'Total (' + nf(ops.length) + ' operadores)', supervisor: '', ligacoes: r.ligacoes, leads: r.leads, leadDias: r.leadDias, seguidas: r.seguidas, nao: r.nao, taxa: r.taxa, efetiva: r.efetiva, tres: r.tres, boa: r.boa, concentradas: r.concentradas, uma: r.uma, duas: r.duas, media: r.media };
    return '<div class="tbl-wrap" style="border-top:0"><table class="tbl cad-tbl"><thead><tr>' + OCOLS.map(([kk, l, num]) => th(CS.opSort, 'opSort', kk, l, num)).join('') + '<th>Ações</th></tr></thead><tbody>' +
      ord.map(o => '<tr data-cact="filtrarOp" data-v="' + esc(o.operador) + '" tabindex="0" class="' + (sel.has(o.operadorN) ? 'sel' : '') + '" data-tip="Clique para ' + (sel.has(o.operadorN) ? 'remover o filtro deste operador' : 'filtrar por este operador') + '">' + OCOLS.map(([kk]) => cel(o, kk)).join('') +
        '<td><button class="btn sm" data-cact="detalharOp" data-v="' + esc(o.operador) + '">' + ic('list') + ' Detalhar</button></td></tr>').join('') +
      '</tbody><tfoot><tr class="cad-tot">' + OCOLS.map(([kk]) => (kk === 'operador' ? '<td><b>' + esc(tot.operador) + '</b></td>' : kk === 'supervisor' ? '<td></td>' : kk === 'taxa' ? '<td class="num"><b>' + pf(tot.taxa) + '</b></td>' : kk === 'media' ? '<td class="num"><b>' + dec(tot.media) + '</b></td>' : '<td class="num"><b>' + nf(tot[kk]) + '</b></td>')).join('') + '<td></td></tr></tfoot></table></div>';
  }
  function pagOperadores(D) {
    return '<div class="grid2">' + gRanking(D, 'gRank2') +
      card('Conformidade × volume', 'Cada barra: lead-dias seguidos (verde) e sem cadência (vermelho). Ordenado pelo volume. Clique para filtrar.',
        hbars('gVol', D.ops().slice().sort((a, b) => b.leadDias - a.leadDias).map(o => ({ label: o.operador, a: o.seguidas, b: o.nao, op: o.operador, txt: pf(o.taxa) + ' <span class="muted small">de ' + nf(o.leadDias) + '</span>', tip: o.operador + '\nSeguidas: ' + nf(o.seguidas) + '\nSem cadência: ' + nf(o.nao) + '\nConformidade: ' + pf(o.taxa) })), { empilhado: true, clsA: 'bg-ok', clsB: 'bg-err' })) + '</div>' +
      card('Relatório consolidado por operador', 'Clique em uma linha para filtrar o painel por esse operador (clique de novo para remover). "Detalhar" abre os lead-dias do operador. A linha de total confere com os cards da visão geral.', tabelaOperadores(D), '<button class="btn sm" data-cact="exportar" data-t="operadores" data-f="xlsx">' + ic('download') + ' Exportar</button>');
  }

  /* ---- leads por dia ---- */
  const PCOLS = [
    ['chave', 'Data', 0], ['operador', 'Operador', 0], ['ligacoes', 'Total de ligações', 1], ['leads', 'Leads únicos', 1], ['leadDias', 'Lead-dias', 1], ['seguidas', 'Seguidas', 1],
    ['nao', 'Não seguidas', 1], ['taxa', 'Conformidade', 1], ['efetiva', 'Por efetiva', 1], ['tres', 'Por 3+ ligações', 1], ['concentradas', 'Concentradas', 1], ['uma', '1 tentativa', 1], ['duas', '2 tentativas', 1],
  ];
  function pagDias(D) {
    const st = CS.dias;
    const linhas = K.porPeriodoOperador(D.gs, st.gran);
    const k = st.sort.k, d = st.sort.d;
    const ord = ordenarPor(linhas, x => (k === 'operador' ? C.normName(x.operador) : x[k]), d, (a, b) => (a.chave < b.chave ? 1 : a.chave > b.chave ? -1 : a.operador.localeCompare(b.operador, 'pt-BR')));
    const size = 50, tot = ord.length, pags = Math.max(1, Math.ceil(tot / size));
    if (st.page > pags) st.page = pags;
    const ini = (st.page - 1) * size;
    const vis = ord.slice(ini, ini + size);
    const nome = { dia: 'Data', semana: 'Semana', mes: 'Mês' }[st.gran];
    const seg = '<div class="seg" role="group" aria-label="Agrupamento">' + [['dia', 'Visão diária'], ['semana', 'Visão semanal'], ['mes', 'Visão mensal']].map(([v, l]) => '<button data-cact="gran" data-v="' + v + '" aria-pressed="' + (st.gran === v) + '">' + l + '</button>').join('') + '</div>';
    const r = D.res;
    // resumo por periodo (todas as pessoas)
    const porPer = new Map();
    for (const x of linhas) { const p = porPer.get(x.chave) || { label: x.label, leadDias: 0, seguidas: 0, leads: new Set() }; p.leadDias += x.leadDias; p.seguidas += x.seguidas; for (const g of x.itens) p.leads.add(g.leadKey); porPer.set(x.chave, p); }
    const perArr = [...porPer.entries()].sort((a, b) => (a[0] < b[0] ? -1 : 1));
    const tabela = tot ? '<div class="tbl-wrap" style="border-top:0"><table class="tbl cad-tbl"><thead><tr>' + PCOLS.map(([kk, l, num]) => th(st.sort, 'diasSort', kk, kk === 'chave' ? nome : l, num)).join('') + '</tr></thead><tbody>' +
      vis.map(x => '<tr data-cact="abrirGrupo" data-k="' + esc(x.key) + '" tabindex="0" data-tip="Clique para ver os leads que compõem este resultado">' + PCOLS.map(([kk]) => {
        if (kk === 'chave') return '<td class="nowrap">' + esc(x.label) + '</td>';
        if (kk === 'operador') return '<td>' + esc(x.operador) + '</td>';
        if (kk === 'taxa') return '<td class="num">' + taxaBar(x.taxa, x.leadDias) + '</td>';
        return '<td class="num">' + nf(x[kk]) + '</td>';
      }).join('') + '</tr>').join('') +
      '</tbody><tfoot><tr class="cad-tot"><td colspan="2"><b>Total (' + nf(tot) + ' linhas)</b></td><td class="num"><b>' + nf(r.ligacoes) + '</b></td><td class="num" data-tip="Soma dos leads únicos de cada linha (um lead atendido em dois dias conta nas duas linhas). Leads únicos no período: ' + nf(r.leads) + '"><b>' + nf(linhas.reduce((s, x) => s + x.leads, 0)) + '</b></td><td class="num"><b>' + nf(r.leadDias) + '</b></td><td class="num"><b>' + nf(r.seguidas) + '</b></td><td class="num"><b>' + nf(r.nao) + '</b></td><td class="num"><b>' + pf(r.taxa) + '</b></td><td class="num"><b>' + nf(r.efetiva) + '</b></td><td class="num"><b>' + nf(r.tres) + '</b></td><td class="num"><b>' + nf(r.concentradas) + '</b></td><td class="num"><b>' + nf(r.uma) + '</b></td><td class="num"><b>' + nf(r.duas) + '</b></td></tr></tfoot></table></div>' +
      '<div class="tbl-foot">' + paginacao('diasPag', st.page, pags, tot, ini, size) + '</div>' : vazio();
    const maxL = Math.max(1, ...perArr.map(([, p]) => p.leads.size));
    const mini = perArr.length ? '<div class="vc" style="height:180px">' + perArr.map(([, p]) => '<div class="vc-col" tabindex="0" data-tip="' + esc(p.label + '\nLeads únicos atendidos: ' + nf(p.leads.size) + '\nLead-dias: ' + nf(p.leadDias) + '\nConformidade: ' + pf(p.leadDias ? (p.seguidas / p.leadDias) * 100 : 0)) + '"><span class="vc-area">' + (perArr.length <= 16 ? '<span class="vc-n">' + nf(p.leads.size) + '</span>' : '') + '<span class="vc-bar bg-acc" style="height:' + Math.max(1, (p.leads.size / maxL) * 85) + '%"></span></span><span class="vc-lab">' + esc(st.gran === 'dia' ? p.label.slice(0, 5) : st.gran === 'semana' ? p.label.slice(0, 5) : p.label) + '</span></div>').join('') + '</div>' : vazio();
    return '<div class="actions-row">' + seg + '<span class="muted small">Agrupado por ' + nome.toLowerCase() + ' + operador. Clique numa linha para ver os leads.</span><span style="margin-left:auto"><button class="btn" data-cact="exportar" data-t="dias" data-f="xlsx">' + ic('download') + ' Exportar</button></span></div>' +
      card('Leads únicos atendidos por ' + nome.toLowerCase(), 'Todos os operadores dos filtros atuais.', mini) +
      card('Leads atendidos por ' + nome.toLowerCase() + ' e operador', nf(tot) + ' linhas · ' + nf(r.leadDias) + ' lead-dias', tabela);
  }

  /* ---- detalhamento ---- */
  function pagLeads(D) {
    const st = CS.det;
    const cols = DCOLS.filter(c => st.cols.includes(c.k));
    const col = DCOLS.find(c => c.k === st.sort.k) || DCOLS[0];
    const ord = ordenarPor(D.gs, col.s, st.sort.d, (a, b) => (a.dia < b.dia ? 1 : a.dia > b.dia ? -1 : a.operador.localeCompare(b.operador, 'pt-BR')));
    const tot = ord.length, size = st.size, pags = Math.max(1, Math.ceil(tot / size));
    if (st.page > pags) st.page = pags;
    const ini = (st.page - 1) * size;
    const vis = ord.slice(ini, ini + size);
    const toolbar = '<div class="toolbar">' +
      '<div class="grow input-ic">' + ic('search') + '<input class="input" id="cdet-busca" type="search" data-cf="texto" placeholder="Pesquisar operador, lead, código, telefone, status…" value="' + esc(CS.filtros.texto) + '" aria-label="Pesquisar no detalhamento" autocomplete="off"></div>' +
      '<div class="ms"><button class="btn" data-cact="pop" data-id="ccols" aria-expanded="' + (CS.pop === 'ccols') + '">' + ic('columns') + ' Colunas</button>' + (CS.pop === 'ccols' ? popColunas() : '') + '</div>' +
      '<button class="btn" data-cact="copiarCodigosNao" data-tip="Copia os códigos dos leads sem cadência nos filtros atuais (sem repetir), um por linha.">' + ic('copy') + ' Copiar códigos sem cadência</button>' +
      '<button class="btn" data-cact="exportar" data-t="detalhamento" data-f="xlsx">' + ic('download') + ' Exportar filtrados (XLSX)</button>' +
      '<button class="btn" data-cact="exportar" data-t="detalhamento" data-f="csv">CSV</button></div>';
    const corpo = vis.map(g => '<tr data-cact="abrirLead" data-k="' + esc(g.key) + '" tabindex="0" class="' + (g.seguida ? 'ef' : 'cad-nao') + '">' + cols.map(c => '<td class="' + (c.num ? 'num' : '') + (c.k === 'motivo' || c.k === 'oport' ? ' cad-wrap-td' : '') + '">' + c.h(g) + '</td>').join('') + '</tr>').join('');
    const cardsMob = vis.map(g => '<button class="call-card' + (g.seguida ? ' ef' : '') + '" data-cact="abrirLead" data-k="' + esc(g.key) + '"><span class="row1"><span>' + esc(g.lead_name || g.lead_code || '(sem nome)') + '</span><span>' + nf(g.n) + ' lig.</span></span><span class="meta"><span>' + esc(g.dataBR) + '</span><span>' + esc(g.operador) + '</span><span class="mono">' + esc(g.horarios.join(' · ')) + '</span></span><span>' + badgeStatus(g) + ' ' + badgeDist(g) + '</span></button>').join('');
    return '<section class="card"><div class="card-h"><h3>Detalhamento por lead</h3><div class="sub">Uma linha por operador + data + lead · ' + nf(tot) + ' lead-dias · ' + nf(D.res.seguidas) + ' seguidos · ' + nf(D.res.nao) + ' sem cadência. Clique numa linha para ver a linha do tempo.</div></div>' + toolbar +
      (tot ? '<div class="tbl-wrap resp"><table class="tbl cad-tbl"><thead><tr>' + cols.map(c => th(st.sort, 'detSort', c.k, c.l, c.num)).join('') + '</tr></thead><tbody>' + corpo + '</tbody></table></div><div class="cards-list">' + cardsMob + '</div>'
        : '<div class="empty"><p>Nenhum lead-dia com os filtros atuais.</p><button class="btn" data-cact="limparFiltros">Limpar filtros</button></div>') +
      '<div class="tbl-foot"><label>Linhas por página <select class="select" style="width:auto;height:30px" data-csize="1" aria-label="Linhas por página">' + [25, 50, 100, 250].map(n => '<option' + (n === size ? ' selected' : '') + '>' + n + '</option>').join('') + '</select></label>' + paginacao('detPag', st.page, pags, tot, ini, size) + '</div></section>';
  }
  function popColunas() {
    return '<div class="pop right cpop" role="dialog" aria-label="Colunas visíveis"><div class="ms-list">' +
      DCOLS.map(c => '<label class="ms-opt"><input type="checkbox" data-ccol="' + c.k + '"' + (CS.det.cols.includes(c.k) ? ' checked' : '') + '><span>' + esc(c.l) + '</span></label>').join('') +
      '</div><div class="ms-foot"><button class="btn sm ghost" data-cact="colsPadrao">Restaurar padrão</button><button class="btn sm" data-cact="popFechar">Fechar</button></div></div>';
  }

  /* ---- oportunidades ---- */
  function pagOport(D) {
    const cats = D.oport();
    const r = D.res;
    const comCasos = cats.filter(c => c.qtd > 0), sem = cats.filter(c => !c.qtd);
    const htmlCat = c => {
      const ex = c.exemplos.map(g => {
        let det = esc(g.horarios.join(' · '));
        if (c.k === 'effCurta') det = g.calls.filter(x => x.eff === true && x.dur != null && x.dur <= K.REGRA.EXC_SEG).map(x => x.hora + ' (' + C.fmtDuracao(x.dur) + ', effective ' + esc(x.effOrig) + ')').join(' · ');
        if (c.k === 'durInvalida') det = g.calls.filter(x => x.durInvalida).map(x => x.hora + ' (valor original: "' + esc(x.durOrig || 'vazio') + '")').join(' · ');
        if (c.k === 'multiOperador') det = 'Também: ' + esc(g.outrosOperadores.join(', '));
        if (c.k === 'codMultiFone' || c.k === 'foneMultiCod') det = 'Código ' + esc(g.lead_code || '—') + ' · tel. ' + esc(g.phone || '—');

      }).join('');
      return '<section class="card cad-cat"><div class="card-h"><h3>' + esc(c.l) + '</h3><div class="right"><span class="badge ' + (['uma', 'duas'].includes(c.k) ? 'b-err' : 'b-orange') + '">' + ic('alert') + ' ' + nf(c.qtd) + ' ' + c.unid + '</span></div><div class="sub">' + esc(c.desc) + '</div></div><div class="card-b">' +
        '<div class="stats3"><div><b>' + nf(c.qtd) + '</b><span>' + c.unid + '</span></div><div><b>' + pf(c.pct) + '</b><span>do total de ' + (c.unid === 'ligações' ? 'ligações' : 'lead-dias') + '</span></div><div><b>' + nf(c.leads) + '</b><span>leads afetados</span></div></div>' +
        '<div class="small" style="margin:10px 0 4px"><b>Operadores mais envolvidos:</b> ' + c.operadores.slice(0, 4).map(o => '<button class="btn ghost sm" data-cact="filtrarOp" data-v="' + esc(o.operador) + '" data-tip="Filtrar por ' + esc(o.operador) + '">' + esc(o.operador) + ' <span class="badge b-neutral">' + nf(o.n) + '</span></button>').join(' ') + (c.operadores.length > 4 ? ' <span class="muted">+' + (c.operadores.length - 4) + ' operadores</span>' : '') + '</div>' +
        '<div class="small muted" style="margin:8px 0 4px">Exemplos reais da base (mais recentes):</div><div class="tbl-wrap" style="max-height:none;border:1px solid var(--border);border-radius:6px"><table class="tbl"><thead><tr><th>Data</th><th>Operador</th><th>Lead</th><th>Detalhe</th></tr></thead><tbody>' + ex + '</tbody></table></div>' +
        '<div class="actions-row" style="margin-top:10px"><button class="btn primary" data-cact="filtrarOport" data-k="' + c.k + '">' + ic('filter') + ' Filtrar tabela detalhada (' + nf(c.leadDias) + ' lead-dias)</button></div></div></section>';
    };
    return '<div class="info-box">' + ic('help') + '<span>Somente problemas encontrados nos filtros atuais. Percentuais sobre ' + nf(r.leadDias) + ' lead-dias ou ' + nf(r.ligacoes) + ' ligações, conforme a unidade de cada categoria. Os exemplos são registros reais da planilha importada — clique para ver a linha do tempo.</span></div>' +
      (comCasos.length ? '<div class="cad-cats">' + comCasos.map(htmlCat).join('') + '</div>' : '<section class="card empty">' + ic('check', 'big') + '<h2>Nenhuma oportunidade encontrada</h2><p>Nenhum problema nos filtros atuais.</p></section>') +
      (sem.length ? card('Sem ocorrências nos filtros atuais', '', '<div class="actions-row">' + sem.map(c => '<span class="badge b-ok">' + ic('check') + ' ' + esc(c.l) + ': 0</span>').join('') + '</div>') : '');
  }

  /* ---- e-mail ---- */

      '<div class="grid2 cad-email-grid"><section class="card"><div class="card-h"><h3>' + (CS.email.versao === 'exec' ? 'Resumo executivo' : 'Relatório detalhado') + '</h3><div class="sub">Período: ' + esc(K.diaBR(pr.ini)) + ' a ' + esc(K.diaBR(pr.fim)) + ' · operadores: ' + (CS.filtros.operadores.length ? esc(CS.filtros.operadores.join(', ')) : 'todos') + '</div></div><div class="card-b">' +

      '<div class="field" style="margin-top:10px"><span class="lbl">Corpo do e-mail</span><pre class="cad-email" id="cad-email-corpo">' + esc(e.corpo) + '</pre></div></div></section>' +

      card('Números usados no relatório', '', '<dl class="kv">' + [
        ['Período analisado', K.diaBR(pr.ini) + ' a ' + K.diaBR(pr.fim)], ['Operadores', CS.filtros.operadores.length ? CS.filtros.operadores.join(', ') : 'Todos (' + nf(D.res.operadores) + ')'],

        ['Taxa de conformidade', pf(D.res.taxa)], ['Por efetiva > 01:30', nf(D.res.efetiva)], ['Por 3+ ligações', nf(D.res.tres)], ['Tentativas concentradas', nf(D.res.concentradas)], ['Com 1 tentativa', nf(D.res.uma)], ['Com 2 tentativas', nf(D.res.duas)],
      ].map(([k, v]) => '<dt>' + esc(k) + '</dt><dd>' + esc(v) + '</dd>').join('') + '</dl>') +
      card('Exportar', '', '<div class="actions-row"><button class="btn" data-cact="exportarEmailHtml">' + ic('file') + ' Exportar relatório em HTML</button><button class="btn" data-cact="exportar" data-t="completo" data-f="xlsx">' + ic('download') + ' Dados utilizados (XLSX)</button><button class="btn" data-cact="exportar" data-t="detalhamento" data-f="csv">' + ic('download') + ' Dados utilizados (CSV)</button></div>') +

  /* ---- importar ---- */
  const CAMPOS_INFO = {
    created_at: ['created_at', 'Data e hora da ligação. Formatos: AAAA-MM-DD HH:mm(:ss), DD/MM/AAAA HH:mm(:ss), data serial ou célula de data do Excel.'],
    duracao: ['duracao_chamada', 'Duração da chamada. Formatos: HH:mm:ss, mm:ss, número de segundos, fração de dia ou célula de horário do Excel.'],
    user_name: ['user_name', 'Operador / closer responsável pela ligação.'],
    lead_code: ['lead_code', 'Código do lead (identificador principal).'],
    phone: ['phone', 'Telefone do lead (usado quando o código está vazio).'],
    lead_name: ['lead_name', 'Nome do lead (último recurso para identificar o lead).'],
    effective: ['effective', 'Indicação de ligação efetiva: 1/0, Sim/Não ou Verdadeiro/Falso. Sem ela, a exceção da efetiva > 01:30 não pode ser aplicada.'],
    tipo_chamada: ['tipo_chamada', 'Origem ou tipo da ligação (ex.: WhatsApp).'],
  };
  const OBRIG = ['created_at', 'duracao', 'user_name'];
  function faltando(map) {
    const f = [];
    for (const k of OBRIG) if (!map[k]) f.push(k);
    if (!map.lead_code && !map.phone && !map.lead_name) f.push('id');
    return f;
  }
  function msgFaltando(f) {
    return f.map(k => k === 'id'
      ? '<li><b>Identificador do lead</b> — nenhuma das colunas <code>lead_code</code>, <code>phone</code> ou <code>lead_name</code> foi encontrada. É preciso pelo menos uma delas.</li>'
      : '<li><b>' + esc((C.CAMPOS_LIGACOES.find(c => c.key === k) || { label: k }).label) + '</b> — coluna esperada: <code>' + CAMPOS_INFO[k][0] + '</code>. ' + esc(CAMPOS_INFO[k][1]) + '</li>').join('');
  }
  function exemplo(tab, col) {
    if (!col) return '';
    for (const r of tab.rows.slice(0, 50)) { const v = r[col]; if (v != null && String(v).trim() !== '') return v instanceof Date ? C.fmtDataHora(v) : String(v); }
    return '';
  }
  function pagImportar() {
    const a = CS.arq;
    let corpo;
    if (a.status === 'carregando' || CS.processando) {
      corpo = '<div class="file-ok"><div class="skel" style="height:56px"></div><div class="skel" style="height:14px;width:60%"></div><div class="skel" style="height:14px;width:40%"></div><div class="small muted">' + (CS.processando ? 'Processando a cadência…' : 'Lendo ' + esc(a.nome) + '…') + '</div></div>';
    } else if (a.tabela || (a.status === 'erro' && a.pasta)) {
      const tab = a.tabela;
      const falt = tab ? faltando(a.map) : [];
      const recFalt = tab ? ['effective', 'tipo_chamada'].filter(k => !a.map[k]) : [];
      const grade = tab ? '<div class="tbl-wrap" style="max-height:none;border:1px solid var(--border);border-radius:6px"><table class="tbl cad-map"><thead><tr><th>Campo</th><th>Uso</th><th>Coluna do arquivo</th><th>Exemplo lido</th><th>Situação</th></tr></thead><tbody>' +
        C.CAMPOS_LIGACOES.map(c => {
          const obrig = OBRIG.includes(c.key), idc = ['lead_code', 'phone', 'lead_name'].includes(c.key);
          const uso = obrig ? '<span class="badge b-err">Obrigatório</span>' : idc ? '<span class="badge b-acc" data-tip="Pelo menos um entre código, telefone e nome">Identificador</span>' : '<span class="badge b-neutral">Recomendado</span>';
          const ok = !!a.map[c.key];
          const sit = ok ? '<span class="badge b-ok">' + ic('check') + ' Encontrado</span>' : obrig ? '<span class="badge b-err">' + ic('x') + ' Ausente</span>' : '<span class="badge b-warn">' + ic('alert') + ' Não mapeado</span>';
          return '<tr><td><b>' + esc(c.label) + '</b><div class="small muted">' + esc(CAMPOS_INFO[c.key][0]) + '</div></td><td>' + uso + '</td><td><select class="select" data-cmap="' + c.key + '" aria-label="Coluna para ' + esc(c.label) + '"><option value="">— não mapeado —</option>' + tab.headers.map(h => '<option value="' + esc(h) + '"' + (a.map[c.key] === h ? ' selected' : '') + '>' + esc(h) + '</option>').join('') + '</select></td><td class="mono small">' + esc(exemplo(tab, a.map[c.key])) + '</td><td>' + sit + '</td></tr>';
        }).join('') + '</tbody></table></div>' : '';
      corpo = '<div class="file-ok"><div class="file-row">' + ic('file') + '<div class="grow"><div class="nm" title="' + esc(a.nome) + '">' + esc(a.nome) + '</div><div class="inf">' + (tab ? nf(tab.rows.length) + ' linhas lidas · aba "' + esc(a.aba) + '"' + (a.origem ? ' · ' + esc(a.origem) : '') : '') + '</div></div><span class="badge ' + (falt.length ? 'b-err' : 'b-ok') + '">' + (falt.length ? 'Mapeamento pendente' : 'Colunas reconhecidas') + '</span></div>' +
        (a.pasta && a.pasta.abas.length > 1 ? '<div class="field" style="max-width:360px"><label for="caba">Aba da planilha (escolhida automaticamente: prioriza "Dados", "Chamadas" ou "Ligações")</label><select class="select" id="caba" data-caba="1">' + a.pasta.abas.map(n => '<option' + (n === a.aba ? ' selected' : '') + '>' + esc(n) + '</option>').join('') + '</select></div>' : '') +
        (a.erro ? '<div class="err-box" role="alert">' + ic('alert') + '<span>' + esc(a.erro) + '</span></div>' : '') +
        (falt.length ? '<div class="err-box" role="alert">' + ic('alert') + '<div><b>Não foi possível processar: faltam colunas obrigatórias.</b><ul style="margin:6px 0 0;padding-left:18px">' + msgFaltando(falt) + '</ul><div style="margin-top:6px"><b>Como corrigir:</b> escolha a coluna certa nas listas abaixo ou ajuste o cabeçalho da planilha (primeira linha) e importe de novo. Colunas encontradas: ' + esc(tab.headers.join(', ')) + '.</div></div></div>' : '') +
        (!falt.length && recFalt.length ? '<div class="info-box">' + ic('alert') + '<span>Colunas recomendadas não encontradas: <b>' + esc(recFalt.map(k => CAMPOS_INFO[k][0]).join(', ')) + '</b>. ' + (recFalt.includes('effective') ? 'Sem <code>effective</code>, a exceção da ligação efetiva acima de 01:30 não pode ser aplicada — só a regra das 3 ligações.' : '') + '</span></div>' : '') +
        grade +
        '<div class="actions-row"><button class="btn primary" data-cact="processar"' + (tab && !falt.length ? '' : ' disabled') + '>' + ic('play') + ' Confirmar mapeamento e processar</button><button class="btn" data-cact="escolher">' + ic('refresh') + ' Substituir arquivo</button><button class="btn ghost danger" data-cact="remover">' + ic('trash') + ' Remover</button></div></div>';
    } else {
      corpo = '<div class="drop" data-cdrop="1" data-cact="escolher" role="button" tabindex="0" aria-label="Importar a base de ligações">' + ic('upload', 'big') + '<p><b>Importe a base de ligações em XLSX ou CSV</b></p><p class="hint">Arraste o arquivo aqui ou clique para selecionar · leitura 100% local</p><span class="btn sm primary">Selecionar arquivo</span></div>' +
        (a.erro ? '<div class="err-box" role="alert" style="margin-top:10px">' + ic('alert') + '<span>' + esc(a.erro) + '</span></div>' : '');
    }
    const lig = S0.arq && S0.arq.ligacoes;
    const reaproveitar = lig && lig.status === 'ok' && lig.tabela && !(a.origem && a.nome === lig.nome)
      ? '<div class="info-box">' + ic('link') + '<span style="flex:1">A base <b>' + esc(lig.nome) + '</b> já foi importada no Resgate de Monitoria.</span><button class="btn sm" data-cact="usarBaseMonitoria">Usar esta base aqui</button></div>' : '';
    return '<div class="section-title"><h2>Importar base de ligações</h2><p>O módulo de cadência usa somente a base de ligações — não precisa do Kanban. Nada é enviado para a internet.</p></div>' +
      reaproveitar +
      '<section class="card" data-cdrop="1"><div class="card-h"><h3>Base de ligações</h3><div class="sub">Colunas esperadas: <code>lead_code</code>, <code>created_at</code>, <code>duracao_chamada</code>, <code>effective</code>, <code>user_name</code>, <code>lead_name</code>, <code>phone</code>, <code>tipo_chamada</code> (variações de nome são reconhecidas).</div></div><div class="card-b">' + corpo + '</div></section>' +
      '<input type="file" id="cfile" accept=".xlsx,.xls,.xlsm,.csv,text/csv" hidden data-cfile="1">' +
      resultadoImportacao() +
      card('Como a cadência é avaliada', '', regraHtml());
  }
  function resultadoImportacao() {
    const b = CS.base;
    if (!b) return '';
    const porMotivo = new Map();
    for (const x of b.ignorados) { const a = porMotivo.get(x.motivo) || []; a.push(x); porMotivo.set(x.motivo, a); }
    const ign = b.ignorados.length
      ? '<div class="tbl-wrap" style="max-height:340px;border:1px solid var(--border);border-radius:6px"><table class="tbl"><thead><tr><th>Motivo</th><th class="num">Linhas</th><th>Exemplos (linha do arquivo)</th></tr></thead><tbody>' +
        [...porMotivo.entries()].sort((x, y) => y[1].length - x[1].length).map(([m, arr]) => '<tr><td class="cad-wrap-td"><span class="cad-wrap">' + esc(m) + '</span></td><td class="num">' + nf(arr.length) + '</td><td class="cad-wrap-td"><span class="cad-wrap small">' + arr.slice(0, 8).map(x => 'linha ' + x.linha + (x.lead ? ' (' + esc(x.lead) + ')' : '')).join(', ') + (arr.length > 8 ? '…' : '') + '</span></td></tr>').join('') + '</tbody></table></div>'
      : '<div class="small ok-text">' + ic('check') + ' Nenhuma linha ignorada.</div>';
    const inval = b.calls.filter(c => c.durInvalida).length;
    return card('Resultado da importação', esc(b.nomeArquivo) + ' · aba "' + esc(b.aba) + '" · processado em ' + esc(C.fmtDataHora(b.importadoEm)),
      '<div class="stats3 cad-stats4"><div><b>' + nf(b.lidas) + '</b><span>linhas lidas</span></div><div><b>' + nf(b.calls.length) + '</b><span>ligações válidas</span></div><div><b>' + nf(b.ignorados.length) + '</b><span>linhas ignoradas</span></div><div><b>' + nf(b.dups) + '</b><span>possíveis duplicidades</span></div></div>' +
      (inval ? '<div class="info-box" style="margin-top:10px">' + ic('alert') + '<span>' + nf(inval) + ' ligações com <b>duração inválida</b> foram mantidas (contam como tentativa, mas não acionam a exceção). Veja em "Oportunidades de correção".</span></div>' : '') +
      '<h4 style="margin:14px 0 6px;font-size:13px">Linhas ignoradas e motivo</h4>' + ign +
      '<div class="actions-row" style="margin-top:12px"><button class="btn primary" data-act="nav" data-p="cad:visao">' + ic('activity') + ' Ver visão geral da cadência</button></div>');
  }
  function guia() {
    return '<section class="card empty">' + ic('clock', 'big') + '<h2>Cadência de Ligações</h2><p>Descubra quem está seguindo a cadência: 3 ligações no dia por lead — ou uma ligação efetiva acima de 01:30 — por operador, data e lead.</p>' +
      '<ol class="steps guide"><li>Importe a base de ligações (XLSX ou CSV).</li><li>Confira o mapeamento das colunas.</li><li>Clique em <b>Confirmar mapeamento e processar</b>.</li><li>Use os filtros, as tabelas e o relatório para e-mail.</li></ol>' +
      '<div class="actions-row"><button class="btn primary" data-act="nav" data-p="cad:importar">' + ic('upload') + ' Importar base de ligações</button></div></section>';
  }

  function pagina() {
    const p = pag();
    if (p === 'cad:importar') return pagImportar();
    if (CS.processando) return '<div class="kpis">' + Array.from({ length: 12 }, () => '<div class="card kpi"><div class="skel" style="height:12px;width:60%"></div><div class="skel" style="height:26px;width:45%;margin-top:10px"></div></div>').join('') + '</div>';
    if (!CS.base) return guia();
    const D = dados();
    const titulo = PAGS.find(x => x[0] === p) || PAGS[0];
    let h = painelFiltros();
    h += '<div class="section-title"><h2>' + esc(titulo[1]) + '</h2><p>' + esc(nf(D.res.leadDias) + ' lead-dias · ' + nf(D.res.ligacoes) + ' ligações · conformidade ' + pf(D.res.taxa)) + '</p></div>';
    if (p === 'cad:operadores') h += pagOperadores(D);
    else if (p === 'cad:dias') h += pagDias(D);
    else if (p === 'cad:leads') h += pagLeads(D);
    else if (p === 'cad:oport') h += pagOport(D);
    else if (p === 'cad:email') h += pagEmail(D);
    else h += pagVisao(D);
    return h;
  }

  /* ============================ painel lateral ============================ */
  function sheetLead(g) {
    const a = aval();
    const outros = a.grupos.filter(x => x.leadKey === g.leadKey && x.key !== g.key).sort((x, y) => (x.dia < y.dia ? 1 : -1)).slice(0, 12);
    const kv = [
      ['Data', esc(g.dataBR)], ['Operador', esc(g.operador) + (g.supervisor ? ' <span class="muted small">· ' + esc(g.supervisor) + '</span>' : '')],
      ['Código do lead', g.lead_code ? '<span class="mono">' + esc(g.lead_code) + '</span>' + copiaBtn(g.lead_code, 'código') : '<span class="muted">—</span>'],
      ['Telefone', g.phone ? '<span class="mono">' + esc(g.phone) + '</span>' + copiaBtn(g.phone_norm, 'telefone') : '<span class="muted">—</span>'],
      ['Tipo de chamada', esc(g.tipos.join(', ')) || '<span class="muted">—</span>'],
      ['Status', badgeStatus(g) + ' <span class="small">' + esc(g.classe) + '</span>'],
      ['Critério atendido', esc(K.CRIT[g.criterio])], ['Distribuição', badgeDist(g)],
    ];
    if (g.motivo) kv.push(['Motivo', esc(g.motivo)]);
    if (g.oportunidade) kv.push(['Oportunidade', esc(g.oportunidade)]);
    if (g.outrosOperadores.length) kv.push(['Outros operadores no dia', esc(g.outrosOperadores.join(', '))]);

  /* ============================ imagem (canvas) ============================ */

  }
  function gerarImagem() {

          { t: 'Mais lead-dias sem cadência', itens: ops.slice().sort((a, b) => b.nao - a.nao).filter(o => o.nao > 0).slice(0, top), cor: cores.err, v: o => nf(o.nao), u: 'sem cad.', s: o => nf(o.uma) + ' com 1 tent. · ' + nf(o.duas) + ' com 2 · ' + pf(o.taxa) + ' conf.', bar: o => o.nao / Math.max(1, ...ops.map(x => x.nao)), barCor: cores.err },

      } else {

        colunas = [
          { t: 'Maior conformidade (' + minTxt + ')', itens: rk.slice(0, top), cor: cores.ok, v: o => pf(o.taxa), u: '', s: o => nf(o.seguidas) + ' de ' + nf(o.leadDias) + ' lead-dias', bar: o => o.taxa / 100, barCor: cores.ok },
          { t: 'Mais cadências seguidas (lead-dias)', itens: ops.slice().sort((a, b) => b.seguidas - a.seguidas || b.taxa - a.taxa).slice(0, top), cor: cores.accent, v: o => nf(o.seguidas), u: 'seguidas', s: o => pf(o.taxa) + ' conf. · ' + nf(o.leadDias) + ' lead-dias', bar: o => o.seguidas / Math.max(1, ...ops.map(x => x.seguidas)), barCor: cores.accent },
        ];
      }
    }
    const ROW = 84, GAP = 12, HEAD = 326, FOOT = 74;
    const nLinhas = colunas ? Math.max(1, ...colunas.map(c => c.itens.length)) : Math.max(1, tabela.itens.length);
    const H = HEAD + (colunas ? nLinhas * (ROW + GAP) : 46 + nLinhas * 52) + FOOT;
    const cv = document.createElement('canvas');

          } else {

          }
          // valores à direita
          const vx = x0 + colW - 20;
          ctx.textAlign = 'right';
          ctx.font = '400 16px ' + FONTE; const uW = col.u ? ctx.measureText(' ' + col.u).width : 0;
          ctx.fillStyle = col.cor; ctx.font = '800 30px ' + FONTE; ctx.fillText(col.v(o), vx - uW, y + 38);
          if (col.u) { ctx.fillStyle = cores.muted; ctx.font = '400 16px ' + FONTE; ctx.fillText(' ' + col.u, vx, y + 38); }
          ctx.fillStyle = cores.muted; ctx.font = '400 16px ' + FONTE; ctx.fillText(col.s(o), vx, y + 66);
          ctx.textAlign = 'left';
          const textoMax = colW - 84 - Math.max(250, ctx.measureText(col.s(o)).width + 30);

  function exportar(tipo, fmt) {

    else if (tipo === 'resumo') abas = [tabResumo(D), tabParametros()];
    else if (tipo === 'operadores') abas = [tabOperadores(D)];
    else if (tipo === 'dias') abas = [tabDias(D)];
    else if (tipo === 'detalhamento') abas = [tabDetalhamento('Detalhamento', D.gs)];
    else if (tipo === 'naoConf') abas = [tabDetalhamento('Nao_Conformes', D.gs.filter(g => !g.seguida))];

  /* ================================ importação ================================ */
  function escolherAba(abas) {
    return abas.find(n => /^dados$/i.test(n.trim())) || abas.find(n => /dados/i.test(n)) || abas.find(n => /chamad/i.test(n)) || abas.find(n => /liga[cç]/i.test(C.semAcento(n))) || abas[0];
  }
  function limparBase() {
    CS.base = null; ver++; CS.sheet = null; CS.sheetPilha = []; CS.modal = null; CS.img.url = '';
    CS.filtros = K.filtrosVazios(); CS.opts = { ignorarDup: false, excluirUltimo: false };
    CS.det.page = 1; CS.dias.page = 1; CS.expand = {};
  }
  async function carregarArquivo(file) {
    limparBase();
    CS.arq = vazioArq();
    const a = CS.arq;
    a.status = 'carregando'; a.nome = file.name;
    render();
    await new Promise(r => setTimeout(r, 30));
    try {
      if (file.size > 150 * 1024 * 1024) throw new Error('Arquivo muito grande (mais de 150 MB). Divida a extração por período e importe de novo.');
      a.pasta = await P.abrirArquivo(file);
      if (!a.pasta.abas.length) throw new Error('A planilha não tem abas.');
      await lerAba(escolherAba(a.pasta.abas));
      return;
    } catch (e) {
      a.status = 'erro';
      a.erro = 'Não foi possível ler o arquivo "' + file.name + '": ' + ((e && e.message) || e) + ' Formatos aceitos: .xlsx e .csv (separador ; , ou tabulação). Se for .xls antigo, abra no Excel e salve como .xlsx.';
      a.pasta = null; a.tabela = null;
    }
    render();
  }
  async function lerAba(aba) {
    const a = CS.arq;
    a.status = 'carregando'; a.aba = aba; a.erro = '';
    render();
    await new Promise(r => setTimeout(r, 30));
    try {
      a.tabela = await a.pasta.lerAba(aba);
      if (!a.tabela.rows.length) throw new Error('A aba "' + aba + '" está vazia (só cabeçalho ou nenhuma linha). Escolha outra aba.');
      a.map = C.detectarColunas(a.tabela.headers, C.CAMPOS_LIGACOES);
      a.status = 'ok';
    } catch (e) {
      a.status = 'erro';
      a.tabela = null;
      a.erro = (e && e.message) || 'Não foi possível ler a aba.';
    }
    render();
  }
  function processar() {
    const a = CS.arq;
    if (!a.tabela) return;
    const falt = faltando(a.map);
    if (falt.length) { render(); toast('Faltam colunas obrigatórias — veja o aviso na tela.'); return; }
    CS.processando = true;
    render();
    setTimeout(() => {
      try {
        const p = K.prepararChamadas(a.tabela.rows, a.map);
        if (!p.calls.length) {
          const mot = p.ignorados.length ? p.ignorados[0].motivo : 'nenhuma linha com dados';
          throw new Error('Nenhuma ligação válida encontrada: todas as ' + nf(p.lidas) + ' linhas foram ignoradas (ex.: ' + mot + '). Confira se as colunas de data, operador e lead foram associadas corretamente no mapeamento.');
        }
        limparBase();
        CS.base = Object.assign(p, { nomeArquivo: a.nome, aba: a.aba, importadoEm: new Date(), map: Object.assign({}, a.map), parcial: K.detectarParcial(p.calls, a.nome, new Date()) });
        ver++;
        CS.processando = false;
        S0.pagina = 'cad:visao';
        render();
        window.scrollTo(0, 0);
        const r = dados().res;
        toast(nf(p.calls.length) + ' ligações processadas · ' + nf(r.leadDias) + ' lead-dias · conformidade ' + pf(r.taxa) + (p.ignorados.length ? ' · ' + nf(p.ignorados.length) + ' linhas ignoradas' : '') + '.');
      } catch (e) {
        CS.processando = false;
        a.erro = 'Falha ao processar: ' + ((e && e.message) || e);
        console.error(e);
        render();
      }
    }, 40);
  }

    const t = e.target;
    if (t.matches && t.matches('input[type="checkbox"]')) return; // tratado no change
    if (t.closest && t.closest('label.ms-opt')) return;
    if (t.closest && t.closest('button.help') && !t.closest('button.help').dataset.cact) return; // "?" só mostra a explicação
    const el = t.closest && t.closest('[data-cact]');
    if (CS.pop && !t.closest('.cpop') && !(el && el.dataset.cact === 'pop')) { CS.pop = null; if (!el) { render(); return; } }
    if (!el || el.tagName === 'SELECT' || el.disabled) return;
    const f = ACOES[el.dataset.cact];
    if (f) { e.preventDefault(); e.stopPropagation(); f(el); }
  });
  document.addEventListener('change', e => {
    if (!ativo()) return;
    const t = e.target, d = t.dataset || {};
    if (d.cmsall) { CS.filtros[d.cmsall] = []; mudouFiltro(); render(); return; }
    if (d.cms) {
      const arr = CS.filtros[d.cms], v = d.v;
      CS.filtros[d.cms] = t.checked ? arr.concat([v]) : arr.filter(x => C.normName(x) !== C.normName(v));
      mudouFiltro(); render(); return;
    }
    if (d.ccol) {
      const k = d.ccol;
      CS.det.cols = t.checked ? DCOLS.map(c => c.k).filter(c => c === k || CS.det.cols.includes(c)) : CS.det.cols.filter(c => c !== k);
      lsSet('cad-cols', CS.det.cols); render(); return;
    }
    if (d.csize) { CS.det.size = Number(t.value); CS.det.page = 1; lsSet('cad-pag', CS.det.size); render(); return; }
    if (d.caba) { lerAba(t.value); return; }
    if (d.cmap) { if (t.value) CS.arq.map[d.cmap] = t.value; else delete CS.arq.map[d.cmap]; render(); return; }
    if (d.cfile) { const f = t.files && t.files[0]; t.value = ''; if (f) carregarArquivo(f); return; }
    if (d.cf && (t.tagName === 'SELECT' || t.type === 'date')) {
      CS.filtros[d.cf] = t.value;
      if (CS.filtros.dataIni && CS.filtros.dataFim && CS.filtros.dataIni > CS.filtros.dataFim) toast('A data inicial é posterior à data final — nenhum resultado.');
      mudouFiltro(); render();
    }
  });
  document.addEventListener('input', e => {
    if (!ativo()) return;
    const t = e.target, d = t.dataset || {};
    if (d.cpopbusca) { CS.popBusca = t.value; render(); return; }
    if (d.cf && t.tagName === 'INPUT' && t.type !== 'date') {
      CS.filtros[d.cf] = t.value; mudouFiltro();
      clearTimeout(deb); deb = setTimeout(render, 250);
    }
  });
  document.addEventListener('keydown', e => {
    if (!ativo()) return;
    const t = e.target;
    if (e.key === 'Escape') {
      if (CS.pop) { CS.pop = null; render(); return; }
      if (CS.modal) { CS.modal = null; render(); return; }
      if (CS.sheet) { CS.sheet = null; CS.sheetPilha = []; render(); return; }
      if (CS.filtrosAbertos && window.innerWidth < 1024) { CS.filtrosAbertos = false; render(); return; }
    }
    if ((e.key === 'Enter' || e.key === ' ') && t.matches && t.matches('tr[data-cact], .drop[data-cact], .kpi[data-cact]')) {
      e.preventDefault();
      const f = ACOES[t.dataset.cact]; if (f) f(t);
    }
    if (e.key === 'Enter' && t.dataset && t.dataset.cpopbusca) {
      e.preventDefault();
      const k = (CS.pop || '').replace('ms:', '');
      if (k && CS.popBusca.trim()) ACOES.msTodosBusca({ dataset: { k } });
    }
  });
  document.getElementById('cmodalBg').addEventListener('click', e => { if (e.target.id === 'cmodalBg') { CS.modal = null; render(); } });
  document.addEventListener('dragover', e => { const z = e.target.closest && e.target.closest('[data-cdrop]'); if (z) { e.preventDefault(); const d = z.querySelector('.drop') || (z.classList.contains('drop') ? z : null); if (d) d.classList.add('drag'); } });
  document.addEventListener('dragleave', e => { const z = e.target.closest && e.target.closest('.drop[data-cdrop]'); if (z) z.classList.remove('drag'); });
  document.addEventListener('drop', e => {
    const z = e.target.closest && e.target.closest('[data-cdrop]');
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (z && f) { e.preventDefault(); carregarArquivo(f); }
  });

  /* =============================== integração =============================== */
  window.CadUI = {
    navItems: () => {
      const D = CS.base ? dados() : null;
      return PAGS.map(([k, l, i]) => [k, l, i, D ? ({ 'cad:operadores': D.res.operadores, 'cad:leads': D.res.leadDias, 'cad:oport': D.res.nao }[k]) : undefined]);
    },
    header,
    pagina,
    posRender: on => { renderSheet(on); renderModal(on); },
    // ponto de entrada para testes automatizados (somente leitura)
    _estado: CS, _dados: dados, _aval: aval,
  };
  render();
})();

</script>
</body>
</html>
