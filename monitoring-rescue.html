      '<p style="margin:0 0 6px">' + nf(q.length) + ' Closers cadastrados, <b>' + nf(comSup) + '</b> com supervisor preenchido. O que estiver na tabela vale mais que o Kanban.</p>' +
      '<p class="small muted" style="margin:0">Para editar: abra o arquivo <code>monitoring-rescue.html</code> no Bloco de Notas, procure <code>EQUIPES DOS CLOSERS</code> (logo no começo) e preencha <code>[\'Closer\', \'Supervisor\', \'Equipe\']</code>. Salve e recarregue a página.</p>');
  }
  function cardRenomes() {
    const lista = S.renomes.length
      ? S.renomes.map((r, i) => '<div class="cand"><div class="grow"><b>' + esc(r.de) + '</b> → <b>' + esc(r.para) + '</b></div><button class="btn sm ghost danger" data-act="renomeDel" data-i="' + i + '" aria-label="Remover troca ' + esc(r.de) + '">' + ic('trash') + ' Remover</button></div>').join('')
      : '<div class="muted small">Nenhuma troca cadastrada.</div>';
    return card('Troca de supervisor', 'Quando alguém sai mas o Kanban ainda mostra o nome antigo: o painel troca o nome só na tela e nas exportações (a planilha não é alterada). Fica salvo neste navegador.',
      '<div style="display:grid;gap:8px">' + lista +
      '<div class="actions-row"><div class="field" style="flex:1;min-width:160px"><label for="ren-de">Quem saiu (como está no Kanban)</label><input class="input" id="ren-de" placeholder="Ex.: Luciana Jacomini"></div>' +
      '<div class="field" style="flex:1;min-width:160px"><label for="ren-para">Quem assumiu</label><input class="input" id="ren-para" placeholder="Ex.: Tiago Benatti"></div>' +
      '<button class="btn" data-act="renomeAdd" style="align-self:flex-end">' + ic('check') + ' Adicionar troca</button></div></div>');
  }
  function guia(comBotoes) {
    return '<section class="card empty">' + ic('target', 'big') + '<h2>Encontre as ligações efetivas de 1min30 ou mais</h2><p>Cruze a base de ligações com o Kanban para achar os códigos dos leads com ligação efetiva e ir direto para a monitoria no Dryve.</p>' +
      '<ol class="steps guide"><li>Importe a base de ligações.</li><li>Importe a base do Kanban.</li><li>Confira o mapeamento das colunas.</li><li>Clique em <b>Processar bases</b>.</li><li>Use os filtros para localizar ligações com pelo menos 1min30.</li></ol>' +
      (comBotoes ? '<div class="actions-row"><button class="btn primary" data-act="nav" data-p="importar">' + ic('upload') + ' Importar bases</button><button class="btn" data-act="demo">' + ic('play') + ' Ver dados de demonstração</button></div>' : '<div class="actions-row"><button class="btn" data-act="demo">' + ic('play') + ' Ver dados de demonstração</button></div>') + '</section>';
  }

  function renderPagina() {
    let h = '';
    if (S.dados && S.dados.demo) h += '<div class="demo-banner" role="note">' + ic('alert') + ' Dados de demonstração — fictícios, só para conhecer o painel. Serão substituídos ao importar as bases reais.<button class="btn sm" data-act="sairDemo" style="margin-left:auto">Sair da demonstração</button></div>';
    if (ehCadencia()) { content.innerHTML = window.CadUI.pagina(); return; }
    if (S.pagina === 'importar') h += pagImportar();
    else if (S.processando) h += skeletonKpis();
    else if (!S.dados) h += guia(true);
    else {
      const rows = filtradas();
      h += painelFiltros();
      const titulo = PAGINAS.find(p => p[0] === S.pagina);
      if (S.pagina !== 'visao') h += '<div class="section-title"><h2>' + titulo[1] + '</h2></div>';
      if (S.pagina === 'visao') h += pagVisao(rows);
      else if (S.pagina === 'ligacoes') h += pagLigacoes(rows);
      else if (S.pagina === 'closers') h += pagClosers(rows);
      else if (S.pagina === 'etapas') h += pagEtapas(rows);
      else if (S.pagina === 'perdidos') h += pagPerdidos(rows);
      else if (S.pagina === 'naoloc') h += pagNaoLoc(rows);
      else if (S.pagina === 'qualidade') h += pagQualidade(rows);
    }
    content.innerHTML = h;
  }

  /* ============================ sheet de detalhes ============================ */
  function renderSheet() {
    const el = document.getElementById('sheet');
    if (S.sheetId == null || !S.dados) { el.classList.remove('open'); el.innerHTML = ''; return; }
    const r = S.dados.ligacoes[S.sheetId];
    if (!r) { S.sheetId = null; el.classList.remove('open'); return; }
    const todasDoLead = S.dados.ligacoes.filter(x => x.lead_key === r.lead_key).sort((a, b) => (a.ts || 0) - (b.ts || 0));
    const ef = todasDoLead.filter(x => x.ligacao_efetiva === 'Sim').length;
    const acum = todasDoLead.reduce((s, x) => s + (x.duracao_segundos || 0), 0);
    const kv = [
      ['Nome do lead', esc(r.lead_name)], ['Telefone', '<span class="mono">' + esc(r.phone) + '</span>' + (r.phone ? acoesCopia(r.phone_norm, 'telefone') : '')],
      ['Código', '<span class="mono">' + esc(r.lead_code || r.reference_code) + '</span>' + (r.lead_code ? acoesCopia(r.lead_code, 'código') : '')],
      ['Closer da ligação', esc(r.closer_ligacao)], ['Closer do Kanban', esc(r.closer_kanban) + (r.divergencia_closer === 'Sim' ? ' <span class="badge b-warn">' + ic('alert') + ' Divergente</span>' : '')],
      ['Etapa do Board', esc(r.etapa)], ['Status Geral', esc(r.status_geral) + (r.lead_perdido === 'Sim' ? ' <span class="badge b-err">Perdido</span>' : '')],
      ['Motivo da Perda', esc(r.motivo_perda)], ['Data da ligação', esc(r.data_hora_ligacao)], ['Duração', (r.duracao_segundos == null ? '<span class="badge b-warn">Revisar duração</span> <span class="muted">(' + esc(r.duracao_original || 'vazio') + ')</span>' : C.fmtDuracao(r.duracao_segundos)) + ' ' + badgeEfetiva(r)],
      ['Tipo da chamada', esc(r.tipo_chamada)], ['Effective original', esc(r.effective_original)],
      ['Método do cruzamento', esc(r.metodo_cruzamento) + ' ' + badgeStatus(r) + (r.criterio ? ' <span class="muted small">(' + esc(r.criterio) + ')</span>' : '')],
    ];
    if (r.motivo_falha) kv.push(['Por que não localizou', '<b>' + esc(r.motivo_resumo) + '</b><br>' + esc(r.motivo_falha)]);
    kv.push(['Supervisor do Closer', esc(r.supervisor_closer)]);
    el.innerHTML = '<div class="sheet-h"><div style="flex:1;min-width:0"><h2 id="sheetTitle">' + esc(r.lead_name || '(sem nome)') + '</h2><p>Detalhes da ligação e histórico do lead</p></div><button class="btn icon ghost" data-act="fecharSheet" aria-label="Fechar detalhes">' + ic('x') + '</button></div>' +
      '<div class="sheet-b"><div class="actions-row">' + linksDryve(r, false) + (r.metodo_cruzamento === 'Associação manual' ? '<button class="btn sm danger" data-act="desassociar" data-ch="' + esc(r.chave) + '">Desfazer associação manual</button>' : '') + (r.status_cruzamento !== 'Localizado' ? '<button class="btn sm" data-act="buscarKanban" data-ch="' + esc(r.chave) + '">' + ic('link') + ' Associar ao Kanban</button>' : '') + '</div>' +
      '<dl class="kv">' + kv.map(([k, v]) => '<dt>' + k + '</dt><dd>' + (v || '<span class="muted">—</span>') + '</dd>').join('') + '</dl>' +
      '<div class="stats3"><div><b>' + nf(todasDoLead.length) + '</b><span>ligações do lead</span></div><div><b>' + nf(ef) + '</b><span>com 1min30 ou mais</span></div><div><b>' + C.fmtDuracao(acum) + '</b><span>duração acumulada</span></div></div>' +
      '<div class="small muted">Primeira ligação: <b>' + esc(todasDoLead[0].data_hora_ligacao || '—') + '</b> · Última: <b>' + esc(todasDoLead[todasDoLead.length - 1].data_hora_ligacao || '—') + '</b></div>' +
      '<div><h3 style="font-size:14px;margin:0 0 8px">Linha do tempo das ligações</h3><ol class="timeline">' + todasDoLead.map(x => '<li class="' + (x.id === r.id ? 'cur' : '') + '"><span class="dot ' + (x.ligacao_efetiva === 'Sim' ? 'ok' : 'no') + '"></span><div class="t">' + esc(x.data_hora_ligacao || 'Sem data') + ' · ' + C.fmtDuracao(x.duracao_segundos) + (x.ligacao_efetiva === 'Sim' ? ' <span class="badge b-ok">1min30+</span>' : '') + (x.id === r.id ? ' <span class="badge b-acc">esta ligação</span>' : '') + '<div class="m">' + esc(x.closer_ligacao) + (x.tipo_chamada ? ' · ' + esc(x.tipo_chamada) : '') + '</div></div></li>').join('') + '</ol></div></div>';
    el.classList.add('open');
  }

  /* ================================= modal ================================= */
  function renderModal() {
    const bg = document.getElementById('modalBg'), m = document.getElementById('modal');
    if (!S.modal) { bg.classList.remove('open'); m.innerHTML = ''; return; }
    if (S.modal.tipo === 'mapa') {
      const base = S.modal.base, a = S.arq[base];
      const campos = base === 'ligacoes' ? C.CAMPOS_LIGACOES : C.CAMPOS_KANBAN;
      const map = S.modal.map;
      const falt = base === 'ligacoes' ? C.faltandoLigacoes(map) : C.faltandoKanban(map);
      m.innerHTML = '<div class="modal-h"><div style="flex:1"><h2 id="modalTitle">Mapeamento de colunas — ' + (base === 'ligacoes' ? 'Base de ligações' : 'Base do Kanban') + '</h2><p>Associe cada campo esperado a uma coluna do arquivo "' + esc(a.nome) + '". Campos com <span class="req">*</span> são indispensáveis.</p></div><button class="btn icon ghost" data-act="fecharModal" aria-label="Fechar">' + ic('x') + '</button></div>' +
        '<div class="modal-b">' + (falt.length ? '<div class="err-box">' + ic('alert') + '<span>Faltando: ' + esc(falt.join(', ')) + '</span></div>' : '<div class="info-box">' + ic('check') + '<span>Todos os campos indispensáveis estão mapeados.</span></div>') +
        '<div class="map-grid">' + campos.map(c => '<label for="map-' + c.key + '">' + esc(c.label) + (c.obrigatorio ? ' <span class="req">*</span>' : '') + '</label><select class="select" id="map-' + c.key + '" data-map="' + c.key + '"><option value="">— não mapeado —</option>' + a.tabela.headers.map(h => '<option value="' + esc(h) + '"' + (map[c.key] === h ? ' selected' : '') + '>' + esc(h) + '</option>').join('') + '</select>').join('') + '</div>' +
        '<div class="small muted">Colunas encontradas no arquivo: ' + a.tabela.headers.map(esc).join(', ') + '</div></div>' +
        '<div class="modal-f"><button class="btn" data-act="fecharModal">Cancelar</button><button class="btn primary" data-act="salvarMapa">Salvar mapeamento</button></div>';
    } else if (S.modal.tipo === 'associar') {
      const r = S.dados.ligacoes.find(x => x.chave === S.modal.chave);
      const q = C.normName(S.modal.busca), qd = C.normPhone(S.modal.busca), qc = C.normCode(S.modal.busca);
      const res = q.length >= 2 || qd.length >= 4 ? S.dados.K.filter(k => (q.length >= 2 && k.nomeN.includes(q)) || (qd.length >= 4 && (k.phones.some(p => p.includes(qd)) || k.code.includes(qc)))).slice(0, 30) : [];
      m.innerHTML = '<div class="modal-h"><div style="flex:1"><h2 id="modalTitle">Associar ligação ao Kanban</h2><p>' + esc((r && (r.lead_name || r.lead_code)) || '') + ' · ' + esc(r ? r.data_hora_ligacao : '') + ' · ' + esc(r ? r.closer_ligacao : '') + '</p></div><button class="btn icon ghost" data-act="fecharModal" aria-label="Fechar">' + ic('x') + '</button></div>' +
        '<div class="modal-b"><div class="field"><label for="assoc-busca">Buscar no Kanban por nome, telefone ou código</label><div class="input-ic">' + ic('search') + '<input class="input" id="assoc-busca" data-assocbusca="1" value="' + esc(S.modal.busca) + '" placeholder="Digite pelo menos 2 letras ou 4 números"></div></div>' +
        (res.length ? res.map(k => htmlCandidato(r, k.idx, false)).join('') : '<div class="muted small">' + (q.length >= 2 || qd.length >= 4 ? 'Nenhum registro encontrado.' : 'Digite para buscar.') + '</div>') + '</div>' +
        '<div class="modal-f"><button class="btn" data-act="fecharModal">Fechar</button></div>';
    }
    bg.classList.add('open');
  }

  /* ================================ render ================================ */
  function render() {
    const a = document.activeElement;
    const foco = a && a.id ? { id: a.id, s: a.selectionStart, e: a.selectionEnd } : null;
    const scrollPop = document.querySelector('.pop .ms-list');
    const sp = scrollPop ? scrollPop.scrollTop : 0;
    renderNav();
    renderHeader();
    renderPagina();
    renderSheet();
    renderModal();
    if (window.CadUI) window.CadUI.posRender(ehCadencia());
    const np = document.querySelector('.pop .ms-list');
    if (np) np.scrollTop = sp;
    if (foco) {
      const el = document.getElementById(foco.id);
      if (el && el !== document.activeElement) {
        el.focus({ preventScroll: true });
        try { if (foco.s != null && el.setSelectionRange) el.setSelectionRange(foco.s, foco.e); } catch (e) { /* input date/number */ }
      }
    }
  }

  /* ============================== importacao ============================== */
  async function carregarArquivo(base, file) {
    const a = S.arq[base] = vazioArq();
    a.status = 'carregando'; a.nome = file.name;
    render();
    await new Promise(r => setTimeout(r, 30));
    try {
      if (file.size > 150 * 1024 * 1024) throw new Error('Arquivo muito grande (mais de 150 MB).');
      a.pasta = await P.abrirArquivo(file);
      if (!a.pasta.abas.length) throw new Error('A planilha não tem abas.');
      const preferida = a.pasta.abas.find(n => /dados|liga|chamad|kanban/i.test(n)) || a.pasta.abas[0];
      await lerAba(base, preferida);
    } catch (e) {
      a.status = 'erro';
      a.erro = (e && e.message) || 'Não foi possível ler o arquivo.';
      a.pasta = null;
    }
    render();
  }
  async function lerAba(base, aba) {
    const a = S.arq[base];
    a.status = 'carregando'; a.aba = aba; a.erro = '';
    render();
    await new Promise(r => setTimeout(r, 30));
    try {
      a.tabela = await a.pasta.lerAba(aba);
      if (!a.tabela.rows.length) throw new Error('A aba "' + aba + '" está vazia.');
      a.map = C.detectarColunas(a.tabela.headers, base === 'ligacoes' ? C.CAMPOS_LIGACOES : C.CAMPOS_KANBAN);
      a.status = 'ok';
      const falt = base === 'ligacoes' ? C.faltandoLigacoes(a.map) : C.faltandoKanban(a.map);
      if (falt.length) S.modal = { tipo: 'mapa', base, map: { ...a.map } };
    } catch (e) {
      a.status = 'erro';
      a.erro = (e && e.message) || 'Não foi possível ler a aba.';
    }
    render();
  }

  function kid(k) { return k.f.id ? 'id:' + k.f.id : k.code ? 'code:' + k.code : 'idx:' + k.idx; }
  function cruzarTudo() {
    const d = S.dados;
    const fonte = d.demo ? S.manuaisDemo : S.manuais;
    const manuais = {};
    for (const [ch, id] of Object.entries(fonte)) { const i = d.kidIdx.get(id); if (i != null) manuais[ch] = i; }
    d.ligacoes = C.cruzar(d.linhas, d.mapL, d.K, manuais, d.demo ? [] : window.MR_EQUIPES || []);
    ver++;
  }
  function prepararK(linhasK, mapK) {
    const K = C.aplicarRenomes(C.prepararKanban(linhasK, mapK), S.renomes);
    const kidIdx = new Map();
    for (const k of K) kidIdx.set(kid(k), k.idx);
    return { K, kidIdx };
  }
  function reaplicarRenomes() {
    lsSet('mr-renomes', S.renomes);
    if (!S.dados) return;
    Object.assign(S.dados, prepararK(S.dados.linhasK, S.dados.mapK));
    cruzarTudo();
  }
  function montarDados(linhasL, mapL, linhasK, mapK, demo) {
    S.dados = Object.assign({ linhas: linhasL, mapL, linhasK, mapK, ligacoes: [], importadoEm: new Date(), demo }, prepararK(linhasK, mapK));
    cruzarTudo();
    S.filtros = C.filtrosVazios();
    S.tab.sel = new Set(); S.tab.page = 1; S.expand = {}; S.naoloc.page = 1; S.perdPage = 1;
  }
  function processar() {
    const L = S.arq.ligacoes, K = S.arq.kanban;
    for (const [base, a] of [['ligacoes', L], ['kanban', K]]) {
      const falt = base === 'ligacoes' ? C.faltandoLigacoes(a.map) : C.faltandoKanban(a.map);
      if (falt.length) { S.modal = { tipo: 'mapa', base, map: { ...a.map } }; render(); return; }
    }
    S.processando = true;
    S.pagina = 'visao';
    render();
    setTimeout(() => {
      try {
        montarDados(L.tabela.rows, L.map, K.tabela.rows, K.map, false);
        toast(nf(S.dados.ligacoes.length) + ' ligações processadas · ' + nf(S.dados.ligacoes.filter(r => r.ligacao_efetiva === 'Sim').length) + ' com 1min30 ou mais.');
      } catch (e) {
        S.pagina = 'importar';
        L.erro = 'Falha ao processar: ' + ((e && e.message) || e);

      render();

  }

      kanban.push({
        'Nome do Lead': pick(nomes) + ' ' + pick(sobren) + ' ' + pick(sobren), 'Telefone': '55' + (11 + Math.floor(rnd() * 80)) + '9' + String(Math.floor(rnd() * 1e8)).padStart(8, '0'),
        'ID': 'demo-' + (100000 + i), 'Loja': 'Loja Demo', 'Tipo': pick(['Inbound - Receptivo', 'Outbound']), 'Closer': pick(closers), 'Supervisor': pick(['Supervisão A', 'Supervisão B']),
        'SDR': pick(['Atendimento Automatizado', 'SDR Demo']), 'Supervisão SDR': '', 'Etapa do Board': etapa, 'Nome do Board': 'Assinatura de veículos - Closer',
        'Status Geral': etapa === 'Perdido' ? 'LOST' : etapa === 'Assinado' ? 'GAIN' : 'ONGOING', 'Motivo da Perda': etapa === 'Perdido' ? pick(motivos) : '',

        'Temperatura': pick(['Frio', 'Morno', 'Quente']), 'reference_code': String(3100000 + i), 'modelo': pick(['Renault Kwid 1.0', 'VW Tera 1.0', 'Fiat Mobi 1.0']), 'plano': pick(['24', '36', '48']),
      });
    }
    const lig = [];

      let s = rnd() < 0.6 ? Math.floor(rnd() * 90) : 90 + Math.floor(rnd() * 1200);
      if (i % 97 === 0) s = 90;
      const closer = rnd() < 0.9 ? k.Closer : pick(closers);
      const linha = {

  const tabLig = (nome, rows) => ({ nome, colunas: EXP_COLS.map(c => c[0]), linhas: ordenarExport(rows).map(r => EXP_COLS.map(c => c[1](r))) });
  const ordenarExport = rows => rows.slice().sort((a, b) => (b.ts || 0) - (a.ts || 0));
  function tabRanking(rows) {
    const g = C.agrupar(rows, r => r.closer_ligacao).sort((a, b) => b.efetivas - a.efetivas);
    return { nome: 'Ranking_Closers', colunas: ['Posição', 'Closer', 'Supervisor', 'Total de ligações', 'Ligações 1min30 ou mais', '% 1min30 ou mais', 'Duração média', 'Duração média (segundos)', 'Leads únicos', 'Leads perdidos atendidos', 'Etapas distintas', 'Divergências com Kanban'],
      linhas: g.map((x, i) => [i + 1, x.label, x.linhas[0].supervisor_closer, x.total, x.efetivas, Math.round(x.pct * 10) / 10, C.fmtDuracao(x.media), x.media == null ? '' : Math.round(x.media), x.leads, x.perdidos, x.etapas, x.divergencias]) };
  }
  function tabEtapas(rows) {

  function tabResumo(rows) {
    const k = C.kpis(rows);

    return { nome: 'Resumo', colunas: ['Indicador', 'Valor'], linhas: [
      ['Gerado em', C.fmtDataHora(new Date())], ['Base importada em', C.fmtDataHora(S.dados.importadoEm)], ['Dados de demonstração', S.dados.demo ? 'Sim' : 'Não'],
      ['Filtros ativos', ch.join(' | ') || 'Nenhum'], ['Total de ligações', k.total], ['Ligações com 1min30 ou mais', k.efetivas], ['% com 1min30 ou mais', Math.round(k.pctEfetivas * 10) / 10],
      ['Ligações abaixo de 1min30', k.abaixo], ['Durações inválidas', k.invalidas], ['Duração média', C.fmtDuracao(k.mediaDur)], ['Leads únicos', k.leadsUnicos], ['Closers', k.closers],
      ['Leads perdidos com ligação efetiva', k.perdidosComEfetiva], ['Localizados no Kanban', k.localizados], ['Taxa de localização (%)', Math.round(k.taxaLocalizacao * 10) / 10],

  function exportar(tipo, fmt, selecionadas) {
    if (!S.dados) return;
    const f = filtradas();
    const nomeArq = 'resgate-monitoria_' + tipo + (S.dados.demo ? '_DEMO' : '') + '_' + agoraStamp();
    let abas;
    if (selecionadas) abas = [tabLig('Selecionadas', S.dados.ligacoes.filter(r => S.tab.sel.has(r.id)))];
    else if (tipo === 'completo') {
      abas = [tabResumo(f), tabLig('Ligacoes', f), tabLig('Efetivas_1min30', f.filter(r => r.ligacao_efetiva === 'Sim')), tabRanking(f), tabEtapas(f),
        tabLig('Perdidos', f.filter(r => r.lead_perdido === 'Sim')), tabLig('Nao_Localizados', f.filter(r => r.status_cruzamento === 'Não localizado' || r.status_cruzamento === 'Revisar')),
        tabLig('Ambiguos', f.filter(r => r.status_cruzamento === 'Correspondência ambígua'))];
    } else if (tipo === 'todos') abas = [tabLig('Ligacoes', S.dados.ligacoes)];
    else if (tipo === 'filtrados') abas = [tabLig('Ligacoes', f)];
    else if (tipo === 'efetivas') abas = [tabLig('Efetivas_1min30', f.filter(r => r.ligacao_efetiva === 'Sim'))];
    else if (tipo === 'perdidosEf') abas = [tabLig('Perdidos', f.filter(r => r.lead_perdido === 'Sim' && r.ligacao_efetiva === 'Sim'))];
    else if (tipo === 'naoloc') abas = [tabLig('Nao_Localizados', f.filter(r => r.status_cruzamento === 'Não localizado' || r.status_cruzamento === 'Revisar'))];
    else if (tipo === 'ambiguos') abas = [tabLig('Ambiguos', f.filter(r => r.status_cruzamento === 'Correspondência ambígua'))];
    else if (tipo === 'ranking') abas = [tabRanking(f)];
    else if (tipo === 'etapas') abas = [tabEtapas(f)];
    if (!abas) return;
    if (fmt === 'csv') P.baixar(P.gerarCsv(abas[0].colunas, abas[0].linhas), nomeArq + '.csv');
    else P.baixar(P.gerarXlsx(abas), nomeArq + '.xlsx');
    toast('Exportação gerada: ' + nf(abas[0].linhas.length) + ' linhas' + (abas.length > 1 ? ' na aba principal (' + abas.length + ' abas)' : '') + '.');
  }

  async function copiar(txt) {

    catch (e) {
      const ta = document.createElement('textarea');
      ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e2) { /* sem clipboard */ }
      ta.remove();
    }
  }

    associar: el => {

      (S.dados.demo ? S.manuaisDemo : S.manuais)[el.dataset.ch] = kid(k);
      salvarManuais(); cruzarTudo(); S.modal = null; render();
      toast('Ligação associada manualmente a ' + (k.f.nome || k.code) + '.');
    },
    desassociar: el => { delete (S.dados.demo ? S.manuaisDemo : S.manuais)[el.dataset.ch]; salvarManuais(); cruzarTudo(); render(); toast('Associação manual desfeita.'); },
    limparManuais: () => {
      if (!confirm('Remover todas as associações manuais?')) return;
      if (S.dados.demo) S.manuaisDemo = {}; else { S.manuais = {}; salvarManuais(); }
      cruzarTudo(); render(); toast('Associações manuais removidas.');
    },
  };

  document.addEventListener('click', e => {
    const t = e.target;
    if (t.closest('a[data-stop]')) { e.stopPropagation(); return; }
    if (t.matches('input[data-selrow]')) {
      e.stopPropagation();
      const id = Number(t.dataset.selrow);
      if (t.checked) S.tab.sel.add(id); else S.tab.sel.delete(id);
      render(); return;
    }
    if (t.matches('input[data-act="selPagina"]')) {
      const ids = [...document.querySelectorAll('input[data-selrow]')].map(x => Number(x.dataset.selrow));
      if (t.checked) ids.forEach(i => S.tab.sel.add(i)); else ids.forEach(i => S.tab.sel.delete(i));
      render(); return;
    }
    if (t.matches('input[type="checkbox"]') || t.closest('label.ms-opt')) return; // tratado no change
    const el = t.closest('[data-act]');
    if (S.pop && !t.closest('.pop') && !(el && el.dataset.act === 'pop')) { S.pop = null; if (!el) { render(); return; } }
    if (!el || el.tagName === 'SELECT') return;
    const f = ACOES[el.dataset.act];
    if (f) { e.preventDefault(); f(el); }
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.ms) {
      const arr = S.filtros.multi[t.dataset.ms];
      const v = t.dataset.v;
      S.filtros.multi[t.dataset.ms] = t.checked ? [...arr, v] : arr.filter(x => x !== v);
      mudouFiltro(); render(); return;
    }
    if (t.dataset.col) {
      const k = t.dataset.col;
      S.tab.cols = t.checked ? COLUNAS.map(c => c.k).filter(c => c === k || S.tab.cols.includes(c)) : S.tab.cols.filter(c => c !== k);
      lsSet('mr-colunas', S.tab.cols); render(); return;
    }
    if (t.dataset.act === 'pageSize') { S.tab.size = Number(t.value); S.tab.page = 1; lsSet('mr-pag', S.tab.size); render(); return; }
    if (t.dataset.aba) { lerAba(t.dataset.aba, t.value); return; }
    if (t.dataset.map) { S.modal.map[t.dataset.map] = t.value || undefined; if (!t.value) delete S.modal.map[t.dataset.map]; render(); return; }
    if (t.dataset.file) { const f = t.files && t.files[0]; t.value = ''; if (f) carregarArquivo(t.dataset.file, f); return; }
    if (t.tagName === 'SELECT' && t.dataset.filtro) { S.filtros[t.dataset.filtro] = t.value; mudouFiltro(); render(); }
    if (t.dataset.filtro && (t.type === 'date' || t.type === 'number')) { S.filtros[t.dataset.filtro] = t.value; mudouFiltro(); render(); }
  });
  document.addEventListener('focusin', e => { if (e.target.dataset && e.target.dataset.ta) taAbrir(e.target); });
  document.addEventListener('focusout', e => {
    const t = e.target;
    if (!t.dataset || !t.dataset.ta) return;
    setTimeout(() => { const l = document.getElementById(t.id + '-l'); if (l && document.activeElement !== t && !l.contains(document.activeElement)) { l.hidden = true; t.setAttribute('aria-expanded', 'false'); } }, 120);
  });
  document.addEventListener('mousedown', e => {
    const o = e.target.closest && e.target.closest('[data-taopt]');
    if (!o) return;
    e.preventDefault();
    const k = o.dataset.taopt;
    const inp = o.closest('.ta').querySelector('input[data-ta]');
    taEscolher(k, o.dataset.todos ? taOpcoes(k, inp ? inp.value : '').map(x => x[0]) : [o.dataset.v]);
  });
  let deb = 0;
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.dataset.ta) { S.ta[t.dataset.ta] = t.value; taAbrir(t); return; }
    if (t.dataset.popbusca) { S.popBusca = t.value; render(); return; }
    if (t.dataset.assocbusca) { S.modal.busca = t.value; clearTimeout(deb); deb = setTimeout(render, 150); return; }
    if (t.dataset.filtro && t.tagName === 'INPUT' && t.type !== 'date' && t.type !== 'number') {
      S.filtros[t.dataset.filtro] = t.value; mudouFiltro();
      clearTimeout(deb); deb = setTimeout(render, 220);
    }
  });
  document.addEventListener('keydown', e => {
    const t = e.target;
    if (t.dataset && t.dataset.ta) {
      const l = document.getElementById(t.id + '-l');
      if (e.key === 'Enter') {
        e.preventDefault();
        const ops = taOpcoes(t.dataset.ta, t.value);
        if (!ops.length) return;
        // Enter com texto: pega o unico resultado, ou todos que contem o texto
        taEscolher(t.dataset.ta, ops.length === 1 || !t.value.trim() ? [ops[0][0]] : ops.map(x => x[0]));
        return;
      }
      if (e.key === 'ArrowDown' && l && !l.hidden) { e.preventDefault(); const b = l.querySelector('button'); if (b) b.focus(); return; }
      if (e.key === 'Escape' && l && !l.hidden) { l.hidden = true; return; }
    }
    if (t.dataset && t.dataset.taopt) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); const inp = t.closest('.ta').querySelector('input[data-ta]'); taEscolher(t.dataset.taopt, t.dataset.todos ? taOpcoes(t.dataset.taopt, inp.value).map(x => x[0]) : [t.dataset.v]); return; }
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); const sib = e.key === 'ArrowDown' ? t.nextElementSibling : t.previousElementSibling; if (sib && sib.tagName === 'BUTTON') sib.focus(); else if (e.key === 'ArrowUp') t.closest('.ta').querySelector('input').focus(); return; }
    }
    if (e.key === 'Escape') {
      if (S.pop) { S.pop = null; render(); return; }
      if (S.modal) { S.modal = null; render(); return; }
      if (S.sheetId != null) { S.sheetId = null; render(); return; }
      if (S.filtrosAbertos && window.innerWidth < 1024) { S.filtrosAbertos = false; render(); return; }
      fecharMenu();
    }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr[data-act], .drop[data-act], .vc-col')) {
      e.preventDefault();
      const f = ACOES[e.target.dataset.act]; if (f) f(e.target);
    }
  });
  document.getElementById('overlay').addEventListener('click', fecharMenu);
  document.getElementById('modalBg').addEventListener('click', e => { if (e.target.id === 'modalBg') { S.modal = null; render(); } });

  // drag and drop
  document.addEventListener('dragover', e => { const z = e.target.closest && e.target.closest('[data-drop]'); if (z) { e.preventDefault(); z.querySelector('.drop') && z.querySelector('.drop').classList.add('drag'); } else e.preventDefault(); });
  document.addEventListener('dragleave', e => { const z = e.target.closest && e.target.closest('.drop'); if (z) z.classList.remove('drag'); });
  document.addEventListener('drop', e => {
    e.preventDefault();
    const z = e.target.closest && e.target.closest('[data-drop]');
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (z && f) carregarArquivo(z.dataset.drop, f);
  });

  // tooltip
  const tip = document.getElementById('tip');
  function mostrarTip(el, x, y) {
    tip.textContent = el.getAttribute('data-tip');
    tip.style.display = 'block';
    const w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, x + 12)) + 'px';
    tip.style.top = (y + h + 20 > window.innerHeight ? y - h - 12 : y + 16) + 'px';
  }
  document.addEventListener('mousemove', e => {
    const el = e.target.closest && e.target.closest('[data-tip]');
    if (el && el.getAttribute('data-tip')) mostrarTip(el, e.clientX, e.clientY); else tip.style.display = 'none';
  });
  document.addEventListener('focusin', e => {
    const el = e.target.closest && e.target.closest('[data-tip]');
    if (el && el.getAttribute('data-tip') && e.target.matches(':focus-visible')) { const r = el.getBoundingClientRect(); mostrarTip(el, r.left, r.bottom - 10); } else tip.style.display = 'none';
  });
  document.addEventListener('scroll', () => { tip.style.display = 'none'; }, true);

  let larg = window.innerWidth, rz = 0;
  window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (Math.abs(window.innerWidth - larg) > 40) { larg = window.innerWidth; if (S.dados || ehCadencia()) render(); } }, 200); });

  function ligarFallbackLogo(box) {
    if (!box) return;
    box.querySelectorAll('img.logo').forEach(img => {
      const falhou = () => box.classList.add('sem-logo');
      if (img.complete && img.naturalWidth === 0 && img.getAttribute('src')) falhou();
      img.addEventListener('error', falhou);
    });
  }
  ligarFallbackLogo(document.getElementById('brand'));

  // ponto de entrada pros testes automatizados (so leitura)
  window.MRApp = { estado: S, render, filtradas, ic, toast, copiar };
  render();
})();

</script>
<script>
// @ts-check
// ============================================================================
//  CADÊNCIA DE LIGAÇÕES — núcleo puro (sem DOM)
//  Usa só a base de ligações (não depende do Kanban). Reaproveita do MRCore
//  a normalização, o parse de datas/durações e a detecção de colunas.
//  Unidade de análise: OPERADOR + DATA + LEAD ("lead-dia").
// ============================================================================
(function (root) {
  'use strict';
  const C = /** @type {any} */ (root).MRCore;

  /* ------------------------------------------------------------------ */
  /* Parâmetros da regra (mudar aqui muda o cálculo inteiro)             */
  /* ------------------------------------------------------------------ */
  const REGRA = {
    EXC_SEG: 90,     // exceção: ligação efetiva com duração ESTRITAMENTE maior que 90 s (01:30 exato não vale)
    MIN_TENT: 3,     // sem a exceção, são necessárias 3 ou mais ligações no mesmo dia
    JANELA_MIN: 30,  // boa distribuição: pelo menos 30 min entre a 1ª e a última tentativa
    CONC_MIN: 2,     // até 2 min entre a 1ª e a última = horários praticamente idênticos
  };

  const CLS = {
    EFETIVA: 'Seguida por ligação efetiva > 01:30',
    TRES: 'Seguida por 3 ou mais ligações',
    CONC: 'Seguida, porém com tentativas concentradas',
    UMA: 'Não seguida — apenas 1 tentativa',
    DUAS: 'Não seguida — apenas 2 tentativas',
    INCONS: 'Identificação do lead inconsistente',
  };
  const DIST = {
    BOA: 'Horários bem distribuídos',
    POUCO: 'Três horários pouco espaçados',
    CONC: 'Chamadas concentradas ou repetidas',
    INCOMP: 'Cadência incompleta',
    NA: 'Não se aplica (efetiva > 01:30)',
  };
  const CRIT = { efetiva: 'Ligação efetiva > 01:30', tres: '3 ou mais ligações no dia', nenhum: 'Não atendido' };

  const pad = (/** @type {number} */ n) => String(n).padStart(2, '0');

  /* ------------------------------------------------------------------ */
  /* Effective                                                           */
  /* ------------------------------------------------------------------ */
  /** true/false; null quando vazio ou irreconhecível (nunca chuta).
   * @param {unknown} v */
  function parseEffective(v) {
    if (v == null) return null;
    if (typeof v === 'boolean') return v;
    if (typeof v === 'number') return v === 1 ? true : v === 0 ? false : null;
    const t = String(v).trim().toLowerCase();
    if (!t) return null;
    if (/^1(?:[.,]0+)?$/.test(t)) return true;
    if (/^0(?:[.,]0+)?$/.test(t)) return false;
    const s = C.normName(t);
    if (['sim', 's', 'true', 'verdadeiro', 'yes', 'y', 'efetiva', 'efetivo', 'x'].includes(s)) return true;
    if (['nao', 'n', 'false', 'falso', 'no', 'nao efetiva', 'nao efetivo'].includes(s)) return false;
    return null;
  }

  /** Texto original da duração, preservado para auditoria.
   * @param {unknown} v */
  function duracaoOriginal(v) {
    if (v == null) return '';
    if (v instanceof Date) return isNaN(v.getTime()) ? '' : pad(v.getHours()) + ':' + pad(v.getMinutes()) + ':' + pad(v.getSeconds());
    return String(v).trim();
  }

  /** mm:ss abaixo de 1h. @param {number|null|undefined} s */
  const fmtDur = s => C.fmtDuracaoCurta(s);
  /** @param {string} dia yyyy-mm-dd */
  const diaBR = dia => (dia ? dia.slice(8, 10) + '/' + dia.slice(5, 7) + '/' + dia.slice(0, 4) : '');

  /* ------------------------------------------------------------------ */
  /* Preparação das ligações                                             */
  /* ------------------------------------------------------------------ */

  /**
   * @typedef {Object} Chamada
   * @property {number} id
   * @property {number} linha          linha no arquivo original
   * @property {string} operador
   * @property {string} operadorN
   * @property {Date} dt
   * @property {number} ts
   * @property {string} dia            yyyy-mm-dd
   * @property {string} hora           HH:mm
   * @property {number} minuto         minutos desde 1970 (agrupa "mesmo minuto")
   * @property {number|null} dur       segundos (null = inválida, nunca vira zero)
   * @property {string} durOrig
   * @property {boolean} durInvalida
   * @property {string} effOrig
   * @property {boolean|null} eff
   * @property {boolean} excecao       efetiva E duração > 90 s
   * @property {string} lead_code
   * @property {string} phone
   * @property {string} phone_norm
   * @property {string} lead_name
   * @property {string} leadKey
   * @property {'código'|'telefone'|'nome'} idTipo
   * @property {string} tipo_chamada
   * @property {boolean} dup           possível duplicidade (2ª ocorrência em diante)
   * @property {number|null} dupDe
   */

  /**
   * Converte as linhas da planilha em chamadas válidas + lista de ignoradas (com motivo).
   * Duração inválida NÃO ignora a linha: a ligação conta como tentativa, mas não aciona a exceção.
   * @param {Record<string,unknown>[]} rows
   * @param {Record<string,string>} map  campo -> cabeçalho (chaves de MRCore.CAMPOS_LIGACOES)
   */
  function prepararChamadas(rows, map) {
    /** @type {Chamada[]} */
    const calls = [];
    /** @type {{linha:number, motivo:string, data:string, operador:string, lead:string}[]} */
    const ignorados = [];
    const get = (/** @type {Record<string,unknown>} */ r, /** @type {string} */ k) => (map[k] ? r[map[k]] : undefined);
    const nomesOp = new Map();
    for (let i = 0; i < rows.length; i++) {
      const r = rows[i];
      const linha = /** @type {any} */ (r).__linha || i + 2;
      const operador = C.texto(get(r, 'user_name'));
      const dtRaw = get(r, 'created_at');
      const dt = C.parseDate(dtRaw);
      const code = C.normCode(get(r, 'lead_code'));
      const phoneTxt = C.texto(get(r, 'phone'));
      const phone = C.normPhone(get(r, 'phone'));
      const nome = C.texto(get(r, 'lead_name'));
      const nomeN = C.normName(nome);
      const motivos = [];
      if (!dt) motivos.push(dtRaw == null || C.texto(dtRaw) === '' ? 'Data/hora da ligação vazia' : 'Data/hora em formato não reconhecido ("' + C.texto(dtRaw) + '")');
      if (!operador) motivos.push('Operador (user_name) vazio');
      if (!code && !phone && !nomeN) motivos.push('Lead sem código, telefone e nome');
      if (motivos.length) {
        ignorados.push({ linha, motivo: motivos.join('; '), data: C.texto(dtRaw), operador, lead: nome || code || phoneTxt });
        continue;
      }
      const d = /** @type {Date} */ (dt);
      const durRaw = get(r, 'duracao');
      const dur = C.parseDuration(durRaw);
      const effRaw = get(r, 'effective');
      const eff = map.effective ? parseEffective(effRaw) : null;
      const operadorN = C.normName(operador);
      const cnt = nomesOp.get(operadorN) || new Map();
      cnt.set(operador, (cnt.get(operador) || 0) + 1);
      nomesOp.set(operadorN, cnt);
      calls.push({
        id: calls.length, linha, operador, operadorN, dt: d, ts: d.getTime(),
        dia: C.chaveDia(d), hora: C.fmtHora(d), minuto: Math.floor(d.getTime() / 60000),
        dur, durOrig: duracaoOriginal(durRaw), durInvalida: dur == null,
        effOrig: map.effective ? (effRaw == null ? '' : typeof effRaw === 'boolean' ? (effRaw ? 'VERDADEIRO' : 'FALSO') : String(effRaw).trim()) : '',
        eff, excecao: eff === true && dur != null && dur > REGRA.EXC_SEG,
        lead_code: code, phone: phoneTxt, phone_norm: phone, lead_name: nome,
        leadKey: code ? 'c:' + code : phone ? 'p:' + phone : 'n:' + nomeN,
        idTipo: code ? 'código' : phone ? 'telefone' : 'nome',
        tipo_chamada: C.texto(get(r, 'tipo_chamada')),
        dup: false, dupDe: null,
      });
    }
    // nome de exibição do operador: a grafia mais frequente
    for (const c of calls) {
      const cnt = nomesOp.get(c.operadorN);
      let melhor = c.operador, n = 0;
      for (const [nm, q] of cnt) if (q > n) { melhor = nm; n = q; }
      c.operador = melhor;
    }
    // possível duplicidade: mesmo operador + lead + data + horário (minuto) + duração
    const vistos = new Map();
    let dups = 0;
    for (const c of calls) {
      const k = [c.operadorN, c.leadKey, c.dia, c.hora, c.dur == null ? 'x' + c.durOrig : c.dur].join('|');
      if (vistos.has(k)) { c.dup = true; c.dupDe = vistos.get(k); dups++; } else vistos.set(k, c.id);
    }
    return { calls, ignorados, dups, lidas: rows.length };
  }

  /**
   * Último dia parcial? (dia de hoje, extração no mesmo dia pelo nome do arquivo,
   * ou volume bem abaixo do mesmo dia da semana). Só avisa — nunca exclui sozinho.
   * @param {Chamada[]} calls @param {string} nomeArquivo @param {Date} hoje
   */
  function detectarParcial(calls, nomeArquivo, hoje) {
    if (!calls.length) return { ultimo: '', parcial: false, motivos: [], ultimaHora: '', extracao: '' };
    /** @type {Map<string,number>} */
    const porDia = new Map();
    let ultimo = '', ultTs = 0;
    for (const c of calls) {
      porDia.set(c.dia, (porDia.get(c.dia) || 0) + 1);
      if (c.dia > ultimo) ultimo = c.dia;
      if (c.ts > ultTs) ultTs = c.ts;
    }
    const motivos = [];
    if (ultimo === C.chaveDia(hoje)) motivos.push('a última data da base é hoje');
    let extracao = '';
    const m = String(nomeArquivo || '').match(/(\d{4})[-_.](\d{2})[-_.](\d{2})(?:[ _T-]+(\d{2})[-_:h.](\d{2}))?/);
    if (m) {
      const dArq = m[1] + '-' + m[2] + '-' + m[3];
      extracao = diaBR(dArq) + (m[4] ? ' às ' + m[4] + ':' + m[5] : '');
      if (dArq === ultimo) motivos.push('o nome do arquivo indica extração no mesmo dia (' + extracao + ')');
    }
    // mesmo dia da semana nas semanas anteriores
    const ud = C.parseDate(ultimo);
    if (ud) {
      const ant = [];
      for (let k = 1; k <= 4; k++) {
        const x = new Date(ud.getFullYear(), ud.getMonth(), ud.getDate() - 7 * k);
        const q = porDia.get(C.chaveDia(x));
        if (q) ant.push(q);
      }
      if (ant.length >= 2) {
        ant.sort((a, b) => a - b);
        const med = ant.length % 2 ? ant[(ant.length - 1) / 2] : (ant[ant.length / 2 - 1] + ant[ant.length / 2]) / 2;
        const q = porDia.get(ultimo) || 0;
        if (q < med * 0.6) motivos.push('o volume do último dia (' + q + ' ligações) está abaixo de 60% da mediana do mesmo dia da semana (' + Math.round(med) + ')');
      }
    }
    const ud2 = new Date(ultTs);
    return { ultimo, parcial: motivos.length > 0, motivos, ultimaHora: pad(ud2.getHours()) + ':' + pad(ud2.getMinutes()), extracao };
  }

  /* ------------------------------------------------------------------ */
  /* Avaliação por OPERADOR + DATA + LEAD                                */
  /* ------------------------------------------------------------------ */

  /**
   * @typedef {Object} LeadDia
   * @property {string} key
   * @property {string} operador
   * @property {string} operadorN
   * @property {string} supervisor
   * @property {string} equipe
   * @property {string} dia
   * @property {string} dataBR
   * @property {string} leadKey
   * @property {string} idTipo
   * @property {string} lead_code
   * @property {string} lead_name
   * @property {string} phone
   * @property {string} phone_norm
   * @property {string[]} tipos
   * @property {Chamada[]} calls        em ordem cronológica
   * @property {number} n
   * @property {string[]} horarios
   * @property {number} distintos      horários (minutos) distintos
   * @property {string} primeira
   * @property {string} ultima
   * @property {number} intervaloMin   minutos entre a 1ª e a última tentativa
   * @property {number|null} maxDur
   * @property {boolean} temExcecao
   * @property {number} effCurta       ligações effective=1 com duração ≤ 01:30
   * @property {number} durInvalidas
   * @property {number} maxMesmoMinuto
   * @property {boolean} seguida
   * @property {'efetiva'|'tres'|'nenhum'} criterio
   * @property {string} distrib
   * @property {boolean} concentrada   seguida por 3+ ligações, mas com intervalo total < 30 min
   * @property {boolean} mesmoMinuto   3+ ligações no mesmo minuto (sem efetiva)
   * @property {boolean} proximas      3+ ligações muito próximas (< 30 min), sem ser no mesmo minuto
   * @property {string} classe
   * @property {string} status
   * @property {string} motivo
   * @property {string} oportunidade
   * @property {{semCodigo:boolean,semTelefone:boolean,codMultiFone:boolean,foneMultiCod:boolean,multiOperador:boolean}} flags
   * @property {string[]} outrosOperadores
   */

  /**
   * @param {Chamada[]} todas
   * @param {{ignorarDup?:boolean, excluirDia?:string, equipes?:Map<string,{supervisor:string,equipe:string}>}} [opts]
   */
  function avaliar(todas, opts) {
    const o = opts || {};
    let calls = todas;
    if (o.ignorarDup) calls = calls.filter(c => !c.dup);
    if (o.excluirDia) calls = calls.filter(c => c.dia !== o.excluirDia);
    const eq = o.equipes || new Map();

    // consistência do cadastro (na base considerada)
    /** @type {Map<string,Set<string>>} */ const codFones = new Map();
    /** @type {Map<string,Set<string>>} */ const foneCods = new Map();
    /** @type {Map<string,Set<string>>} */ const leadDiaOps = new Map();
    const add = (/** @type {Map<string,Set<string>>} */ m, /** @type {string} */ k, /** @type {string} */ v) => { let s = m.get(k); if (!s) { s = new Set(); m.set(k, s); } s.add(v); };
    for (const c of calls) {
      if (c.lead_code && c.phone_norm) { add(codFones, c.lead_code, c.phone_norm); add(foneCods, c.phone_norm, c.lead_code); }
      add(leadDiaOps, c.leadKey + '|' + c.dia, c.operador);
    }

    /** @type {Map<string,Chamada[]>} */
    const grupos = new Map();
    for (const c of calls) {
      const k = c.operadorN + '|' + c.dia + '|' + c.leadKey;
      const a = grupos.get(k);
      if (a) a.push(c); else grupos.set(k, [c]);
    }

    /** @type {LeadDia[]} */
    const out = [];
    for (const [key, cs] of grupos) {
      cs.sort((a, b) => a.ts - b.ts || a.id - b.id);
      const f = cs[0];
      const n = cs.length;
      const minutos = new Map();
      for (const c of cs) minutos.set(c.minuto, (minutos.get(c.minuto) || 0) + 1);
      const distintos = minutos.size;
      const maxMesmoMinuto = Math.max(...minutos.values());
      const intervaloMin = Math.round((cs[n - 1].ts - f.ts) / 60000);
      let maxDur = null, effCurta = 0, durInvalidas = 0;
      for (const c of cs) {
        if (c.dur != null && (maxDur == null || c.dur > maxDur)) maxDur = c.dur;
        if (c.eff === true && c.dur != null && c.dur <= REGRA.EXC_SEG) effCurta++;
        if (c.durInvalida) durInvalidas++;
      }
      const temExcecao = cs.some(c => c.excecao);
      const seguida = temExcecao || n >= REGRA.MIN_TENT;
      /** @type {'efetiva'|'tres'|'nenhum'} */
      const criterio = temExcecao ? 'efetiva' : n >= REGRA.MIN_TENT ? 'tres' : 'nenhum';

      let distrib;
      if (temExcecao) distrib = DIST.NA;
      else if (n < REGRA.MIN_TENT) distrib = DIST.INCOMP;
      else if (distintos < REGRA.MIN_TENT || intervaloMin <= REGRA.CONC_MIN) distrib = DIST.CONC;
      else if (intervaloMin < REGRA.JANELA_MIN) distrib = DIST.POUCO;
      else distrib = DIST.BOA;
      const concentrada = criterio === 'tres' && (distrib === DIST.CONC || distrib === DIST.POUCO);
      const mesmoMinuto = criterio === 'tres' && maxMesmoMinuto >= REGRA.MIN_TENT;
      const proximas = criterio === 'tres' && !mesmoMinuto && intervaloMin < REGRA.JANELA_MIN;

      // dados do lead: valor mais frequente não vazio
      const freq = (/** @type {(c:Chamada)=>string} */ fn) => { const m = new Map(); for (const c of cs) { const v = fn(c); if (v) m.set(v, (m.get(v) || 0) + 1); } let b = '', q = 0; for (const [v, x] of m) if (x > q) { b = v; q = x; } return b; };
      const lead_code = freq(c => c.lead_code), phone = freq(c => c.phone), phone_norm = freq(c => c.phone_norm), lead_name = freq(c => c.lead_name);
      const ops = leadDiaOps.get(f.leadKey + '|' + f.dia) || new Set();
      const flags = {
        semCodigo: !lead_code,
        semTelefone: !phone_norm,
        codMultiFone: !!lead_code && (codFones.get(lead_code) || new Set()).size > 1,
        foneMultiCod: !!phone_norm && (foneCods.get(phone_norm) || new Set()).size > 1,
        multiOperador: ops.size > 1,
      };
      const incons = !lead_code && !phone_norm; // só pelo nome

      let classe;
      if (incons) classe = CLS.INCONS;
      else if (criterio === 'efetiva') classe = CLS.EFETIVA;
      else if (criterio === 'tres') classe = concentrada ? CLS.CONC : CLS.TRES;
      else classe = n === 1 ? CLS.UMA : CLS.DUAS;

      let motivo = '';
      if (!seguida) {
        motivo = 'Apenas ' + n + (n === 1 ? ' tentativa' : ' tentativas') + ' no dia e nenhuma ligação efetiva acima de 01:30';
        if (effCurta) motivo += ' (' + effCurta + (effCurta === 1 ? ' ligação marcada' : ' ligações marcadas') + ' como efetiva, mas com duração ≤ 01:30 — não aciona a exceção)';
        if (durInvalidas) motivo += ' (' + durInvalidas + ' com duração inválida)';
      }
      const op = [];
      if (n === 1 && !seguida) op.push('Fazer mais 2 tentativas em horários diferentes (ou obter uma ligação efetiva acima de 01:30)');
      else if (n === 2 && !seguida) op.push('Fazer mais 1 tentativa em outro horário');
      if (criterio === 'tres' && distrib === DIST.CONC) op.push('Espaçar as tentativas: ' + (mesmoMinuto ? maxMesmoMinuto + ' ligações no mesmo minuto' : 'horários praticamente idênticos (' + intervaloMin + ' min entre a 1ª e a última)'));
      else if (criterio === 'tres' && distrib === DIST.POUCO) op.push('Espaçar as tentativas: só ' + intervaloMin + ' min entre a 1ª e a última (recomendado: ' + REGRA.JANELA_MIN + ' min ou mais)');
      if (effCurta && !temExcecao) op.push('Conferir ligação marcada como efetiva com duração ≤ 01:30');
      if (durInvalidas) op.push('Corrigir duração inválida');
      if (flags.multiOperador) op.push('Lead acionado por mais de um operador no mesmo dia');
      if (incons) op.push('Completar código/telefone do lead');

      const e = eq.get(f.operadorN);
      out.push({
        key, operador: f.operador, operadorN: f.operadorN, supervisor: e ? e.supervisor : '', equipe: e ? e.equipe : '',
        dia: f.dia, dataBR: diaBR(f.dia), leadKey: f.leadKey, idTipo: f.idTipo,
        lead_code, lead_name, phone, phone_norm,
        tipos: [...new Set(cs.map(c => c.tipo_chamada).filter(Boolean))],
        calls: cs, n, horarios: cs.map(c => c.hora), distintos, primeira: f.hora, ultima: cs[n - 1].hora, intervaloMin,
        maxDur, temExcecao, effCurta, durInvalidas, maxMesmoMinuto,
        seguida, criterio, distrib, concentrada, mesmoMinuto, proximas,
        classe, status: seguida ? 'Cadência seguida' : 'Cadência não seguida', motivo, oportunidade: op.join('; '),
        flags, outrosOperadores: [...ops].filter(x => C.normName(x) !== f.operadorN),
      });
    }
    out.sort((a, b) => (a.dia < b.dia ? 1 : a.dia > b.dia ? -1 : a.operador.localeCompare(b.operador, 'pt-BR') || a.calls[0].ts - b.calls[0].ts));
    return { grupos: out, calls };
  }

  /* ------------------------------------------------------------------ */
  /* Filtros                                                             */
  /* ------------------------------------------------------------------ */
  function filtrosVazios() {
    return {
      dataIni: '', dataFim: '', operadores: /** @type {string[]} */ ([]), supervisores: /** @type {string[]} */ ([]),
      status: 'todos', criterio: 'todos', distrib: 'todos', qtd: 'todos', excecao: 'todos',
      tipos: /** @type {string[]} */ ([]), codigo: '', nome: '', telefone: '', texto: '', oport: '',
    };
  }

  const STATUS_OPC = [
    ['todos', 'Todos'], ['seguida', 'Cadência seguida'], ['nao', 'Cadência não seguida'],
    ['efetiva', 'Seguida por efetiva > 01:30'], ['tres', 'Seguida por 3 ou mais ligações'],
    ['conc', 'Três ligações concentradas'], ['uma', 'Apenas uma tentativa'], ['duas', 'Apenas duas tentativas'],
  ];
  const CRIT_OPC = [['todos', 'Todos'], ['efetiva', CRIT.efetiva], ['tres', CRIT.tres], ['nenhum', CRIT.nenhum]];
  const DIST_OPC = [['todos', 'Todas'], ...Object.values(DIST).map(v => [v, v])];
  const QTD_OPC = [['todos', 'Todas'], ['1', '1 ligação'], ['2', '2 ligações'], ['3', '3 ligações'], ['4+', '4 ou mais']];
  const EXC_OPC = [['todos', 'Todos'], ['sim', 'Sim'], ['nao', 'Não']];

  /**
   * @param {LeadDia[]} gs
   * @param {ReturnType<typeof filtrosVazios>} f
   */
  function aplicarFiltros(gs, f) {
    const ops = new Set(f.operadores.map(C.normName)), sups = new Set(f.supervisores), tipos = new Set(f.tipos);
    const cod = C.normCode(f.codigo), nome = C.normName(f.nome), tel = C.normPhone(f.telefone), txt = C.normName(f.texto);
    const cat = f.oport ? OPORT.find(x => x.k === f.oport) : null;
    return gs.filter(g => {
      if (f.dataIni && g.dia < f.dataIni) return false;
      if (f.dataFim && g.dia > f.dataFim) return false;
      if (ops.size && !ops.has(g.operadorN)) return false;
      if (sups.size && !sups.has(g.supervisor || '')) return false;
      switch (f.status) {
        case 'seguida': if (!g.seguida) return false; break;
        case 'nao': if (g.seguida) return false; break;
        case 'efetiva': if (g.criterio !== 'efetiva') return false; break;
        case 'tres': if (g.criterio !== 'tres') return false; break;
        case 'conc': if (!g.concentrada) return false; break;
        case 'uma': if (g.seguida || g.n !== 1) return false; break;
        case 'duas': if (g.seguida || g.n !== 2) return false; break;
      }
      if (f.criterio !== 'todos' && g.criterio !== f.criterio) return false;
      if (f.distrib !== 'todos' && g.distrib !== f.distrib) return false;
      if (f.qtd !== 'todos' && (f.qtd === '4+' ? g.n < 4 : g.n !== Number(f.qtd))) return false;
      if (f.excecao === 'sim' && !g.temExcecao) return false;
      if (f.excecao === 'nao' && g.temExcecao) return false;
      if (tipos.size && !g.tipos.some(t => tipos.has(t)) && !(tipos.has('') && !g.tipos.length)) return false;
      if (cod && !g.lead_code.includes(cod)) return false;
      if (nome && !C.normName(g.lead_name).includes(nome)) return false;
      if (tel && !g.phone_norm.includes(tel)) return false;
      if (cat && !cat.teste(g)) return false;
      if (txt) {
        const alvo = C.normName([g.operador, g.lead_name, g.lead_code, g.phone_norm, g.classe, g.distrib, g.supervisor, g.dataBR].join(' '));
        if (!alvo.includes(txt)) return false;
      }
      return true;
    });
  }

  /* ------------------------------------------------------------------ */
  /* Indicadores                                                         */
  /* ------------------------------------------------------------------ */
  /** @param {LeadDia[]} gs */
  function resumo(gs) {
    const r = { ligacoes: 0, operadores: 0, leads: 0, leadDias: gs.length, seguidas: 0, nao: 0, taxa: 0, efetiva: 0, tres: 0, concentradas: 0, boa: 0, pouco: 0, concRep: 0, uma: 0, duas: 0, media: 0, mesmoMinuto: 0, proximas: 0, ini: '', fim: '', dias: 0, effCurta: 0, durInvalidas: 0, multiOperador: 0 };
    const ops = new Set(), leads = new Set(), dias = new Set();
    for (const g of gs) {
      r.ligacoes += g.n;
      ops.add(g.operadorN); leads.add(g.leadKey); dias.add(g.dia);
      if (g.seguida) r.seguidas++; else r.nao++;
      if (g.criterio === 'efetiva') r.efetiva++;
      if (g.criterio === 'tres') r.tres++;
      if (g.concentrada) r.concentradas++;
      if (g.distrib === DIST.BOA) r.boa++;
      if (g.distrib === DIST.POUCO) r.pouco++;
      if (g.distrib === DIST.CONC) r.concRep++;
      if (!g.seguida && g.n === 1) r.uma++;
      if (!g.seguida && g.n === 2) r.duas++;
      if (g.mesmoMinuto) r.mesmoMinuto++;
      if (g.proximas) r.proximas++;
      r.effCurta += g.effCurta;
      r.durInvalidas += g.durInvalidas;
      if (g.flags.multiOperador) r.multiOperador++;
      if (!r.ini || g.dia < r.ini) r.ini = g.dia;
      if (!r.fim || g.dia > r.fim) r.fim = g.dia;
    }
    r.operadores = ops.size; r.leads = leads.size; r.dias = dias.size;
    r.taxa = gs.length ? (r.seguidas / gs.length) * 100 : 0;
    r.media = gs.length ? r.ligacoes / gs.length : 0;
    return r;
  }

  /** Consolidado por operador. @param {LeadDia[]} gs */
  function porOperador(gs) {
    /** @type {Map<string,LeadDia[]>} */
    const m = new Map();
    for (const g of gs) { const a = m.get(g.operadorN); if (a) a.push(g); else m.set(g.operadorN, [g]); }
    return [...m.values()].map(arr => {
      const r = resumo(arr);
      return {
        operador: arr[0].operador, operadorN: arr[0].operadorN, supervisor: arr[0].supervisor, equipe: arr[0].equipe,
        ligacoes: r.ligacoes, leads: r.leads, leadDias: r.leadDias, seguidas: r.seguidas, nao: r.nao, taxa: r.taxa,
        efetiva: r.efetiva, tres: r.tres, boa: r.boa, concentradas: r.concentradas, uma: r.uma, duas: r.duas, media: r.media,
        dias: r.dias, mesmoMinuto: r.mesmoMinuto, proximas: r.proximas,
      };
    });
  }

  /** @param {Date} d */
  function inicioSemana(d) {
    const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
    return x;
  }
  /** @param {string} dia @param {'dia'|'semana'|'mes'} gran */
  function periodo(dia, gran) {
    if (gran === 'mes') return { chave: dia.slice(0, 7), label: dia.slice(5, 7) + '/' + dia.slice(0, 4) };
    if (gran === 'semana') {
      const s = inicioSemana(/** @type {Date} */ (C.parseDate(dia)));
      const fim = new Date(s.getFullYear(), s.getMonth(), s.getDate() + 6);
      return { chave: C.chaveDia(s), label: C.fmtData(s).slice(0, 5) + ' a ' + C.fmtData(fim).slice(0, 5) + '/' + fim.getFullYear() };
    }
    return { chave: dia, label: diaBR(dia) };
  }

  /**
   * Agrupa por período + operador (página "Leads atendidos por dia").
   * @param {LeadDia[]} gs @param {'dia'|'semana'|'mes'} gran
   */
  function porPeriodoOperador(gs, gran) {
    /** @type {Map<string,{chave:string,label:string,operador:string,operadorN:string,itens:LeadDia[]}>} */
    const m = new Map();
    for (const g of gs) {
      const p = periodo(g.dia, gran);
      const k = p.chave + '|' + g.operadorN;
      let x = m.get(k);
      if (!x) { x = { chave: p.chave, label: p.label, operador: g.operador, operadorN: g.operadorN, itens: [] }; m.set(k, x); }
      x.itens.push(g);
    }
    return [...m.values()].map(x => {
      const r = resumo(x.itens);
      return { key: x.chave + '|' + x.operadorN, chave: x.chave, label: x.label, operador: x.operador, operadorN: x.operadorN, supervisor: x.itens[0].supervisor, itens: x.itens,
        ligacoes: r.ligacoes, leads: r.leads, leadDias: r.leadDias, seguidas: r.seguidas, nao: r.nao, taxa: r.taxa,
        efetiva: r.efetiva, tres: r.tres, concentradas: r.concentradas, uma: r.uma, duas: r.duas };
    });
  }

  /** Série diária (gráficos). @param {LeadDia[]} gs */
  function serieDiaria(gs) {
    /** @type {Map<string,{dia:string,label:string,leadDias:number,seguidas:number,nao:number,taxa:number,ligacoes:number}>} */
    const m = new Map();
    for (const g of gs) {
      let x = m.get(g.dia);
      if (!x) { x = { dia: g.dia, label: g.dataBR.slice(0, 5), leadDias: 0, seguidas: 0, nao: 0, taxa: 0, ligacoes: 0 }; m.set(g.dia, x); }
      x.leadDias++; x.ligacoes += g.n;
      if (g.seguida) x.seguidas++; else x.nao++;
    }
    const arr = [...m.values()].sort((a, b) => (a.dia < b.dia ? -1 : 1));
    for (const x of arr) x.taxa = x.leadDias ? (x.seguidas / x.leadDias) * 100 : 0;
    return arr;
  }

  /**
   * Ranking comparativo: só operadores com volume mínimo de lead-dias.
   * @param {ReturnType<typeof porOperador>} ops @param {number} min
   */
  function ranking(ops, min) {
    return ops.filter(o => o.leadDias >= (min || 0)).sort((a, b) => b.taxa - a.taxa || b.leadDias - a.leadDias || a.operador.localeCompare(b.operador, 'pt-BR'));
  }

  /* ------------------------------------------------------------------ */
  /* Oportunidades de correção                                           */
  /* ------------------------------------------------------------------ */
  /** @type {{k:string,l:string,unid:'lead-dias'|'ligações',desc:string,teste:(g:LeadDia)=>boolean,conta:(g:LeadDia)=>number}[]} */
  const OPORT = [
    { k: 'uma', l: 'Somente uma tentativa', unid: 'lead-dias', desc: 'Lead-dias com uma única ligação e sem efetiva acima de 01:30.', teste: g => !g.seguida && g.n === 1, conta: () => 1 },
    { k: 'duas', l: 'Somente duas tentativas', unid: 'lead-dias', desc: 'Lead-dias com duas ligações e sem efetiva acima de 01:30 — faltou uma tentativa.', teste: g => !g.seguida && g.n === 2, conta: () => 1 },
    { k: 'mesmoMinuto', l: 'Três ligações no mesmo minuto', unid: 'lead-dias', desc: 'Cadência cumprida pela quantidade, mas com 3 ou mais ligações registradas no mesmo minuto.', teste: g => g.mesmoMinuto, conta: () => 1 },
    { k: 'proximas', l: 'Três ligações muito próximas', unid: 'lead-dias', desc: 'Cadência cumprida pela quantidade, mas com menos de 30 min entre a 1ª e a última tentativa (sem contar o mesmo minuto).', teste: g => g.proximas, conta: () => 1 },
    { k: 'effCurta', l: 'Effective = 1 com duração ≤ 01:30', unid: 'ligações', desc: 'Ligações marcadas como efetivas, mas com duração igual ou inferior a 01:30 — não acionam a exceção.', teste: g => g.effCurta > 0, conta: g => g.effCurta },
    { k: 'durInvalida', l: 'Duração inválida', unid: 'ligações', desc: 'Duração vazia ou em formato não reconhecido. A ligação conta como tentativa, mas não pode acionar a exceção.', teste: g => g.durInvalidas > 0, conta: g => g.durInvalidas },
    { k: 'semCodigo', l: 'Lead sem código', unid: 'lead-dias', desc: 'Lead identificado pelo telefone ou pelo nome, porque o código veio vazio.', teste: g => g.flags.semCodigo, conta: () => 1 },
    { k: 'semTelefone', l: 'Lead sem telefone', unid: 'lead-dias', desc: 'Lead sem telefone informado nas ligações do dia.', teste: g => g.flags.semTelefone, conta: () => 1 },
    { k: 'codMultiFone', l: 'Mesmo código com telefones diferentes', unid: 'lead-dias', desc: 'O código do lead aparece com mais de um telefone na base.', teste: g => g.flags.codMultiFone, conta: () => 1 },
    { k: 'foneMultiCod', l: 'Mesmo telefone com códigos diferentes', unid: 'lead-dias', desc: 'O telefone aparece associado a mais de um código de lead na base.', teste: g => g.flags.foneMultiCod, conta: () => 1 },
    { k: 'multiOperador', l: 'Mesmo lead com operadores diferentes no dia', unid: 'lead-dias', desc: 'O mesmo lead recebeu ligações de mais de um operador na mesma data.', teste: g => g.flags.multiOperador, conta: () => 1 },
  ];

  /** @param {LeadDia[]} gs */
  function oportunidades(gs) {
    const totLig = gs.reduce((s, g) => s + g.n, 0);
    return OPORT.map(cat => {
      const itens = gs.filter(cat.teste);
      const qtd = itens.reduce((s, g) => s + cat.conta(g), 0);
      const base = cat.unid === 'ligações' ? totLig : gs.length;
      /** @type {Map<string,{operador:string,n:number}>} */
      const ops = new Map();
      for (const g of itens) { const o = ops.get(g.operadorN) || { operador: g.operador, n: 0 }; o.n += cat.conta(g); ops.set(g.operadorN, o); }
      return {
        k: cat.k, l: cat.l, unid: cat.unid, desc: cat.desc, qtd, pct: base ? (qtd / base) * 100 : 0,
        leads: new Set(itens.map(g => g.leadKey)).size, leadDias: itens.length,
        operadores: [...ops.values()].sort((a, b) => b.n - a.n),
        exemplos: itens.slice().sort((a, b) => (a.dia < b.dia ? 1 : a.dia > b.dia ? -1 : 0)).slice(0, 5),
        itens,
      };
    });
  }

  /* ------------------------------------------------------------------ */
  /* Relatório para e-mail                                               */
  /* ------------------------------------------------------------------ */
  const nfmt = (/** @type {number} */ n) => Number(n || 0).toLocaleString('pt-BR');
  const pfmt = (/** @type {number} */ n) => Number(n || 0).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%';

  /**
   * @param {{res:ReturnType<typeof resumo>, ops:ReturnType<typeof porOperador>, min:number, ini:string, fim:string,
   *   operadoresSel:string[], filtrosTxt:string[], oport:ReturnType<typeof oportunidades>,
   *   parcial:{parcial:boolean, ultimo:string, excluido:boolean}, dupInfo:string, versao:'exec'|'det'}} x
   */
  function gerarEmail(x) {
    const r = x.res;
    const periodoTxt = x.ini === x.fim ? diaBR(x.ini) : diaBR(x.ini) + ' a ' + diaBR(x.fim);
    const assunto = 'Acompanhamento da cadência de ligações – ' + periodoTxt;
    const L = [];
    L.push('Olá, time.');
    L.push('');
    L.push((x.ini === x.fim ? 'No dia ' + diaBR(x.ini) : 'No período de ' + diaBR(x.ini) + ' a ' + diaBR(x.fim)) + ', foram analisadas ' + nfmt(r.ligacoes) + ' ligações' +
      (x.operadoresSel.length ? ' dos operadores selecionados (' + (x.operadoresSel.length <= 4 ? x.operadoresSel.join(', ') : x.operadoresSel.length + ' operadores') + ')' : ' de ' + nfmt(r.operadores) + ' operadores') +
      ', distribuídas em ' + nfmt(r.leads) + ' leads únicos e ' + nfmt(r.leadDias) + ' lead-dias.');
    L.push('');
    L.push('A taxa geral de conformidade da cadência foi de ' + pfmt(r.taxa) + '. Dos ' + nfmt(r.leadDias) + ' lead-dias avaliados, ' + nfmt(r.seguidas) + ' seguiram a cadência esperada e ' + nfmt(r.nao) + ' ficaram abaixo do critério.');
    L.push('');
    L.push('Do total de cadências seguidas, ' + nfmt(r.efetiva) + ' foram atendidas por uma ligação efetiva superior a 1min30s e ' + nfmt(r.tres) + ' foram atendidas pela realização de três ou mais tentativas no dia.');
    L.push('');
    L.push('Os principais pontos de atenção foram:');
    const pontos = [
      nfmt(r.uma) + ' lead-dias com apenas uma tentativa',
      nfmt(r.duas) + ' lead-dias com apenas duas tentativas',
      nfmt(r.concentradas) + ' casos com chamadas concentradas ou repetidas (3 ou mais ligações com menos de 30 min entre a primeira e a última' + (r.mesmoMinuto ? ', sendo ' + nfmt(r.mesmoMinuto) + ' com 3 ou mais ligações no mesmo minuto' : '') + ')',
    ];
    const op = Object.fromEntries(x.oport.map(o => [o.k, o]));
    if (op.effCurta && op.effCurta.qtd) pontos.push(nfmt(op.effCurta.qtd) + ' ligações marcadas como efetivas com duração igual ou inferior a 1min30s, que não contam para a exceção');
    if (op.multiOperador && op.multiOperador.qtd) pontos.push(nfmt(op.multiOperador.qtd) + ' lead-dias em que o mesmo lead foi acionado por mais de um operador no mesmo dia');
    if (op.durInvalida && op.durInvalida.qtd) pontos.push(nfmt(op.durInvalida.qtd) + ' ligações com duração inválida na base');
    if (x.parcial.parcial && !x.parcial.excluido && r.fim === x.parcial.ultimo) pontos.push('o último dia (' + diaBR(x.parcial.ultimo) + ') pode estar incompleto, pois a base foi extraída no mesmo dia — os números desse dia devem ser lidos considerando o horário de extração');
    pontos.forEach((p, i) => L.push('- ' + p + (i === pontos.length - 1 ? '.' : ';')));

    const elegiveis = ranking(x.ops, x.min);
    const base = elegiveis.length >= 2 ? elegiveis : ranking(x.ops, 0);
    const notaMin = elegiveis.length >= 2 && x.min > 0 ? ' (considerando operadores com pelo menos ' + nfmt(x.min) + ' lead-dias no período)' : '';
    if (base.length) {
      const top = base.slice(0, 3);
      L.push('');
      L.push('Por operador, os principais destaques foram' + notaMin + ':');
      top.forEach((o, i) => L.push('- ' + o.operador + ': ' + pfmt(o.taxa) + ' de conformidade (' + nfmt(o.seguidas) + ' de ' + nfmt(o.leadDias) + ' lead-dias)' + (i === top.length - 1 ? '.' : ';')));
      const piores = base.slice().sort((a, b) => a.taxa - b.taxa || b.nao - a.nao).filter(o => !top.includes(o) && o.nao > 0).slice(0, 3);
      if (piores.length) {
        L.push('');
        L.push('As principais oportunidades ficaram concentradas em:');
        piores.forEach((o, i) => L.push('- ' + o.operador + ': ' + pfmt(o.taxa) + ' de conformidade e ' + nfmt(o.nao) + ' lead-dias sem cadência' + (i === piores.length - 1 ? '.' : ';')));
      }
    }
    if (x.versao === 'det') {
      L.push('');
      L.push('Resultado por operador (ordenado pela taxa de conformidade):');
      const todos = x.ops.slice().sort((a, b) => b.taxa - a.taxa || b.leadDias - a.leadDias);
      for (const o of todos) {
        L.push('- ' + o.operador + ' — ' + pfmt(o.taxa) + ' de conformidade · ' + nfmt(o.seguidas) + ' seguidas de ' + nfmt(o.leadDias) + ' lead-dias · ' + nfmt(o.ligacoes) + ' ligações · ' +
          nfmt(o.efetiva) + ' por efetiva · ' + nfmt(o.tres) + ' por 3+ ligações · ' + nfmt(o.uma) + ' com 1 tentativa · ' + nfmt(o.duas) + ' com 2 tentativas · ' + nfmt(o.concentradas) + ' concentradas' +
          (o.leadDias < x.min ? ' (volume abaixo do mínimo de ' + nfmt(x.min) + ' lead-dias para o ranking)' : ''));
      }
      L.push('');
      L.push('Critérios utilizados:');
      L.push('- A análise é feita por operador + data + lead (lead-dia).');
      L.push('- A cadência é considerada seguida quando o lead recebe 3 ou mais ligações no dia, ou pelo menos uma ligação marcada como efetiva com duração superior a 1min30s (01:30 exato não aciona a exceção).');
      L.push('- Tentativas concentradas: 3 ou mais ligações com menos de 30 minutos entre a primeira e a última — continuam conformes, mas indicam oportunidade de melhoria.');
      if (x.filtrosTxt.length) L.push('- Filtros aplicados: ' + x.filtrosTxt.join(' | ') + '.');
      if (x.dupInfo) L.push('- ' + x.dupInfo);
    }
    L.push('');
    let prox = 'Como próximos passos, recomendamos reforçar a execução das três tentativas em horários diferentes quando não houver uma ligação efetiva superior a 1min30s, acompanhar os casos com apenas uma ou duas tentativas e orientar os operadores que concentram as chamadas em intervalos muito curtos.';
    if (op.effCurta && op.effCurta.qtd) prox += ' Também vale alinhar com o time que ligações de exatamente 1min30s não substituem as três tentativas.';
    L.push(prox);
    L.push('');
    L.push('Atenciosamente,');
    const corpo = L.join('\n');
    return { assunto, corpo, completo: 'Assunto: ' + assunto + '\n\n' + corpo };
  }

  const api = {
    REGRA, CLS, DIST, CRIT, OPORT, STATUS_OPC, CRIT_OPC, DIST_OPC, QTD_OPC, EXC_OPC,
    parseEffective, prepararChamadas, detectarParcial, avaliar, filtrosVazios, aplicarFiltros,
    resumo, porOperador, porPeriodoOperador, serieDiaria, ranking, oportunidades, gerarEmail, diaBR, fmtDur, periodo,
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else /** @type {any} */ (root).CadCore = api;
})(typeof globalThis !== 'undefined' ? globalThis : this);
