<style>
/* Resgate de Monitoria — paleta FINX (#142141 marinho, #1B82B0/#115978 azuis,
   #0065FF/#014EDC destaque, #FCD02B atencao). Verde = efetiva, vermelho = perda/erro. */
:root {
  color-scheme: light;
  --bg: #F6F8FB;
  --surface: #FFFFFF;
  --surface-2: #F0F3F8;
  --surface-3: #E6EBF2;
  --border: #DCE2EB;
  --text: #142141;
  --muted: #5A6A80;
  --primary: #142141;
  --primary-fg: #FFFFFF;
  --accent: #1B82B0;
  --accent-2: #115978;
  --accent-soft: rgba(27, 130, 176, .12);
  --link: #014EDC;
  --ok: #16A56A;
  --ok-bg: #DCFCE7;
  --ok-text: #0E6B45;
  --warn: #FCD02B;
  --warn-bg: #FEF6D3;
  --warn-text: #7A5A00;
  --err: #DC4C4C;
  --err-bg: #FDECEC;
  --err-text: #A42C2C;
  --orange: #E07B1F;
  --orange-bg: #FDEEDF;
  --orange-text: #9A4A0A;
  --neutral-bar: #A9B5C6;
  --grid: #E6EBF2;
  --shadow: 0 1px 2px rgba(20, 33, 65, .06), 0 1px 3px rgba(20, 33, 65, .05);
  --radius: 8px;
  --radius-sm: 6px;
  --focus: 0 0 0 3px rgba(0, 101, 255, .35);
  --font: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  --sidebar-w: 236px;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #07111F;
  --surface: #0D1A2D;
  --surface-2: #122238;
  --surface-3: #1A2D47;
  --border: #22354F;
  --text: #E7EDF6;
  --muted: #95A5BC;
  --primary: #E7EDF6;
  --primary-fg: #07111F;
  --accent: #3AA3D6;
  --accent-2: #69BCE3;
  --accent-soft: rgba(58, 163, 214, .16);
  --link: #6FA8FF;
  --ok: #34C483;
  --ok-bg: rgba(52, 196, 131, .15);
  --ok-text: #7FE0B1;
  --warn: #FCD02B;
  --warn-bg: rgba(252, 208, 43, .14);
  --warn-text: #FCE08A;
  --err: #EF6B6B;
  --err-bg: rgba(239, 107, 107, .15);
  --err-text: #F7A5A5;
  --orange: #F29A4A;
  --orange-bg: rgba(242, 154, 74, .15);
  --orange-text: #F8C08E;
  --neutral-bar: #4A5D78;
  --grid: #1C2D45;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35);
  --focus: 0 0 0 3px rgba(111, 168, 255, .45);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font); font-size: 14px; line-height: 1.45;
  background: var(--bg); color: var(--text);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
button, input, select { font: inherit; color: inherit; }
a { color: var(--link); }
:focus-visible { outline: none; box-shadow: var(--focus); border-radius: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

svg.ic { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ------------------------------- layout ------------------------------- */
.app { display: flex; min-height: 100vh; }
.sidebar {
  width: var(--sidebar-w); flex: none; background: var(--surface); border-right: 1px solid var(--border);
  position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; z-index: 40;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 16px 16px 12px; border-bottom: 1px solid var(--border); }
.brand .logo { height: 26px; width: auto; max-width: 110px; object-fit: contain; display: block; }
.brand .logo-dark { display: none; }
:root[data-theme="dark"] .brand .logo-light, :root[data-theme="dark"] .hdr-logo .logo-light { display: none; }
:root[data-theme="dark"] .brand .logo-dark, :root[data-theme="dark"] .hdr-logo .logo-dark { display: block; }
.logo-fallback { display: none; font-weight: 800; letter-spacing: .08em; font-size: 18px; }
.brand.sem-logo .logo, .hdr-logo.sem-logo .logo { display: none !important; }
.brand.sem-logo .logo-fallback, .hdr-logo.sem-logo .logo-fallback { display: inline; }
.brand-sub { font-size: 11px; color: var(--muted); line-height: 1.2; border-left: 1px solid var(--border); padding-left: 10px; }
.nav { padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; flex: 1; }
.nav-item {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border: 0; background: none;
  border-radius: var(--radius-sm); cursor: pointer; text-align: left; color: var(--muted); font-weight: 500; min-height: 38px;
}
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item[aria-current="page"] { background: var(--accent-soft); color: var(--text); box-shadow: inset 3px 0 0 var(--accent); }
.nav-item .cnt { margin-left: auto; font-size: 11px; font-variant-numeric: tabular-nums; color: var(--muted); background: var(--surface-2); padding: 1px 6px; border-radius: 10px; }
.sidebar-foot { padding: 12px; border-top: 1px solid var(--border); display: grid; gap: 8px; }
.side-note { font-size: 11px; color: var(--muted); }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.header {
  position: sticky; top: 0; z-index: 30; background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px; padding: 10px 20px; flex-wrap: wrap;
}
.hdr-logo { display: none; }
.hdr-logo .logo { height: 20px; width: auto; object-fit: contain; }
.hdr-logo .logo-dark { display: none; }
.hdr-title { min-width: 0; }
.hdr-title h1 { font-size: 17px; margin: 0; line-height: 1.2; letter-spacing: -.01em; }
.hdr-title p { margin: 0; font-size: 12px; color: var(--muted); }
.hdr-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.hdr-actions { margin-left: auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.content { padding: 16px 20px 40px; display: grid; gap: 16px; min-width: 0; }
.btn.menu-btn { display: none; }

.overlay { position: fixed; inset: 0; background: rgba(7, 17, 31, .45); z-index: 60; display: none; }
.overlay.open { display: block; }

@media (max-width: 1023px) {
  .sidebar { position: fixed; left: 0; top: 0; transform: translateX(-100%); transition: transform .2s ease; z-index: 70; box-shadow: 0 0 40px rgba(0, 0, 0, .25); }
  .sidebar.open { transform: none; }
  .btn.menu-btn { display: inline-flex; }
  .hdr-logo { display: flex; align-items: center; }
}
@media (max-width: 640px) {
  .header { padding: 8px 12px; gap: 8px; }
  .content { padding: 12px 12px 32px; }
  .hdr-title p, .hdr-meta .opt { display: none; }
  .btn .lbl-opt { display: none; }
}

/* ------------------------------- controles ------------------------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 12px;
  border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text);
  cursor: pointer; font-weight: 500; font-size: 13px; white-space: nowrap; text-decoration: none;
}
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: #142141; border-color: #142141; color: #fff; }
:root[data-theme="dark"] .btn.primary { background: #1B82B0; border-color: #1B82B0; }
.btn.primary:hover { filter: brightness(1.15); }
.btn.accent { background: #0065FF; border-color: #0065FF; color: #fff; }
.btn.accent:hover { background: #014EDC; }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: var(--err-text); }
.btn.sm { height: 28px; padding: 0 8px; font-size: 12px; }
.btn.icon { width: 34px; padding: 0; }
.btn.sm.icon { width: 28px; }
.btn.on { background: var(--accent-soft); border-color: var(--accent); }
@media (pointer: coarse) { .btn { height: 40px; } .btn.icon { width: 40px; } .btn.sm { height: 34px; } .btn.sm.icon { width: 34px; } }

.field { display: grid; gap: 4px; min-width: 0; }
.field > label, .field > .lbl { font-size: 12px; font-weight: 600; color: var(--muted); }
.input, .select {
  height: 34px; width: 100%; padding: 0 10px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface); min-width: 0;
}
.input:focus, .select:focus { outline: none; border-color: var(--accent); box-shadow: var(--focus); }
.input-ic { position: relative; }
.input-ic .ic { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.input-ic .input { padding-left: 30px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 0 10px; height: 30px; cursor: pointer; font-size: 12px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--text); font-weight: 600; }

/* ------------------------------- cards ------------------------------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; align-items: center; gap: 8px; padding: 12px 14px 0; flex-wrap: wrap; }
.card-h h2, .card-h h3 { margin: 0; font-size: 14px; font-weight: 650; }
.card-h .sub { font-size: 12px; color: var(--muted); width: 100%; }
.card-h .right { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.card-b { padding: 12px 14px 14px; }
.section-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.section-title h2 { margin: 0; font-size: 18px; }
.section-title p { margin: 0; color: var(--muted); font-size: 13px; }

.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.kpi { padding: 12px 14px; position: relative; }
.kpi .k-l { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; font-weight: 500; }
.kpi .k-v { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 4px; letter-spacing: -.02em; }
.kpi .k-s { font-size: 12px; color: var(--muted); }
.kpi .help { margin-left: auto; color: var(--muted); background: none; border: 0; padding: 2px; cursor: help; display: inline-flex; }
.kpi.t-ok { box-shadow: inset 3px 0 0 var(--ok), var(--shadow); }
.kpi.t-err { box-shadow: inset 3px 0 0 var(--err), var(--shadow); }
.kpi.t-warn { box-shadow: inset 3px 0 0 var(--warn), var(--shadow); }
.kpi.t-acc { box-shadow: inset 3px 0 0 var(--accent), var(--shadow); }
@media (max-width: 640px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kpi .k-v { font-size: 20px; } }

.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 1180px) { .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); } }

/* ------------------------------- badges ------------------------------- */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; border: 1px solid transparent; line-height: 18px; }
.b-ok { background: var(--ok-bg); color: var(--ok-text); }
.b-warn { background: var(--warn-bg); color: var(--warn-text); }
.b-err { background: var(--err-bg); color: var(--err-text); }
.b-orange { background: var(--orange-bg); color: var(--orange-text); }
.b-neutral { background: var(--surface-2); color: var(--muted); border-color: var(--border); }
.b-acc { background: var(--accent-soft); color: var(--text); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dot.ok { background: var(--ok); }
.dot.no { background: transparent; border: 1.5px solid var(--neutral-bar); }
.demo-banner { background: var(--warn-bg); color: var(--warn-text); border: 1px solid var(--warn); border-radius: var(--radius); padding: 8px 12px; display: flex; gap: 8px; align-items: center; font-weight: 600; flex-wrap: wrap; }

/* ------------------------------- filtros ------------------------------- */
.filters { padding: 0; }
.filters-top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 12px; }
.filters-top .field { width: 150px; }
.filters-top .grow { flex: 1; min-width: 180px; width: auto; }
.filters-adv { border-top: 1px solid var(--border); padding: 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.filters-adv[hidden] { display: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 10px; }
.chips:empty { display: none; }
.chip { display: inline-flex; align-items: center; gap: 4px; background: var(--accent-soft); border: 1px solid transparent; border-radius: 999px; padding: 2px 4px 2px 10px; font-size: 12px; max-width: 100%; }
.chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 280px; }
.chip button { border: 0; background: none; cursor: pointer; display: inline-flex; padding: 2px; border-radius: 50%; color: var(--muted); }
.chip button:hover { background: var(--surface-3); color: var(--text); }
.filters-sheet-head { display: none; }
.filters-backdrop { display: none; }
@media (max-width: 1023px) {
  .filters-backdrop { display: block; position: fixed; inset: 0; background: rgba(7, 17, 31, .45); z-index: 65; }
  .filters-adv:not([hidden]) {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100vw); z-index: 70; background: var(--surface);
    overflow-y: auto; grid-template-columns: 1fr; align-content: start; box-shadow: 0 0 40px rgba(0, 0, 0, .3); border-top: 0;
  }
  .filters-sheet-head { display: flex; align-items: center; justify-content: space-between; position: sticky; top: -12px; background: var(--surface); margin: -12px -12px 0; padding: 12px; border-bottom: 1px solid var(--border); z-index: 2; }
}

/* multiselect */
.ms { position: relative; }
.ms-btn { width: 100%; justify-content: space-between; font-weight: 400; }
.ms-btn .v { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ms-btn.has { border-color: var(--accent); background: var(--accent-soft); }
.pop {
  position: absolute; z-index: 80; top: calc(100% + 4px); left: 0; min-width: 100%; width: max-content; max-width: min(360px, 92vw);
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 10px 30px rgba(0, 0, 0, .18); padding: 8px;
}
.pop.right { left: auto; right: 0; }
.ms-list { max-height: 260px; overflow-y: auto; margin-top: 6px; display: grid; }
.ms-opt { display: flex; gap: 8px; align-items: center; padding: 6px; border-radius: 4px; cursor: pointer; font-size: 13px; }
.ms-opt:hover { background: var(--surface-2); }
.ms-opt .n { margin-left: auto; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.ms-foot { display: flex; justify-content: space-between; gap: 6px; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); align-items: center; }
input[type="checkbox"] { width: 16px; height: 16px; accent-color: #0065FF; margin: 0; flex: none; }

/* ------------------------------- graficos ------------------------------- */
.chart { width: 100%; overflow: hidden; }
.chart svg { display: block; width: 100%; height: auto; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.chart .lbl-strong { fill: var(--text); font-weight: 600; }
.chart .grid line { stroke: var(--grid); }
.chart .bar { cursor: pointer; }
.chart .bar:hover, .chart .bar:focus { opacity: .8; outline: none; }
.f-ok { fill: var(--ok); } .f-neutral { fill: var(--neutral-bar); } .f-warn { fill: var(--warn); } .f-err { fill: var(--err); }
.f-acc { fill: var(--accent); } .f-acc2 { fill: var(--accent-2); } .f-blue { fill: #0065FF; } .f-orange { fill: var(--orange); }
.s-acc { stroke: var(--accent); } .s-ok { stroke: var(--ok); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { width: 10px; height: 10px; display: inline-block; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.chart-empty { color: var(--muted); font-size: 13px; padding: 30px 0; text-align: center; }
.more-link { font-size: 12px; margin-top: 6px; }

#tip {
  position: fixed; z-index: 100; pointer-events: none; background: #142141; color: #fff; font-size: 12px; padding: 6px 9px;
  border-radius: 6px; max-width: 300px; box-shadow: 0 6px 20px rgba(0, 0, 0, .25); line-height: 1.4; display: none; white-space: pre-line;
}
:root[data-theme="dark"] #tip { background: #E7EDF6; color: #07111F; }

/* ------------------------------- tabelas ------------------------------- */
.tbl-wrap { overflow: auto; max-height: min(70vh, 760px); border-top: 1px solid var(--border); position: relative; }
table.tbl { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 12.5px; }
.tbl th, .tbl td { padding: 7px 10px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; vertical-align: middle; background: var(--surface); }
.tbl th { position: sticky; top: 0; z-index: 3; background: var(--surface-2); font-weight: 600; color: var(--muted); font-size: 12px; }
.tbl th button.sort { border: 0; background: none; padding: 0; cursor: pointer; font-weight: 600; color: inherit; display: inline-flex; gap: 4px; align-items: center; }
.tbl th[aria-sort="ascending"], .tbl th[aria-sort="descending"] { color: var(--text); }
.tbl tbody tr { cursor: pointer; }
.tbl tbody tr:hover td { background: var(--surface-2); }
.tbl tbody tr.sel td { background: var(--accent-soft); }
.tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl td.mono { font-family: var(--mono); font-size: 12px; }
.tbl td.wrap { white-space: normal; min-width: 220px; }
.tbl tr.ef td:first-child { box-shadow: inset 3px 0 0 var(--ok); }
@media (min-width: 1024px) {
  .tbl.freeze th.fz1, .tbl.freeze td.fz1 { position: sticky; left: 0; z-index: 2; }
  .tbl.freeze th.fz2, .tbl.freeze td.fz2 { position: sticky; left: 36px; z-index: 2; box-shadow: 1px 0 0 var(--border); }
  .tbl.freeze th.fz1, .tbl.freeze th.fz2 { z-index: 4; }
}
.tbl .fz1 { width: 36px; min-width: 36px; }
.cell-actions { display: inline-flex; gap: 2px; margin-left: 4px; opacity: .55; }
tr:hover .cell-actions, .cell-actions:focus-within { opacity: 1; }
.mini { border: 0; background: none; padding: 3px; border-radius: 4px; cursor: pointer; color: var(--muted); display: inline-flex; }
.mini:hover { background: var(--surface-3); color: var(--text); }
.warn-ic { color: var(--orange); display: inline-flex; vertical-align: middle; }
.tbl-foot { display: flex; align-items: center; gap: 10px; padding: 10px 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.tbl-foot .pg { margin-left: auto; display: flex; gap: 4px; align-items: center; }
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 14px; }
.toolbar .grow { flex: 1; min-width: 200px; }
.cards-list { display: none; }
@media (max-width: 720px) {
  .tbl-wrap.resp { display: none; }
  .cards-list { display: grid; gap: 8px; padding: 10px; }
}
.call-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; display: grid; gap: 4px; background: var(--surface); text-align: left; cursor: pointer; width: 100%; }
.call-card.ef { box-shadow: inset 3px 0 0 var(--ok); }
.call-card .row1 { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; }
.call-card .meta { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; }

/* ------------------------------- upload ------------------------------- */
.uploads { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 900px) { .uploads { grid-template-columns: minmax(0, 1fr); } }
.drop {
  border: 2px dashed var(--border); border-radius: var(--radius); padding: 22px 16px; text-align: center; display: grid; gap: 8px; justify-items: center;
  background: var(--surface-2); transition: border-color .15s, background .15s; cursor: pointer;
}
.drop:hover, .drop.drag { border-color: var(--accent); background: var(--accent-soft); }
.drop .big { width: 28px; height: 28px; color: var(--accent); }
.drop p { margin: 0; }
.drop .hint { font-size: 12px; color: var(--muted); }
.file-ok { display: grid; gap: 10px; }
.file-row { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface-2); }
.file-row .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-row .inf { font-size: 12px; color: var(--muted); }
.file-row .grow { min-width: 0; flex: 1; }
.err-box { background: var(--err-bg); color: var(--err-text); border-radius: var(--radius-sm); padding: 8px 10px; font-size: 13px; display: flex; gap: 8px; align-items: flex-start; }
.info-box { background: var(--accent-soft); border-radius: var(--radius-sm); padding: 8px 10px; font-size: 13px; display: flex; gap: 8px; align-items: flex-start; }
.map-list { display: grid; gap: 4px; font-size: 12px; }
.map-list .mi { display: flex; gap: 6px; align-items: center; }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.steps li::marker { font-weight: 700; color: var(--accent); }
.actions-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.skel { background: linear-gradient(90deg, var(--surface-2), var(--surface-3), var(--surface-2)); background-size: 200% 100%; animation: sk 1.2s linear infinite; border-radius: 6px; }
@keyframes sk { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* ------------------------------- sheet / modal ------------------------------- */
.sheet {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); background: var(--surface); z-index: 90;
  border-left: 1px solid var(--border); box-shadow: -10px 0 40px rgba(0, 0, 0, .2); display: flex; flex-direction: column;
  transform: translateX(100%); transition: transform .2s ease; visibility: hidden;
}
.sheet.open { transform: none; visibility: visible; }
.sheet-h { display: flex; align-items: flex-start; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
.sheet-h h2 { margin: 0; font-size: 16px; }
.sheet-h p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
.sheet-b { overflow-y: auto; padding: 14px 16px; display: grid; gap: 14px; align-content: start; }
.kv { display: grid; grid-template-columns: 140px 1fr; gap: 6px 12px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats3 > div { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px; }
.stats3 b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
.stats3 span { font-size: 11px; color: var(--muted); }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.timeline li { display: grid; grid-template-columns: 14px 1fr; gap: 10px; position: relative; padding-bottom: 10px; }
.timeline li::before { content: ""; position: absolute; left: 6px; top: 14px; bottom: 0; width: 2px; background: var(--border); }
.timeline li:last-child::before { display: none; }
.timeline .dot { margin-top: 5px; width: 14px; height: 14px; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--border); }
.timeline .t { font-size: 12.5px; }
.timeline .t .m { color: var(--muted); font-size: 12px; }
.timeline li.cur .t { font-weight: 600; }

.modal-bg { position: fixed; inset: 0; background: rgba(7, 17, 31, .5); z-index: 95; display: none; align-items: center; justify-content: center; padding: 16px; }
.modal-bg.open { display: flex; }
.modal { background: var(--surface); border-radius: var(--radius); width: min(760px, 100%); max-height: 90vh; display: flex; flex-direction: column; border: 1px solid var(--border); box-shadow: 0 20px 60px rgba(0, 0, 0, .3); }
.modal-h { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; gap: 10px; }
.modal-h h2 { margin: 0; font-size: 16px; }
.modal-h p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
.modal-b { padding: 14px 16px; overflow-y: auto; display: grid; gap: 12px; }
.modal-f { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.map-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 8px 12px; align-items: center; }
.map-grid .req { color: var(--err-text); font-weight: 700; }
@media (max-width: 560px) { .map-grid { grid-template-columns: 1fr; } .kv { grid-template-columns: 1fr; } .kv dt { font-weight: 600; } }

.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #142141; color: #fff; padding: 9px 14px; border-radius: 8px; z-index: 120; font-size: 13px; box-shadow: 0 10px 30px rgba(0, 0, 0, .3); display: none; max-width: calc(100vw - 32px); }
.toast.show { display: block; }
:root[data-theme="dark"] .toast { background: #E7EDF6; color: #07111F; }

.menu { display: grid; gap: 2px; min-width: 280px; }
.menu h4 { margin: 6px 6px 2px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.menu-row { display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 4px; font-size: 13px; }
.menu-row:hover { background: var(--surface-2); }
.menu-row .t { flex: 1; }
.cand { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 10px; display: flex; gap: 10px; align-items: center; font-size: 12.5px; }
.cand .grow { flex: 1; min-width: 0; }
.cand .m { color: var(--muted); font-size: 12px; }
.unm-card { display: grid; gap: 8px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.nowrap { white-space: nowrap; }
.ok-text { color: var(--ok-text); } .err-text { color: var(--err-text); }
.matrix td.num.hot { background: var(--ok-bg); }
.empty { text-align: center; padding: 40px 16px; display: grid; gap: 12px; justify-items: center; }
.empty .big { width: 36px; height: 36px; color: var(--accent); }
.empty h2 { margin: 0; font-size: 18px; }
.empty p { margin: 0; color: var(--muted); max-width: 560px; }
.guide { text-align: left; max-width: 560px; }

/* ------------------------------- barras (HTML) ------------------------------- */
.hb { display: grid; gap: 2px; }
.hb-row {
  display: grid; grid-template-columns: minmax(90px, 34%) minmax(0, 1fr) auto; gap: 10px; align-items: center;
  font-size: 12.5px; border: 0; background: none; text-align: left; padding: 4px 6px; border-radius: 4px; width: 100%; cursor: pointer; color: var(--text);
}
.hb-row:hover { background: var(--surface-2); }
.hb-l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hb-t { height: 14px; background: var(--surface-2); border-radius: 3px; overflow: hidden; display: flex; }
.hb-t > span { height: 100%; display: block; min-width: 0; }
.hb-v { font-variant-numeric: tabular-nums; min-width: 56px; text-align: right; color: var(--muted); }
.bg-ok { background: var(--ok); } .bg-neutral { background: var(--neutral-bar); } .bg-warn { background: var(--warn); } .bg-err { background: var(--err); }
.bg-acc { background: var(--accent); } .bg-acc2 { background: var(--accent-2); } .bg-blue { background: #0065FF; } .bg-orange { background: var(--orange); }
.vc { display: flex; align-items: stretch; gap: 8px; height: 220px; padding-top: 4px; }
.vc-col { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 100%; border-radius: 4px; }
.vc-col:hover { background: var(--surface-2); }
.vc-area { flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-top: 18px; position: relative; }
.vc-bar { width: 70%; max-width: 56px; border-radius: 3px 3px 0 0; flex: none; }
.vc-n { margin-bottom: 3px; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.vc-lab { font-size: 11px; color: var(--muted); text-align: center; line-height: 1.2; min-height: 28px; }
.mono { font-family: var(--mono); font-size: 12px; }
code { font-family: var(--mono); font-size: 12px; background: var(--surface-2); padding: 0 4px; border-radius: 3px; }

.filt-mob { display: none; }
@media (min-width: 1024px) { .mob-only { display: none !important; } }
@media (max-width: 1023px) {
  .desk-only { display: none !important; }
  .filt-mob { display: inline-flex; }
  .filters-top { padding: 8px 10px; }
}
@media (max-width: 640px) {
  .hb-row { grid-template-columns: minmax(70px, 38%) minmax(0, 1fr) auto; gap: 6px; }
  .vc-lab { font-size: 10px; }
  .actions-row .btn { flex: 1 1 auto; }
}

/* typeahead (Closer / Supervisor / Equipe) */
.ta { position: relative; }
.ta-list { top: 100%; margin-top: 4px; max-height: 320px; overflow-y: auto; width: max-content; min-width: 100%; max-width: min(420px, 92vw); display: grid; }
.ta-list .ms-opt > span:first-child { flex: 1; }
.ta-list[hidden] { display: none; }
.ta-list .ms-opt { border: 0; background: none; text-align: left; width: 100%; color: var(--text); }
.ta-list .ms-opt:focus { background: var(--accent-soft); }
.ta-all { border-bottom: 1px solid var(--border) !important; border-radius: 0; }
.filters-top .field.ta { width: 180px; }
.cand.motivo:hover { background: var(--surface-2) !important; }

/* ============================================================================
   CADÊNCIA DE LIGAÇÕES — estilos do módulo (reaproveita os tokens FINX acima)
   ============================================================================ */
.nav-group { display: flex; align-items: center; gap: 7px; padding: 8px 10px 4px; font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.nav-group svg.ic { width: 13px; height: 13px; }
.nav-group.sep { margin-top: 10px; padding-top: 14px; border-top: 1px solid var(--border); }
.badge svg.ic { width: 12px; height: 12px; }
.ok-text svg.ic, .err-text svg.ic, .warn-ic svg.ic { width: 13px; height: 13px; vertical-align: -2px; }
.filters-top .field.cad-ms { width: 230px; }
.cad-ms .pop { min-width: 300px; }
.cad-todos { border-bottom: 1px solid var(--border); border-radius: 0; margin-bottom: 2px; }
.cad-notice { background: var(--warn-bg); color: var(--warn-text); border: 1px solid var(--warn); border-radius: var(--radius); padding: 10px 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.cad-notice > svg.ic { flex: none; }
.cad-opts { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; color: var(--muted); padding: 0 2px; }
.cad-opts .seg button:disabled { opacity: .5; cursor: not-allowed; }
.cad-rate { display: inline-flex; align-items: center; gap: 8px; justify-content: flex-end; }
.cad-rate-bar { width: 64px; height: 7px; border-radius: 4px; background: var(--err); opacity: .9; overflow: hidden; display: inline-block; }
.cad-rate-bar b { display: block; height: 100%; background: var(--ok); }
.cad-rate-v { min-width: 48px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.cad-tbl tfoot td { position: sticky; bottom: 0; background: var(--surface-2); border-top: 2px solid var(--border); z-index: 2; }
.cad-tbl tr.cad-nao td:first-child { box-shadow: inset 3px 0 0 var(--err); }
.cad-wrap { white-space: normal; display: block; min-width: 220px; max-width: 360px; line-height: 1.35; }
.tbl td.cad-wrap-td { white-space: normal; }
.cad-kpi-link { cursor: pointer; }
.cad-kpi-link:hover { border-color: var(--accent); }
.cad-cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 460px), 1fr)); gap: 16px; }
.cad-cat .stats3 b { font-size: 20px; }
.cad-stats4 { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 560px) { .cad-stats4 { grid-template-columns: repeat(2, 1fr); } }
.cad-email { white-space: pre-wrap; font-family: var(--font); font-size: 13.5px; line-height: 1.6; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin: 0; max-height: 72vh; overflow: auto; }
.cad-assunto { font-weight: 600; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 10px; }
.cad-email-grid { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); }
@media (max-width: 1180px) { .cad-email-grid { grid-template-columns: minmax(0, 1fr); } }
.cad-map select { min-width: 180px; }
.cad-map td { vertical-align: middle; }
.modal.cad-modal { width: min(1100px, 100%); }
.cad-img-wrap { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; overflow: auto; max-height: 62vh; }
.cad-img { display: block; width: 100%; height: auto; border-radius: 6px; box-shadow: var(--shadow); }
.cad-cat .tbl td { white-space: normal; }
.cad-cat .cad-wrap, .sheet .cad-wrap { min-width: 0; max-width: none; }
.cad-tbl .cad-wrap { min-width: 200px; max-width: 320px; }

</style>
</head>

<script>
// @ts-check
// Resgate de Monitoria — nucleo puro (sem DOM): parse de duracao/data,
// deteccao de colunas, cruzamento Ligacoes x Kanban, filtros e metricas.
// Roda no navegador (window.MRCore) e no Node (require) pros testes.
(function (root) {
  'use strict';

  // regra de ligacao efetiva: 1min30 ou mais (90 s). Mudar aqui muda o calculo.
  const EFETIVA_SEG = 90;

  /* ------------------------------------------------------------------ */
  /* Normalizacao                                                        */
  /* ------------------------------------------------------------------ */

  /** @param {unknown} s */
  function semAcento(s) {
    return String(s).normalize('NFD').replace(/[̀-ͯ]/g, '');
  }

  /** @param {unknown} h */
  function normHeader(h) {
    return semAcento(h == null ? '' : h)
      .trim()
      .toLowerCase()
      .replace(/[\s\-./]+/g, '_')
      .replace(/[^a-z0-9_]/g, '')
      .replace(/_+/g, '_')
      .replace(/^_|_$/g, '');
  }

  /** Codigo do lead: string, sem espacos, sem ".0" do Excel, mantendo zeros a esquerda.
   * @param {unknown} v */
  function normCode(v) {
    if (v == null) return '';
    let s = String(v).replace(/\s+/g, '');
    if (/^\d+\.0+$/.test(s)) s = s.replace(/\.0+$/, '');
    return s;
  }

  /** @param {unknown} v */
  function normPhone(v) {
    if (v == null) return '';
    return String(v).trim().replace(/\.0+$/, '').replace(/\D/g, '');
  }

  /** Nome: sem acento, minusculo, sem pontuacao, espacos simples.
   * @param {unknown} v */
  function normName(v) {
    if (v == null) return '';
    return semAcento(v)
      .toLowerCase()
      .replace(/[^\p{L}\p{N}\s]/gu, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  /** @param {unknown} v */
  function texto(v) {
    if (v == null) return '';
    if (v instanceof Date) return fmtDataHora(v);
    return String(v).trim();
  }

  /* ------------------------------------------------------------------ */
  /* Duracao                                                             */
  /* ------------------------------------------------------------------ */

  /**
   * Converte duracao em segundos. Retorna null quando invalida/vazia
   * (nunca vira zero em silencio).
   * Aceita "00:05:32", "5:32" (mm:ss), "300", serial de tempo do Excel
   * (fracao do dia), Date do XLSX e texto tipo "5 min 32 s".
   * @param {unknown} v
   * @returns {number|null}
   */
  function parseDuration(v) {
    if (v == null) return null;
    if (v instanceof Date) {
      if (isNaN(v.getTime())) return null;
      return v.getHours() * 3600 + v.getMinutes() * 60 + v.getSeconds();
    }
    if (typeof v === 'number') {
      if (!isFinite(v) || v < 0) return null;
      if (v < 1) return Math.round(v * 86400); // serial de tempo do Excel
      return Math.round(v);
    }
    if (typeof v === 'boolean') return null;
    const s = String(v).trim().toLowerCase();
    if (!s) return null;
    if (s.startsWith('-')) return null;
    let m = s.match(/^(\d+):(\d{1,2}):(\d{1,2})(?:[.,]\d+)?$/);
    if (m) {
      const h = +m[1], mi = +m[2], se = +m[3];
      if (mi > 59 || se > 59) return null;
      return h * 3600 + mi * 60 + se;
    }
    m = s.match(/^(\d+):(\d{1,2})(?:[.,]\d+)?$/);
    if (m) {
      const mi = +m[1], se = +m[2];
      if (se > 59) return null;
      return mi * 60 + se;
    }
    if (/^\d+(?:[.,]\d+)?$/.test(s)) return parseDuration(Number(s.replace(',', '.')));
    // textual: "1h 2min 3s", "5 min", "32 seg", "5m32s"
    const re = /(\d+(?:[.,]\d+)?)\s*(h|hr|hrs|hora|horas|m|min|mins|minuto|minutos|s|seg|segs|segundo|segundos|sec)\b/g;
    let total = 0, achou = false, mm;
    const resto = s.replace(re, '').replace(/[\s,e]+/g, '');
    while ((mm = re.exec(s))) {
      achou = true;
      const n = Number(mm[1].replace(',', '.'));
      const u = mm[2];
      if (u.startsWith('h')) total += n * 3600;
      else if (u.startsWith('m')) total += n * 60;
      else total += n;
    }
    if (achou && !resto) return Math.round(total);
    return null;
  }

  /** @param {unknown} n */
  function pad(n) { return String(n).padStart(2, '0'); }

  /** @param {number|null|undefined} sec */
  function fmtDuracao(sec) {
    if (sec == null || !isFinite(sec)) return '—';
    const s = Math.round(sec);
    return pad(Math.floor(s / 3600)) + ':' + pad(Math.floor((s % 3600) / 60)) + ':' + pad(s % 60);
  }

  /** mm:ss abaixo de 1h, HH:mm:ss acima.
   * @param {number|null|undefined} sec */
  function fmtDuracaoCurta(sec) {
    if (sec == null || !isFinite(sec)) return '—';
    const s = Math.round(sec);
    if (s < 3600) return pad(Math.floor(s / 60)) + ':' + pad(s % 60);
    return fmtDuracao(s);
  }

  /** @param {number|null} sec */
  function classificarDuracao(sec) {
    if (sec == null) return 'Duração inválida';
    return sec >= EFETIVA_SEG ? '1min30 ou mais' : 'Abaixo de 1min30';
  }

  /* ------------------------------------------------------------------ */
  /* Datas (sempre horario local — nada de UTC mexendo no dia)          */
  /* ------------------------------------------------------------------ */

  /**
   * @param {number} y @param {number} mo @param {number} d
   * @param {number} [h] @param {number} [mi] @param {number} [s]
   */
  function dataLocal(y, mo, d, h, mi, s) {
    if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
    if ((h || 0) > 23 || (mi || 0) > 59 || (s || 0) > 59) return null;
    const dt = new Date(y, mo - 1, d, h || 0, mi || 0, s || 0);
    if (dt.getMonth() !== mo - 1 || dt.getDate() !== d) return null;
    return dt;
  }

  /** Serial do Excel (dias desde 1899-12-30) -> Date local.
   * @param {number} n */
  function serialParaData(n) {
    const dias = Math.floor(n);
    const seg = Math.round((n - dias) * 86400);
    return new Date(1899, 11, 30 + dias, 0, 0, seg);
  }

  /**
   * @param {unknown} v
   * @returns {Date|null}
   */
  function parseDate(v) {
    if (v == null || v === '') return null;
    if (v instanceof Date) return isNaN(v.getTime()) ? null : new Date(v.getTime());
    if (typeof v === 'number') {
      if (!isFinite(v) || v < 1 || v > 2958465) return null;
      return serialParaData(v);
    }
    const s = String(v).trim();
    if (!s) return null;
    let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?(?:\.\d+)?)?\s*(Z|[+-]\d{2}:?\d{2})?$/i);
    if (m) {
      if (m[7]) {
        const dt = new Date(s.replace(' ', 'T'));
        return isNaN(dt.getTime()) ? null : dt;
      }
      return dataLocal(+m[1], +m[2], +m[3], m[4] ? +m[4] : 0, m[5] ? +m[5] : 0, m[6] ? +m[6] : 0);
    }
    m = s.match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{2,4})(?:[ ,T]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);
    if (m) {
      let y = +m[3];
      if (y < 100) y += 2000;
      return dataLocal(y, +m[2], +m[1], m[4] ? +m[4] : 0, m[5] ? +m[5] : 0, m[6] ? +m[6] : 0);
    }
    if (/^\d+(?:[.,]\d+)?$/.test(s)) return parseDate(Number(s.replace(',', '.')));
    return null;
  }

  /** @param {Date|null} d */
  function fmtData(d) { return d ? pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear() : ''; }
  /** @param {Date|null} d */
  function fmtHora(d) { return d ? pad(d.getHours()) + ':' + pad(d.getMinutes()) : ''; }
  /** @param {Date|null} d */
  function fmtDataHora(d) { return d ? fmtData(d) + ' ' + fmtHora(d) : ''; }
  /** yyyy-mm-dd em horario local.
   * @param {Date|null} d */
  function chaveDia(d) { return d ? d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) : ''; }

  /* ------------------------------------------------------------------ */
  /* Deteccao de colunas                                                 */
  /* ------------------------------------------------------------------ */

  /** @typedef {{key:string,label:string,aliases:string[],obrigatorio?:boolean}} Campo */

  /** @type {Campo[]} */
  const CAMPOS_LIGACOES = [
    { key: 'lead_code', label: 'Código do lead', aliases: ['lead_code', 'codigo_do_lead', 'codigo_lead', 'cod_lead', 'product_reference_code', 'reference_code', 'codigo'] },
    { key: 'created_at', label: 'Data da ligação', obrigatorio: true, aliases: ['created_at', 'data_da_ligacao', 'data_ligacao', 'data_hora_ligacao', 'data_da_chamada', 'data_hora', 'datahora', 'data', 'inicio'] },
    { key: 'duracao', label: 'Duração da chamada', obrigatorio: true, aliases: ['duracao_chamada', 'duracao_da_chamada', 'duracao_ligacao', 'duracao', 'tempo_de_chamada', 'tempo', 'call_duration', 'duration'] },
    { key: 'effective', label: 'Effective (original)', aliases: ['effective', 'efetiva', 'efetivo'] },
    { key: 'user_name', label: 'Closer / responsável', obrigatorio: true, aliases: ['user_name', 'closer', 'usuario', 'operador', 'atendente', 'responsavel', 'agente', 'user'] },
    { key: 'lead_name', label: 'Nome do lead', aliases: ['lead_name', 'nome_do_lead', 'nome_lead', 'nome_cliente', 'cliente', 'nome'] },
    { key: 'phone', label: 'Telefone', aliases: ['phone', 'telefone', 'celular', 'fone', 'numero', 'whatsapp'] },
    { key: 'tipo_chamada', label: 'Tipo da chamada', aliases: ['tipo_chamada', 'tipo_da_chamada', 'call_type', 'canal'] },
  ];

  /** @type {Campo[]} */
  const CAMPOS_KANBAN = [
    { key: 'nome', label: 'Nome do Lead', aliases: ['nome_do_lead', 'lead_name', 'nome_lead', 'nome_cliente', 'cliente', 'nome'] },
    { key: 'telefone', label: 'Telefone', aliases: ['telefone', 'phone', 'celular', 'fone'] },
    { key: 'lead_phones', label: 'Outros telefones', aliases: ['lead_phones', 'telefones'] },
    { key: 'cpf', label: 'CPF', aliases: ['cpf', 'documento'] },
    { key: 'id', label: 'ID (oportunidade)', aliases: ['id', 'opportunity_id', 'id_oportunidade', 'oportunidade_id'] },
    { key: 'loja', label: 'Loja', aliases: ['loja'] },
    { key: 'tipo', label: 'Tipo', aliases: ['tipo'] },
    { key: 'closer', label: 'Closer', aliases: ['closer', 'user_name', 'responsavel'] },
    { key: 'supervisor', label: 'Supervisor', aliases: ['supervisor', 'supervisao'] },
    { key: 'equipe', label: 'Equipe', aliases: ['equipe', 'time', 'mesa_grupo', 'mesa', 'bu', 'locadora'] },
    { key: 'sdr', label: 'SDR', aliases: ['sdr'] },
    { key: 'supervisao_sdr', label: 'Supervisão SDR', aliases: ['supervisao_sdr', 'supervisor_sdr'] },
    { key: 'etapa', label: 'Etapa do Board', obrigatorio: true, aliases: ['etapa_do_board', 'etapa_board', 'etapa', 'board_step', 'etapa_atendimento'] },
    { key: 'nome_board', label: 'Nome do Board', aliases: ['nome_do_board', 'nome_board', 'board'] },
    { key: 'status_geral', label: 'Status Geral', aliases: ['status_geral', 'status'] },
    { key: 'motivo_perda', label: 'Motivo da Perda', aliases: ['motivo_da_perda', 'motivo_perda', 'lost_reason'] },
    { key: 'status_locacao', label: 'Status Locação', aliases: ['status_locacao', 'status_da_locacao'] },
    { key: 'data_lead', label: 'Data do Lead', aliases: ['data_do_lead', 'data_lead', 'created_at', 'data_criacao'] },
    { key: 'origem', label: 'Origem', aliases: ['origem', 'source'] },
    { key: 'temperatura', label: 'Temperatura', aliases: ['temperatura'] },
    { key: 'reference_code', label: 'Código do lead (reference_code)', aliases: ['reference_code', 'codigo_do_lead', 'lead_code', 'codigo_lead', 'codigo'] },
    { key: 'modelo', label: 'Modelo', aliases: ['modelo', 'veiculo'] },
    { key: 'plano', label: 'Plano', aliases: ['plano'] },
    { key: 'quilometragem', label: 'Quilometragem', aliases: ['quilometragem', 'km'] },
    { key: 'tags', label: 'Tags', aliases: ['tags'] },
  ];

  /**
   * Casa cabecalhos da planilha com os campos esperados.
   * Exato (normalizado) primeiro, na ordem dos aliases; depois "contem"
   * so pra aliases compostos (evita "data" casar com tudo).
   * @param {string[]} headers
   * @param {Campo[]} campos
   * @returns {Record<string,string>} campo -> cabecalho original
   */
  function detectarColunas(headers, campos) {
    /** @type {Record<string,string>} */
    const map = {};
    const norm = headers.map(normHeader);
    const usados = new Set();
    for (const c of campos) {
      for (const a of c.aliases) {
        const i = norm.findIndex((h, idx) => h === a && !usados.has(idx));
        if (i >= 0) { map[c.key] = headers[i]; usados.add(i); break; }
      }
    }
    for (const c of campos) {
      if (map[c.key]) continue;
      for (const a of c.aliases) {
        if (!a.includes('_')) continue;
        const i = norm.findIndex((h, idx) => !usados.has(idx) && (h.includes(a) || a.includes(h) && h.length > 5));
        if (i >= 0) { map[c.key] = headers[i]; usados.add(i); break; }
      }
    }
    return map;
  }

  /** @param {Record<string,string>} map */
  function faltandoLigacoes(map) {
    const f = [];
    if (!map.duracao) f.push('Duração da chamada');
    if (!map.created_at) f.push('Data da ligação');
    if (!map.user_name) f.push('Closer / responsável');
    if (!map.lead_code && !map.phone && !map.lead_name) f.push('Código do lead, telefone ou nome (pelo menos um)');
    return f;
  }

  /** @param {Record<string,string>} map */
  function faltandoKanban(map) {
    const f = [];
    if (!map.etapa) f.push('Etapa do Board');
    if (!map.reference_code && !map.telefone && !map.nome) f.push('Código do lead, telefone ou nome (pelo menos um)');
    return f;
  }

  /* ------------------------------------------------------------------ */
  /* Cruzamento                                                          */
  /* ------------------------------------------------------------------ */

  /**
   * @typedef {Object} KanbanRow
   * @property {number} idx
   * @property {Record<string,string>} f      campos mapeados (texto)
   * @property {Record<string,unknown>} raw   linha original
   * @property {string} code
   * @property {string[]} phones
   * @property {string} nomeN
   * @property {string} closerN
   * @property {number|null} recencia
   */

  /**
   * @param {Record<string,unknown>[]} rows
   * @param {Record<string,string>} map
   * @returns {KanbanRow[]}
   */
  function prepararKanban(rows, map) {
    return rows.map((raw, idx) => {
      /** @type {Record<string,string>} */
      const f = {};
      for (const c of CAMPOS_KANBAN) f[c.key] = map[c.key] ? texto(raw[map[c.key]]) : '';
      const phones = [];
      const p = normPhone(map.telefone ? raw[map.telefone] : '');
      if (p) phones.push(p);
      if (f.lead_phones) {
        for (const x of f.lead_phones.split(/[,;/|]+/)) {
          const q = normPhone(x);
          if (q && !phones.includes(q)) phones.push(q);
        }
      }
      const dl = map.data_lead ? parseDate(raw[map.data_lead]) : null;
      return {
        idx, f, raw,
        code: normCode(map.reference_code ? raw[map.reference_code] : ''),
        phones,
        nomeN: normName(f.nome),
        closerN: normName(f.closer),
        recencia: dl ? dl.getTime() : null,
      };
    });
  }

  /**
   * Troca nome de supervisor que ja saiu pelo atual (ex.: Kanban ainda mostra
   * quem foi desligado). Muda so a copia em memoria, nunca o arquivo.
   * @param {KanbanRow[]} K
   * @param {{de:string,para:string}[]} regras
   */
  function aplicarRenomes(K, regras) {
    const m = new Map();
    for (const r of regras || []) if (normName(r.de) && r.para && r.para.trim()) m.set(normName(r.de), r.para.trim());
    if (!m.size) return K;
    for (const k of K) {
      for (const campo of ['supervisor', 'supervisao_sdr']) {
        const novo = m.get(normName(k.f[campo]));
        if (novo) k.f[campo] = novo;
      }
    }
    return K;
  }

  /**
   * @param {Map<string,number[]>} m @param {string} k @param {number} i
   */
  function push(m, k, i) {
    if (!k) return;
    const a = m.get(k);
    if (a) { if (!a.includes(i)) a.push(i); } else m.set(k, [i]);
  }

  /** @param {KanbanRow[]} K */
  function indexarKanban(K) {
    const porCodigo = new Map(), porFone = new Map(), porFone11 = new Map(), porFone10 = new Map(), porNomeCloser = new Map(), porCloser = new Map();
    for (const k of K) {
      push(porCodigo, k.code, k.idx);
      for (const p of k.phones) {
        push(porFone, p, k.idx);
        if (p.length >= 11) push(porFone11, p.slice(-11), k.idx);
        if (p.length >= 10) push(porFone10, p.slice(-10), k.idx);
      }
      if (k.nomeN) push(porNomeCloser, k.nomeN + '|' + k.closerN, k.idx);
      push(porCloser, k.closerN || '(sem closer)', k.idx);
    }
    return { porCodigo, porFone, porFone11, porFone10, porNomeCloser, porCloser };
  }

  /**
   * Regra deterministica: 1 candidato -> ele; varios -> o mais recente,
   * se a data for confiavel e estritamente maior; senao ambiguo.
   * @param {number[]} cands @param {KanbanRow[]} K
   * @returns {{idx:number, criterio?:string}|{ambiguos:number[]}}
   */
  function escolher(cands, K) {
    const u = [...new Set(cands)];
    if (u.length === 1) return { idx: u[0] };
    const comData = u.map(i => ({ i, t: K[i].recencia }));
    if (comData.every(x => x.t != null)) {
      comData.sort((a, b) => /** @type {number} */ (b.t) - /** @type {number} */ (a.t));
      if (/** @type {number} */ (comData[0].t) > /** @type {number} */ (comData[1].t)) return { idx: comData[0].i, criterio: 'registro mais recente' };
    }
    return { ambiguos: u };
  }

  /** Similaridade simples por tokens (Dice).
   * @param {string} a @param {string} b */
  function similaridade(a, b) {
    if (!a || !b) return 0;
    const ta = a.split(' ').filter(t => t.length > 1), tb = new Set(b.split(' ').filter(t => t.length > 1));
    if (!ta.length || !tb.size) return 0;
    let comum = 0;
    for (const t of new Set(ta)) if (tb.has(t)) comum++;
    return (2 * comum) / (new Set(ta).size + tb.size);
  }

  /**
   * @typedef {Object} Ligacao
   * @property {number} id
   * @property {string} chave
   * @property {Record<string,unknown>} raw
   * @property {string} lead_code
   * @property {string} lead_name
   * @property {string} phone
   * @property {string} phone_norm
   * @property {string} closer_ligacao
   * @property {string} tipo_chamada
   * @property {string} effective_original
   * @property {string} duracao_original
   * @property {number|null} duracao_segundos
   * @property {number|null} duracao_minutos
   * @property {string} duracao_fmt
   * @property {'Sim'|'Não'} ligacao_efetiva
   * @property {string} classificacao_duracao
   * @property {Date|null} data_hora
   * @property {number} ts
   * @property {string} data_ligacao
   * @property {string} hora_ligacao
   * @property {string} data_hora_ligacao
   * @property {string} dia
   * @property {string} status_cruzamento
   * @property {string} metodo_cruzamento
   * @property {string} motivo_falha
   * @property {string} criterio
   * @property {number|null} kanban
   * @property {number[]} candidatos
   * @property {number|null} sugestao
   * @property {string} closer_kanban
   * @property {string} etapa
   * @property {string} nome_board
   * @property {string} status_geral
   * @property {string} motivo_perda
   * @property {string} status_locacao
   * @property {string} supervisor
   * @property {string} sdr
   * @property {string} supervisao_sdr
   * @property {string} loja
   * @property {string} tipo
   * @property {string} origem
   * @property {string} temperatura
   * @property {string} modelo
   * @property {string} plano
   * @property {string} kanban_id
   * @property {string} reference_code
   * @property {'Sim'|'Não'} lead_perdido
   * @property {'Sim'|'Não'|''} divergencia_closer
   * @property {string} lead_key
   * @property {string} supervisor_closer  supervisor do Closer da ligacao (mais frequente no Kanban)
   * @property {string} equipe_closer      equipe do Closer da ligacao (mais frequente no Kanban)
   * @property {string} motivo_resumo      categoria simples do porque nao cruzou
   */

  const CAMPOS_KANBAN_NA_LIGACAO = /** @type {const} */ ([
    ['closer_kanban', 'closer'], ['etapa', 'etapa'], ['nome_board', 'nome_board'], ['status_geral', 'status_geral'],
    ['motivo_perda', 'motivo_perda'], ['status_locacao', 'status_locacao'], ['supervisor', 'supervisor'], ['sdr', 'sdr'],
    ['supervisao_sdr', 'supervisao_sdr'], ['loja', 'loja'], ['tipo', 'tipo'], ['origem', 'origem'], ['temperatura', 'temperatura'],
    ['modelo', 'modelo'], ['plano', 'plano'], ['kanban_id', 'id'], ['reference_code', 'reference_code'],
  ]);

  /** @param {string} etapa @param {string} status */
  function ehPerdido(etapa, status) {
    const e = normName(etapa), s = normName(status);
    return /perdid|perda|\blost\b/.test(e) || /perdid|\blost\b/.test(s);
  }

  /**
   * Cruza as ligacoes com o Kanban. Uma ligacao = uma linha no resultado,
   * sempre (nunca multiplica por duplicidade no Kanban).
   * @param {Record<string,unknown>[]} linhas
   * @param {Record<string,string>} map
   * @param {KanbanRow[]} K
   * @param {Record<string,number>} [manuais] chave da ligacao -> idx do Kanban
   * @param {string[][]} [quadro] equipes fixas: [closer, supervisor, equipe] (vence o Kanban)
   * @returns {Ligacao[]}
   */
  function cruzar(linhas, map, K, manuais, quadro) {
    const ix = indexarKanban(K);
    const perfis = mesclarQuadro(perfilCloseres(K), quadro);
    const ocorr = new Map();
    /** @type {Ligacao[]} */
    const out = [];
    const get = (/** @type {Record<string,unknown>} */ r, /** @type {string} */ k) => (map[k] ? r[map[k]] : undefined);

    for (let id = 0; id < linhas.length; id++) {
      const r = linhas[id];
      const lead_code = normCode(get(r, 'lead_code'));
      const phone = texto(get(r, 'phone'));
      const phone_norm = normPhone(get(r, 'phone'));
      const lead_name = texto(get(r, 'lead_name'));
      const closer = texto(get(r, 'user_name'));
      const durRaw = get(r, 'duracao');
      const dur = parseDuration(durRaw);
      const dt = parseDate(get(r, 'created_at'));
      const base = [lead_code, dt ? dt.getTime() : texto(get(r, 'created_at')), phone_norm, dur, normName(closer)].join('|');
      const n = (ocorr.get(base) || 0) + 1;
      ocorr.set(base, n);

      /** @type {Ligacao} */
      const L = {
        id, chave: base + '#' + n, raw: r,
        lead_code, lead_name, phone, phone_norm,
        closer_ligacao: closer,
        tipo_chamada: texto(get(r, 'tipo_chamada')),
        effective_original: map.effective ? texto(get(r, 'effective')) : '',
        duracao_original: durRaw instanceof Date ? fmtHora(durRaw) : texto(durRaw),
        duracao_segundos: dur,
        duracao_minutos: dur == null ? null : Math.round((dur / 60) * 100) / 100,
        duracao_fmt: fmtDuracao(dur),
        ligacao_efetiva: dur != null && dur >= EFETIVA_SEG ? 'Sim' : 'Não',
        classificacao_duracao: classificarDuracao(dur),
        data_hora: dt, ts: dt ? dt.getTime() : NaN,
        data_ligacao: fmtData(dt), hora_ligacao: fmtHora(dt), data_hora_ligacao: fmtDataHora(dt), dia: chaveDia(dt),
        status_cruzamento: 'Não localizado', metodo_cruzamento: 'Não cruzado', motivo_falha: '', criterio: '',
        kanban: null, candidatos: [], sugestao: null,
        closer_kanban: '', etapa: '', nome_board: '', status_geral: '', motivo_perda: '', status_locacao: '',
        supervisor: '', sdr: '', supervisao_sdr: '', loja: '', tipo: '', origem: '', temperatura: '', modelo: '', plano: '',
        kanban_id: '', reference_code: '',
        lead_perdido: 'Não', divergencia_closer: '',
        supervisor_closer: '', equipe_closer: '', motivo_resumo: '',
        lead_key: lead_code ? 'c:' + lead_code : phone_norm ? 'p:' + phone_norm : 'n:' + normName(lead_name),
      };

      const perfil = perfis.get(normName(closer));
      if (perfil) { L.supervisor_closer = perfil.supervisor; L.equipe_closer = perfil.equipe; }

      const manual = manuais ? manuais[L.chave] : undefined;
      /** @type {{idx:number,criterio?:string}|{ambiguos:number[]}|null} */
      let res = null;
      let metodo = '';
      const falhas = [];

      if (manual != null && K[manual]) {
        res = { idx: manual };
        metodo = 'Associação manual';
      }
      // 1) codigo do lead
      if (!res) {
        if (lead_code) {
          const c = ix.porCodigo.get(lead_code);
          if (c) { res = escolher(c, K); metodo = 'Código do lead'; } else falhas.push('código ' + lead_code + ' não existe no Kanban');
        } else falhas.push('ligação sem código do lead');
      }
      // 2) telefone (completo; depois ultimos 11/10 digitos so se for unico)
      if (!res) {
        if (phone_norm) {
          const c = ix.porFone.get(phone_norm);
          if (c) { res = escolher(c, K); metodo = 'Telefone'; } else {
            for (const [tam, m] of /** @type {[number, Map<string,number[]>][]} */ ([[11, ix.porFone11], [10, ix.porFone10]])) {
              if (phone_norm.length < tam) continue;
              const s = m.get(phone_norm.slice(-tam));
              if (s && s.length === 1) { res = { idx: s[0], criterio: 'últimos ' + tam + ' dígitos' }; metodo = 'Telefone'; break; }
              if (s && s.length > 1) { res = { ambiguos: s }; metodo = 'Telefone'; break; }
            }
            if (!res) falhas.push('telefone não encontrado');
          }
        } else falhas.push('ligação sem telefone');
      }
      // 3) nome + closer, exato depois de normalizar
      if (!res) {
        const nN = normName(lead_name), cN = normName(closer);
        if (nN) {
          const c = ix.porNomeCloser.get(nN + '|' + cN);
          if (c) { res = escolher(c, K); metodo = 'Nome + Closer'; } else falhas.push('nome + Closer sem correspondência exata');
        } else falhas.push('ligação sem nome do lead');
      }

      if (res && 'idx' in res) {
        const k = K[res.idx];
        L.kanban = res.idx;
        L.status_cruzamento = 'Localizado';
        L.metodo_cruzamento = metodo;
        L.criterio = res.criterio || '';
        for (const [dst, src] of CAMPOS_KANBAN_NA_LIGACAO) /** @type {any} */ (L)[dst] = k.f[src] || '';
        L.lead_perdido = ehPerdido(L.etapa, L.status_geral) ? 'Sim' : 'Não';
        if (L.closer_kanban && closer) L.divergencia_closer = normName(L.closer_kanban) === normName(closer) ? 'Não' : 'Sim';
      } else if (res && 'ambiguos' in res) {
        L.status_cruzamento = 'Correspondência ambígua';
        L.metodo_cruzamento = metodo;
        L.candidatos = res.ambiguos;
        L.motivo_resumo = MOTIVOS.ambiguo;
        L.motivo_falha = res.ambiguos.length + ' registros do Kanban batem com esta ligação (por ' + metodo.toLowerCase() + ') e não há como saber qual é o certo — escolha manualmente.';
      } else {
        // sugestao por similaridade: so com Closer compativel, nunca vira valida sozinha
        const nN = normName(lead_name), cN = normName(closer);
        let melhor = -1, nota = 0;
        const pool = ix.porCloser.get(cN || '(sem closer)') || [];
        if (nN) for (const i of pool) {
          const sc = similaridade(nN, K[i].nomeN);
          if (sc > nota) { nota = sc; melhor = i; }
        }
        if (melhor >= 0 && nota >= 0.75) {
          L.status_cruzamento = 'Revisar';
          L.metodo_cruzamento = 'Sugestão por similaridade';
          L.sugestao = melhor;
          L.candidatos = [melhor];
          falhas.push('nome parecido encontrado (' + Math.round(nota * 100) + '% de similaridade) — confirmar manualmente');
        }
        if (L.status_cruzamento === 'Revisar') {
          L.motivo_resumo = MOTIVOS.parecido;
          L.motivo_falha = 'Código e telefone não bateram, mas existe um lead com nome parecido e o mesmo Closer no Kanban (' + Math.round(nota * 100) + '% de similaridade). Confira e associe se for o mesmo.';
        } else if (!lead_code && !phone_norm && !normName(lead_name)) {
          L.motivo_resumo = MOTIVOS.semId;
          L.motivo_falha = 'A ligação veio sem código do lead, sem telefone e sem nome — não há como procurar no Kanban.';
        } else if (!perfil || !perfil.leads) {
          L.motivo_resumo = MOTIVOS.closerFora;
          L.motivo_falha = 'O Closer "' + (closer || '(vazio)') + '" não tem nenhum lead no Kanban importado — o Kanban provavelmente é de outra equipe/supervisão. ' + (lead_code ? 'O código ' + lead_code + ' também não está lá.' : '');
        } else {
          L.motivo_resumo = MOTIVOS.leadFora;
          L.motivo_falha = (lead_code ? 'O código ' + lead_code + ' não está no Kanban importado' : 'Lead sem código') + ' e o telefone/nome também não bateram. O Closer está no Kanban, então o lead deve estar em outra etapa/board fora da exportação, ou foi exportado em outra data.';
        }
      }
      out.push(L);
    }
    return out;
  }

  const MOTIVOS = {
    closerFora: 'Closer fora do Kanban importado',
    leadFora: 'Lead fora do Kanban importado',
    semId: 'Ligação sem código, telefone e nome',

    { k: 'motivo_perda', l: 'Motivo da Perda', s: r => r.motivo_perda, h: r => esc(r.motivo_perda) },
    { k: 'status_locacao', l: 'Status Locação', s: r => r.status_locacao, h: r => esc(r.status_locacao) },
