    { k: 'equipe_closer', l: 'Equipe do Closer', s: r => r.equipe_closer, h: r => esc(r.equipe_closer) || '<span class="muted">—</span>' },
    { k: 'supervisor', l: 'Supervisor do lead', s: r => r.supervisor, h: r => esc(r.supervisor) },
    { k: 'sdr', l: 'SDR', s: r => r.sdr, h: r => esc(r.sdr) },
    { k: 'loja', l: 'Loja', s: r => r.loja, h: r => esc(r.loja) },
    { k: 'origem', l: 'Origem', s: r => r.origem, h: r => esc(r.origem) },
    { k: 'temperatura', l: 'Temperatura', s: r => r.temperatura, h: r => esc(r.temperatura) },
    { k: 'modelo', l: 'Modelo', s: r => r.modelo, h: r => esc(r.modelo) },
    { k: 'plano', l: 'Plano', s: r => r.plano, h: r => esc(r.plano) },
    { k: 'tipo_chamada', l: 'Tipo da chamada', s: r => r.tipo_chamada, h: r => esc(r.tipo_chamada) },
    { k: 'effective_original', l: 'Effective original', s: r => r.effective_original, h: r => esc(r.effective_original) },
    { k: 'status_cruzamento', l: 'Status do cruzamento', s: r => r.status_cruzamento, h: r => badgeStatus(r) },
    { k: 'motivo_resumo', l: 'Por que não localizou', s: r => r.motivo_resumo, h: r => (r.motivo_resumo ? '<span data-tip="' + esc(r.motivo_falha) + '">' + esc(r.motivo_resumo) + '</span>' : '') },
    { k: 'metodo_cruzamento', l: 'Método do cruzamento', s: r => r.metodo_cruzamento, h: r => esc(r.metodo_cruzamento) + (r.criterio ? ' <span class="muted small">(' + esc(r.criterio) + ')</span>' : '') },
    { k: 'dryve', l: 'Dryve', s: r => r.lead_code, h: r => linksDryve(r, true) },
  ];
  const COLS_PADRAO = COLUNAS.map(c => c.k);

  const S = {
    pagina: 'visao',
    arq: { ligacoes: vazioArq(), kanban: vazioArq() },
    dados: null, // { linhas, mapL, K, kidIdx, ligacoes, importadoEm, demo }
    processando: false,
    filtros: C.filtrosVazios(),
    filtrosAbertos: false,
    pop: null,
    popBusca: '',
    gran: 'dia',
    expand: {},
    tab: { sort: { k: 'data', d: -1 }, page: 1, size: lsGet('mr-pag', 50), sel: new Set(), cols: lsGet('mr-colunas', COLS_PADRAO) },
    rank: { k: 'efetivas', d: -1 },
    etapaSort: { k: 'efetivas', d: -1 },
    naoloc: { aba: 'Não localizado', page: 1 },
    perdPage: 1,
    manuais: lsGet('mr-manuais', {}),
    manuaisDemo: {},
    renomes: lsGet('mr-renomes', [{ de: 'Luciana Jacomini', para: 'Tiago Benatti' }]),
    ta: { closer_ligacao: '', supervisor_closer: '', equipe_closer: '' },
    sheetId: null,
    modal: null,
  };
  if (!Array.isArray(S.tab.cols)) S.tab.cols = COLS_PADRAO;
  if (![25, 50, 100, 250].includes(S.tab.size)) S.tab.size = 50;
  function vazioArq() { return { status: 'vazio', nome: '', pasta: null, aba: '', tabela: null, map: {}, erro: '' }; }

  let ver = 0;
  let cacheF = { key: '', rows: [] };
  function todas() { return S.dados ? S.dados.ligacoes : []; }
  function filtradas() {
    const key = ver + '|' + JSON.stringify(S.filtros);
    if (cacheF.key !== key) cacheF = { key, rows: C.aplicarFiltros(todas(), S.filtros) };
    return cacheF.rows;
  }
  let cacheOpts = { ver: -1, m: {} };
  function opcoes(campo) {
    if (cacheOpts.ver !== ver) cacheOpts = { ver, m: {} };
    if (!cacheOpts.m[campo]) {
      const cnt = new Map();
      for (const r of todas()) { const v = r[campo] || ''; cnt.set(v, (cnt.get(v) || 0) + 1); }
      cacheOpts.m[campo] = [...cnt.entries()].sort((a, b) => b[1] - a[1] || String(a[0]).localeCompare(String(b[0]), 'pt-BR'));
    }
    return cacheOpts.m[campo];
  }

  /* ============================ pedacos de html ============================ */
  function badgeEfetiva(r) {
    if (r.duracao_segundos == null) return '<span class="badge b-warn">' + ic('alert') + ' Revisar duração</span>';
    return r.ligacao_efetiva === 'Sim'
      ? '<span class="badge b-ok"><span class="dot ok"></span>Efetiva 1min30+</span>'
      : '<span class="badge b-neutral"><span class="dot no"></span>Abaixo de 1min30</span>';
  }
  function badgeStatus(r) {
    const m = { 'Localizado': 'b-ok', 'Não localizado': 'b-orange', 'Correspondência ambígua': 'b-warn', 'Revisar': 'b-warn' };
    return '<span class="badge ' + (m[r.status_cruzamento] || 'b-neutral') + '"' + (r.motivo_falha ? ' data-tip="' + esc(r.motivo_falha) + '"' : '') + '>' + esc(r.status_cruzamento) + '</span>';
  }
  function acoesCopia(valor, oque) {
    return '<span class="cell-actions"><button class="mini" data-act="copiar" data-v="' + esc(valor) + '" aria-label="Copiar ' + oque + '" data-tip="Copiar ' + oque + '">' + ic('copy') + '</button></span>';
  }
  function linksDryve(r, compacto) {
    const m = C.linkMonitoria(r), o = C.linkOportunidade(r);
    let h = '';
    if (m) h += '<a class="' + (compacto ? 'mini' : 'btn sm') + '" href="' + esc(m) + '" target="_blank" rel="noopener noreferrer" data-stop="1" aria-label="Abrir monitoria deste lead no Dryve" data-tip="Monitoria no Dryve: este lead, a partir do dia da ligação">' + ic('phone') + (compacto ? '' : ' Monitoria') + '</a>';
    if (o) h += '<a class="' + (compacto ? 'mini' : 'btn sm') + '" href="' + esc(o) + '" target="_blank" rel="noopener noreferrer" data-stop="1" aria-label="Abrir oportunidade no Dryve" data-tip="Registro da oportunidade no Dryve">' + ic('ext') + (compacto ? '' : ' Oportunidade') + '</a>';
    return h ? '<span class="cell-actions" style="opacity:1">' + h + '</span>' : '<span class="muted">—</span>';
  }
  function vazioGrafico(msg) { return '<div class="chart-empty">' + esc(msg || 'Sem dados para os filtros atuais.') + '</div>'; }

  /* =============================== graficos =============================== */
  function hbars(id, items, o) {
    o = o || {};
    if (!items.length) return vazioGrafico(o.vazio);
    const lim = o.limite || 12;
    const vis = S.expand[id] ? items : items.slice(0, lim);
    const max = Math.max(1, ...items.map(i => (o.empilhado ? i.a + i.b : i.value)));
    let h = '<div class="hb" role="list">';
    for (const i of vis) {
      const attrs = o.filtro ? ' data-act="chartFiltro" data-f="' + o.filtro + '" data-v="' + esc(i.v) + '"' : ' tabindex="-1"';
      const barra = o.empilhado
        ? '<span class="bg-ok" style="width:' + (i.a / max) * 100 + '%"></span><span class="bg-neutral" style="width:' + (i.b / max) * 100 + '%"></span>'
        : '<span class="' + (o.cls || 'bg-ok') + '" style="width:' + (i.value / max) * 100 + '%"></span>';
      const val = o.empilhado ? nf(i.a) + ' / ' + nf(i.a + i.b) : (o.fmt || nf)(i.value);
      h += '<button type="button" role="listitem" class="hb-row"' + attrs + ' data-tip="' + esc(i.tip || '') + '"><span class="hb-l">' + esc(i.label) + '</span><span class="hb-t">' + barra + '</span><span class="hb-v">' + val + '</span></button>';
    }
    h += '</div>';
    if (items.length > lim) h += '<button class="btn ghost sm more-link" data-act="expand" data-id="' + id + '">' + (S.expand[id] ? 'Mostrar menos' : 'Mostrar todos (' + items.length + ')') + '</button>';
    return h;
  }
  function vcols(items) {
    const max = Math.max(1, ...items.map(i => i.value));
    return '<div class="vc">' + items.map(i =>
      '<div class="vc-col" data-tip="' + esc(i.tip) + '" tabindex="0"><span class="vc-area"><span class="vc-n">' + nf(i.value) + '</span><span class="vc-bar ' + i.cls + '" style="height:' + Math.max(1, (i.value / max) * 85) + '%"></span></span><span class="vc-lab">' + esc(i.label) + '</span></div>').join('') + '</div>';
  }
  function larguraGrafico() {
    const cw = content.clientWidth - 40;
    return Math.max(260, Math.round((window.innerWidth > 1180 ? (cw - 16) / 2 : cw) - 30));
  }
  function linha(serie) {
    if (!serie.length) return vazioGrafico();
    const W = larguraGrafico(), H = 230, L = 44, R = 12, T = 12, B = 30;
    const maxV = Math.max(1, ...serie.map(s => s.total));
    const passo = Math.pow(10, Math.floor(Math.log10(maxV)));
    const topo = Math.ceil(maxV / passo) * passo;
    const x = i => L + (serie.length === 1 ? (W - L - R) / 2 : (i * (W - L - R)) / (serie.length - 1));
    const y = v => T + (H - T - B) * (1 - v / topo);
    let g = '<g class="grid">';
    for (let k = 0; k <= 4; k++) {
      const v = (topo * k) / 4, yy = y(v);
      g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '"/><text x="' + (L - 6) + '" y="' + (yy + 4) + '" text-anchor="end">' + nf(Math.round(v)) + '</text>';
    }
    g += '</g>';
    const cada = Math.max(1, Math.ceil(serie.length / Math.max(2, Math.floor((W - L) / 58))));
    let lx = '';
    serie.forEach((s, i) => { if (i % cada === 0 || i === serie.length - 1) lx += '<text x="' + x(i) + '" y="' + (H - 10) + '" text-anchor="middle">' + esc(s.label) + '</text>'; });
    const path = k => serie.map((s, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(s[k]).toFixed(1)).join(' ');
    let pts = '';
    if (serie.length <= 62) serie.forEach((s, i) => { pts += '<circle cx="' + x(i) + '" cy="' + y(s.total) + '" r="3" class="f-acc"/><circle cx="' + x(i) + '" cy="' + y(s.efetivas) + '" r="3" class="f-ok"/>'; });
    const larg = serie.length === 1 ? W - L - R : (W - L - R) / (serie.length - 1);
    let hov = '';
    serie.forEach((s, i) => {
      hov += '<rect x="' + (x(i) - larg / 2) + '" y="' + T + '" width="' + larg + '" height="' + (H - T - B) + '" fill="transparent" data-tip="' + esc(s.label + (S.gran === 'dia' ? '' : '') + '\nTotal: ' + nf(s.total) + '\n1min30 ou mais: ' + nf(s.efetivas) + ' (' + pf(s.total ? (s.efetivas / s.total) * 100 : 0) + ')') + '"/>';
    });
    return '<div class="chart"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Evolução das ligações: total e com 1min30 ou mais">' + g + lx +
      '<path d="' + path('total') + '" fill="none" class="s-acc" stroke-width="2"/><path d="' + path('efetivas') + '" fill="none" class="s-ok" stroke-width="2"/>' + pts + hov + '</svg></div>';
  }
  const legenda = itens => '<div class="legend">' + itens.map(([c, t]) => '<span><i class="' + c + '"></i>' + esc(t) + '</span>').join('') + '</div>';
  function card(titulo, sub, corpo, direita) {
    return '<section class="card"><div class="card-h"><h3>' + esc(titulo) + '</h3>' + (direita ? '<div class="right">' + direita + '</div>' : '') + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div><div class="card-b">' + corpo + '</div></section>';
  }

  /* ---- blocos de grafico reutilizados ---- */
  function gCloserEfetivas(rows, id) {
    const g = C.agrupar(rows, r => r.closer_ligacao).filter(x => x.efetivas > 0).sort((a, b) => b.efetivas - a.efetivas);
    return card('Ligações efetivas por Closer', 'Quantidade de ligações com 1min30 ou mais. Clique numa barra para filtrar.',
      hbars(id || 'gCloser', g.map(x => ({ label: x.label, value: x.efetivas, v: x.label === '(vazio)' ? '' : x.label, tip: x.label + '\n' + nf(x.efetivas) + ' de ' + nf(x.total) + ' ligações (' + pf(x.pct) + ')' })), { filtro: 'closer_ligacao', cls: 'bg-ok', vazio: 'Nenhuma ligação com 1min30 ou mais nos filtros atuais.' }));
  }
  function gCloserEmpilhado(rows, id) {
    const g = C.agrupar(rows, r => r.closer_ligacao).sort((a, b) => b.total - a.total);
    return card('1min30 ou mais × abaixo de 1min30 por Closer', legenda([['bg-ok', '1min30 ou mais'], ['bg-neutral', 'Abaixo de 1min30']]),
      hbars(id || 'gCloserEmp', g.map(x => ({ label: x.label, a: x.efetivas, b: x.abaixo, v: x.label === '(vazio)' ? '' : x.label, tip: x.label + '\n1min30 ou mais: ' + nf(x.efetivas) + ' (' + pf(x.pct) + ')\nAbaixo de 1min30: ' + nf(x.abaixo) + ' (' + pf(x.total ? (x.abaixo / x.total) * 100 : 0) + ')' })), { filtro: 'closer_ligacao', empilhado: true }));
  }
  function gEtapa(rows, id) {
    const g = C.agrupar(rows.filter(r => r.ligacao_efetiva === 'Sim'), r => r.etapa || (r.status_cruzamento === 'Localizado' ? '' : '\u0000nl')).sort((a, b) => b.total - a.total);
    return card('Ligações efetivas por etapa do atendimento', 'Somente <b>Etapa do Board</b> (não usa Status Geral). Clique para filtrar.',
      hbars(id || 'gEtapa', g.map(x => {
        const nl = x.label === '\u0000nl';
        const label = nl ? 'Sem etapa (não localizado no Kanban)' : x.label;
        return { label, value: x.total, v: nl || x.label === '(vazio)' ? '' : x.label, tip: label + '\n' + nf(x.total) + ' ligações com 1min30 ou mais\nDuração média: ' + dur(x.media) };
      }), { filtro: 'etapa', cls: 'bg-acc', vazio: 'Nenhuma ligação com 1min30 ou mais nos filtros atuais.' }));
  }
  function gEvolucao(rows) {
    const seg = '<div class="seg" role="group" aria-label="Agregação">' + [['dia', 'Dia'], ['semana', 'Semana'], ['mes', 'Mês']].map(([k, l]) => '<button data-act="gran" data-v="' + k + '" aria-pressed="' + (S.gran === k) + '">' + l + '</button>').join('') + '</div>';
    return card('Evolução das ligações', legenda([['bg-acc', 'Total de ligações'], ['bg-ok', '1min30 ou mais']]), linha(C.serieTemporal(rows, S.gran)), seg);
  }
  function gFaixas(rows) {
    const f = C.faixasDuracao(rows);
    const tot = f.reduce((s, x) => s + x.total, 0);
    return card('Distribuição por duração', 'Faixas de duração das ligações com duração válida.',
      vcols(f.map(x => ({ label: x.label, value: x.total, cls: x.min >= C.EFETIVA_SEG ? 'bg-ok' : 'bg-neutral', tip: x.label + ': ' + nf(x.total) + ' ligações (' + pf(tot ? (x.total / tot) * 100 : 0) + ')' }))));
  }
  function gMotivos(rows, id) {
    const g = C.agrupar(rows.filter(r => r.lead_perdido === 'Sim'), r => r.motivo_perda).sort((a, b) => b.total - a.total);
    return card('Leads perdidos por motivo', legenda([['bg-ok', 'Ligações com 1min30 ou mais'], ['bg-neutral', 'Demais ligações']]) + '<span class="muted small">Apenas ligações de leads perdidos. Clique para filtrar.</span>',
      hbars(id || 'gMotivos', g.map(x => ({ label: x.label === '(vazio)' ? 'Sem motivo informado' : x.label, a: x.efetivas, b: x.total - x.efetivas, v: x.label === '(vazio)' ? '' : x.label, tip: (x.label === '(vazio)' ? 'Sem motivo informado' : x.label) + '\nTotal: ' + nf(x.total) + ' ligações\nCom 1min30 ou mais: ' + nf(x.efetivas) + '\nLeads: ' + nf(x.leads) })), { filtro: 'motivo_perda', empilhado: true, vazio: 'Nenhuma ligação de lead perdido nos filtros atuais.' }));
  }
  function gQualidade(rows) {
    const q = C.qualidadeCruzamento(rows);
    const tot = rows.length || 1;
    const it = [
      ['Localizados por código', q.codigo, 'bg-ok', 'Código do lead'],
      ['Localizados por telefone', q.telefone, 'bg-acc', 'Telefone'],
      ['Localizados por nome + Closer', q.nomeCloser, 'bg-blue', 'Nome + Closer'],
      ['Associação manual', q.manual, 'bg-acc2', 'Associação manual'],
      ['Sugestões para revisão', q.revisar, 'bg-warn', 'Sugestão por similaridade'],
      ['Correspondências ambíguas', q.ambiguos, 'bg-warn', null],
      ['Não localizados', q.naoLocalizados, 'bg-orange', 'Não cruzado'],
    ].filter(x => x[1] > 0 || x[0] !== 'Associação manual');
    const max = Math.max(1, ...it.map(x => x[1]));
    return card('Qualidade do cruzamento', 'Como cada ligação foi (ou não) associada ao Kanban.',
      '<div class="hb">' + it.map(([l, v, c, met]) => '<button type="button" class="hb-row"' + (met ? ' data-act="chartFiltro" data-f="metodo_cruzamento" data-v="' + esc(met) + '"' : ' data-act="chartFiltro" data-f="status_cruzamento" data-v="Correspondência ambígua"') + ' data-tip="' + esc(l + ': ' + nf(v) + ' (' + pf((v / tot) * 100) + ')') + '"><span class="hb-l">' + esc(l) + '</span><span class="hb-t"><span class="' + c + '" style="width:' + (v / max) * 100 + '%"></span></span><span class="hb-v">' + nf(v) + ' · ' + pf((v / tot) * 100) + '</span></button>').join('') + '</div>');
  }

  /* ================================ KPIs ================================ */
  function kpiCards(k) {
    const itens = [
      ['Total de ligações', nf(k.total), 'Quantidade de ligações (linhas) após os filtros ativos.', 't-acc', ''],
      ['Ligações com 1min30 ou mais', nf(k.efetivas), 'Duração igual ou superior a 00:01:30 (90 segundos). Exatamente 1min30 conta como efetiva. Não depende da coluna "effective".', 't-ok', ''],
      ['% com 1min30 ou mais', pf(k.pctEfetivas), 'Ligações com 1min30 ou mais ÷ total de ligações × 100.', 't-ok', ''],
      ['Abaixo de 1min30', nf(k.abaixo), 'Ligações com duração válida menor que 90 segundos.', '', k.invalidas ? nf(k.invalidas) + ' com duração inválida' : ''],
      ['Duração média geral', dur(k.mediaDur), 'Média só das ligações com duração válida (durações vazias ou inválidas não entram como zero).', '', ''],
      ['Leads únicos', nf(k.leadsUnicos), 'Contados pelo código do lead; sem código, pelo telefone; em último caso, pelo nome normalizado.', '', ''],
      ['Closers', nf(k.closers), 'Responsáveis distintos pelas ligações (Closer da ligação).', '', ''],
      ['Leads perdidos com ligação efetiva', nf(k.perdidosComEfetiva), 'Leads cuja Etapa do Board ou Status Geral indica perda e que tiveram pelo menos uma ligação de 1min30 ou mais.', 't-err', ''],
      ['Localizados no Kanban', nf(k.localizados), 'Ligações associadas com segurança a um registro do Kanban. Taxa = localizados ÷ total × 100.', 't-acc', pf(k.taxaLocalizacao) + ' de localização'],
      ['Não localizados', nf(k.naoLocalizados), 'Ligações sem correspondência segura no Kanban (inclui as sugestões por similaridade ainda não confirmadas). Veja o motivo na página "Não localizados".', 't-warn', k.revisar ? nf(k.revisar) + ' sugestões para revisar' : ''],
      ['Correspondências ambíguas', nf(k.ambiguos), 'Mais de um registro do Kanban compatível e nenhum critério seguro de desempate (ex.: data do lead igual).', 't-warn', ''],
      ['Divergências de Closer', nf(k.divergencias), 'Ligações localizadas em que o Closer da ligação é diferente do Closer registrado no Kanban.', 't-warn', ''],
    ];
    return '<div class="kpis">' + itens.map(([l, v, t, cls, s]) =>
      '<div class="card kpi ' + cls + '"><div class="k-l">' + esc(l) + '<button class="help" data-tip="' + esc(t) + '" aria-label="O que é: ' + esc(l) + '">' + ic('help') + '</button></div><div class="k-v">' + v + '</div>' + (s ? '<div class="k-s">' + esc(s) + '</div>' : '') + '</div>').join('') + '</div>';
  }
  function skeletonKpis() {
    return '<div class="kpis">' + Array.from({ length: 12 }, () => '<div class="card kpi"><div class="skel" style="height:12px;width:60%"></div><div class="skel" style="height:26px;width:45%;margin-top:10px"></div></div>').join('') + '</div>' +
      '<div class="grid2">' + Array.from({ length: 4 }, () => '<div class="card card-b"><div class="skel" style="height:14px;width:40%"></div><div class="skel" style="height:180px;margin-top:12px"></div></div>').join('') + '</div>';
  }

  /* ================================ filtros ================================ */
  function nFiltrosAtivos() {
    const f = S.filtros;
    let n = 0;
    for (const k of ['dataIni', 'dataFim', 'buscaNome', 'buscaTelefone', 'buscaCodigo', 'texto', 'durMin', 'durMax']) if (f[k] !== '') n++;
    if (f.efetiva !== 'todas') n++;
    if (f.perdido !== 'todos') n++;
    if (f.divergencia !== 'todos') n++;
    for (const v of Object.values(f.multi)) if (v.length) n++;
    return n;
  }
  function chips() {
    const f = S.filtros, out = [];
    const fmtD = s => (s ? s.split('-').reverse().join('/') : '');
    if (f.dataIni) out.push(['dataIni', 'A partir de ' + fmtD(f.dataIni)]);
    if (f.dataFim) out.push(['dataFim', 'Até ' + fmtD(f.dataFim)]);
    if (f.buscaNome) out.push(['buscaNome', 'Nome: ' + f.buscaNome]);
    if (f.buscaTelefone) out.push(['buscaTelefone', 'Telefone: ' + f.buscaTelefone]);
    if (f.buscaCodigo) out.push(['buscaCodigo', 'Código: ' + f.buscaCodigo]);
    if (f.texto) out.push(['texto', 'Busca: ' + f.texto]);
    if (f.efetiva !== 'todas') out.push(['efetiva', f.efetiva === 'sim' ? 'Somente 1min30 ou mais' : 'Somente abaixo de 1min30']);
    if (f.durMin !== '') out.push(['durMin', 'Duração ≥ ' + f.durMin + ' min']);
    if (f.durMax !== '') out.push(['durMax', 'Duração ≤ ' + f.durMax + ' min']);
    if (f.perdido !== 'todos') out.push(['perdido', f.perdido === 'sim' ? 'Leads perdidos' : 'Leads não perdidos']);
    if (f.divergencia !== 'todos') out.push(['divergencia', f.divergencia === 'com' ? 'Com divergência de Closer' : 'Sem divergência de Closer']);
    for (const [k, l] of C.FILTROS_MULTI) {
      const v = f.multi[k];
      if (v.length) out.push(['m:' + k, l + ': ' + (v.length <= 3 ? v.map(x => x || '(vazio)').join(', ') : v.length + ' selecionados')]);
    }
    return out.map(([k, t]) => '<span class="chip"><span title="' + esc(t) + '">' + esc(t) + '</span><button data-act="rmChip" data-k="' + esc(k) + '" aria-label="Remover filtro ' + esc(t) + '">' + ic('x') + '</button></span>').join('');
  }
  function campoTexto(id, k, label, tipo, ph) {
    return '<div class="field"><label for="' + id + '">' + label + '</label><input class="input" id="' + id + '" type="' + (tipo || 'text') + '" data-filtro="' + k + '" value="' + esc(S.filtros[k]) + '"' + (ph ? ' placeholder="' + esc(ph) + '"' : '') + (tipo === 'number' ? ' min="0" step="0.5" inputmode="decimal"' : '') + '></div>';
  }
  function campoSelect(id, k, label, opts) {
    return '<div class="field"><label for="' + id + '">' + label + '</label><select class="select" id="' + id + '" data-filtro="' + k + '">' + opts.map(([v, t]) => '<option value="' + v + '"' + (S.filtros[k] === v ? ' selected' : '') + '>' + t + '</option>').join('') + '</select></div>';
  }
  function multiselect(k, label) {
    const sel = S.filtros.multi[k];
    const aberto = S.pop === 'ms:' + k;
    const txt = !sel.length ? 'Todos' : sel.length === 1 ? sel[0] || '(vazio)' : sel.length + ' selecionados';
    let h = '<div class="field ms"><span class="lbl" id="lbl-' + k + '">' + label + '</span><button type="button" class="btn ms-btn' + (sel.length ? ' has' : '') + '" data-act="pop" data-id="ms:' + k + '" aria-haspopup="listbox" aria-expanded="' + aberto + '" aria-labelledby="lbl-' + k + '"><span class="v">' + esc(txt) + '</span>' + ic('chevron') + '</button>';
    if (aberto) {
      const q = C.normName(S.popBusca);
      const ops = opcoes(k);
      const lista = ops.filter(([v]) => !q || C.normName(v || '(vazio)').includes(q));
      h += '<div class="pop" role="dialog" aria-label="' + esc(label) + '">' +
        (ops.length > 6 ? '<div class="input-ic">' + ic('search') + '<input class="input" id="pop-busca" data-popbusca="1" placeholder="Pesquisar…" value="' + esc(S.popBusca) + '" aria-label="Pesquisar opções de ' + esc(label) + '"></div>' : '') +
        '<div class="ms-list" role="listbox" aria-multiselectable="true">' +
        (lista.length ? lista.slice(0, 400).map(([v, n]) => '<label class="ms-opt"><input type="checkbox" data-ms="' + k + '" data-v="' + esc(v) + '"' + (sel.includes(v) ? ' checked' : '') + '><span>' + esc(v || '(vazio)') + '</span><span class="n">' + nf(n) + '</span></label>').join('') : '<div class="muted small" style="padding:6px">Nenhuma opção encontrada.</div>') +
        '</div><div class="ms-foot"><span>' + (sel.length ? sel.length + ' selecionado(s)' : 'Nenhum selecionado') + '</span><span><button class="btn sm ghost" data-act="msLimpar" data-k="' + k + '">Limpar</button> <button class="btn sm" data-act="popFechar">Fechar</button></span></div></div>';
    }
    return h + '</div>';
  }
  const TA_CAMPOS = [['closer_ligacao', 'Closer', 'Ex.: ped'], ['supervisor_closer', 'Supervisor', 'Supervisor do Closer'], ['equipe_closer', 'Equipe', 'Ex.: Movida']];
  function typeahead(pref, k, label, ph) {
    const id = pref + '-ta-' + k;
    return '<div class="field ta"><label for="' + id + '">' + label + '</label><div class="input-ic">' + ic('search') +
      '<input class="input" id="' + id + '" data-ta="' + k + '" autocomplete="off" placeholder="' + esc(ph) + '" value="' + esc(S.ta[k]) + '" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="' + id + '-l"></div>' +
      '<div class="pop ta-list" id="' + id + '-l" role="listbox" hidden></div></div>';
  }
  function taOpcoes(k, texto) {
    const q = C.normName(texto);
    const sel = S.filtros.multi[k];
    return opcoes(k).filter(([v]) => v && !sel.includes(v) && (!q || C.normName(v).includes(q)));
  }
  function taListaHtml(k, texto) {
    const ops = taOpcoes(k, texto);
    if (!ops.length) return '<div class="muted small" style="padding:6px">' + (opcoes(k).some(([v]) => v) ? 'Nada encontrado.' : 'Sem essa informação nas bases importadas.') + '</div>';
    let h = '';
    if (texto.trim() && ops.length > 1) h += '<button type="button" class="ms-opt ta-all" data-taopt="' + k + '" data-todos="1"><b>Todos que contêm "' + esc(texto.trim()) + '"</b><span class="n">' + ops.length + '</span></button>';
    h += ops.slice(0, 10).map(([v, n]) => '<button type="button" class="ms-opt" role="option" data-taopt="' + k + '" data-v="' + esc(v) + '"><span>' + esc(v) + '</span><span class="n">' + nf(n) + ' lig.</span></button>').join('');
    if (ops.length > 10) h += '<div class="muted small" style="padding:4px 6px">+' + (ops.length - 10) + ' — continue digitando</div>';
    return h;
  }
  function taAbrir(inp) {
    const l = document.getElementById(inp.id + '-l');
    if (!l) return;
    l.innerHTML = taListaHtml(inp.dataset.ta, inp.value);
    l.hidden = false;
    inp.setAttribute('aria-expanded', 'true');
  }
  function taEscolher(k, valores) {
    const sel = S.filtros.multi[k];
    S.filtros.multi[k] = sel.concat(valores.filter(v => !sel.includes(v)));
    S.ta[k] = '';
    mudouFiltro(); render();
    const rot = (TA_CAMPOS.find(x => x[0] === k) || [k, k])[1];
    toast(rot + ': ' + (valores.length === 1 ? valores[0] : valores.length + ' adicionados') + ' no filtro.');
  }

  function painelFiltros() {
    const n = nFiltrosAtivos();
    const f = S.filtros;
    const buscas = TA_CAMPOS.map(([k, l, ph]) => typeahead('%', k, l, ph)).join('') + campoTexto('%-dataIni', 'dataIni', 'Período inicial', 'date') + campoTexto('%-dataFim', 'dataFim', 'Período final', 'date') +
      campoTexto('%-buscaNome', 'buscaNome', 'Nome do lead', 'search', 'Buscar nome') + campoTexto('%-buscaTelefone', 'buscaTelefone', 'Telefone', 'search', 'Só números') +
      campoTexto('%-buscaCodigo', 'buscaCodigo', 'Código do lead', 'search', 'Ex.: 3148456');
    return '<section class="card filters" aria-label="Filtros">' +
      '<div class="filters-top">' +
      '<div class="desk-only" style="display:contents">' + buscas.replace(/%/g, 'f') + '</div>' +
      '<div class="actions-row" style="align-self:flex-end">' +
      '<button class="btn ' + (f.efetiva === 'sim' ? 'ok' : '') + '" data-act="soEfetivas" aria-pressed="' + (f.efetiva === 'sim') + '">' + ic('target') + ' Somente ligações efetivas</button>' +
      '<button class="btn' + (S.filtrosAbertos ? ' on' : '') + '" data-act="toggleFiltros" aria-expanded="' + S.filtrosAbertos + '" aria-controls="filtrosAdv">' + ic('sliders') + ' Filtros avançados' + (n ? ' <span class="badge b-acc">' + n + '</span>' : '') + '</button>' +
      (n ? '<button class="btn ghost danger" data-act="limparFiltros">' + ic('x') + ' Limpar filtros</button>' : '') +
      '</div></div>' +
      '<div class="chips" aria-label="Filtros ativos">' + chips() + '</div>' +
      (S.filtrosAbertos ? '<div class="filters-backdrop" data-act="toggleFiltros" aria-hidden="true"></div>' : '') +
      '<div class="filters-adv" id="filtrosAdv"' + (S.filtrosAbertos ? '' : ' hidden') + '>' +
      '<div class="filters-sheet-head"><strong>Filtros</strong><button class="btn icon ghost" data-act="toggleFiltros" aria-label="Fechar filtros">' + ic('x') + '</button></div>' +
      '<div class="mob-only" style="display:contents">' + buscas.replace(/%/g, 'fm') + '</div>' +
      multiselect('etapa', 'Etapa do Board') + multiselect('closer_kanban', 'Closer do Kanban') + multiselect('motivo_resumo', 'Por que não localizou') +
      campoSelect('f-efetiva', 'efetiva', 'Ligação com 1min30 ou mais', [['todas', 'Todas'], ['sim', 'Sim'], ['nao', 'Não']]) +
      campoTexto('f-durMin', 'durMin', 'Duração mínima (min)', 'number') + campoTexto('f-durMax', 'durMax', 'Duração máxima (min)', 'number') +
      campoSelect('f-perdido', 'perdido', 'Leads perdidos', [['todos', 'Todos'], ['sim', 'Sim'], ['nao', 'Não']]) +
      campoSelect('f-divergencia', 'divergencia', 'Divergência de Closer', [['todos', 'Todos'], ['com', 'Com divergência'], ['sem', 'Sem divergência']]) +
      C.FILTROS_MULTI.filter(([k]) => !['etapa', 'closer_ligacao', 'closer_kanban', 'motivo_resumo', 'supervisor_closer', 'equipe_closer'].includes(k)).map(([k, l]) => multiselect(k, l)).join('') +
      '<div class="field" style="align-self:end"><button class="btn" data-act="limparFiltros">' + ic('x') + ' Limpar filtros</button></div>' +
      '</div></section>';
  }

  /* ================================ paginas ================================ */
  const PAGINAS = [
    ['visao', 'Visão geral', 'grid'], ['ligacoes', 'Ligações', 'list'], ['closers', 'Closers', 'users'],
    ['etapas', 'Etapas do atendimento', 'layers'], ['perdidos', 'Leads perdidos', 'userx'], ['naoloc', 'Não localizados', 'unlink'],
    ['qualidade', 'Qualidade do cruzamento', 'shield'], ['importar', 'Importar bases', 'upload'],
  ];

  function renderNav() {
    const rows = S.dados ? filtradas() : [];
    const cont = {
      ligacoes: rows.length,
      naoloc: rows.filter(r => r.status_cruzamento !== 'Localizado').length,
      perdidos: rows.filter(r => r.lead_perdido === 'Sim').length,
    };
    // dois modulos no mesmo menu: Resgate de Monitoria (abaixo) e Cadencia de Ligacoes (window.CadUI)
    const cad = window.CadUI ? window.CadUI.navItems() : [];
    document.getElementById('nav').innerHTML =
      '<div class="nav-group" role="presentation">' + ic('phone') + '<span>Resgate de Monitoria</span></div>' +
      PAGINAS.map(([k, l, i]) =>
        '<button class="nav-item" data-act="nav" data-p="' + k + '"' + (S.pagina === k ? ' aria-current="page"' : '') + '>' + ic(i) + '<span>' + l + '</span>' + (S.dados && cont[k] != null ? '<span class="cnt">' + nf(cont[k]) + '</span>' : '') + '</button>').join('') +
      (cad.length ? '<div class="nav-group sep" role="presentation">' + ic('clock') + '<span>Cadência de Ligações</span></div>' +
        cad.map(([k, l, i, n]) =>
          '<button class="nav-item" data-act="nav" data-p="' + k + '"' + (S.pagina === k ? ' aria-current="page"' : '') + '>' + ic(i) + '<span>' + l + '</span>' + (n != null ? '<span class="cnt">' + nf(n) + '</span>' : '') + '</button>').join('') : '');
  }
  const ehCadencia = () => String(S.pagina).indexOf('cad:') === 0 && !!window.CadUI;

  function renderHeader() {
    if (ehCadencia()) {
      document.getElementById('header').innerHTML = window.CadUI.header();
      ligarFallbackLogo(document.getElementById('hdrLogo'));
      return;
    }
    const d = S.dados;
    const meta = d
      ? (d.demo ? '<span class="badge b-warn">Dados de demonstração</span>' : '<span class="opt">Última importação: ' + esc(C.fmtDataHora(d.importadoEm)) + '</span>') +
        '<span class="badge b-acc" data-tip="Ligações processadas no cruzamento">' + nf(d.ligacoes.length) + ' registros processados</span>'
      : '<span class="opt">Nenhuma base importada</span>';
    const tema = document.documentElement.getAttribute('data-theme') === 'dark';
    const nF = nFiltrosAtivos();
    document.getElementById('header').innerHTML =
      '<button class="btn icon ghost menu-btn" data-act="menu" aria-label="Abrir menu">' + ic('menu') + '</button>' +
      '<div class="hdr-logo" id="hdrLogo"><img class="logo logo-light" src="' + document.querySelector('#brand .logo-light').getAttribute('src') + '" alt="FINX"><img class="logo logo-dark" src="' + document.querySelector('#brand .logo-dark').getAttribute('src') + '" alt="FINX"><span class="logo-fallback">FINX</span></div>' +
      '<div class="hdr-title"><h1>Dashboard de Ligações Efetivas</h1><p>Cruzamento entre Ligações e Kanban</p></div>' +
      '<div class="hdr-meta">' + meta + '</div>' +
      '<div class="hdr-actions">' +
      (d && S.pagina !== 'importar' ? '<button class="btn icon ghost filt-mob" data-act="toggleFiltros" aria-label="Filtros' + (nF ? ' (' + nF + ' ativos)' : '') + '">' + ic('filter') + '</button>' : '') +
      '<a class="btn accent" href="' + C.DRYVE.monitoria + '" target="_blank" rel="noopener noreferrer" data-tip="Abre a monitoria de ligações no Dryve">' + ic('ext') + '<span class="lbl-opt"> Ir até monitoria</span></a>' +
      (d ? '<div class="ms"><button class="btn" data-act="pop" data-id="export" aria-haspopup="menu" aria-expanded="' + (S.pop === 'export') + '">' + ic('download') + '<span class="lbl-opt"> Exportar</span></button>' + (S.pop === 'export' ? menuExport() : '') + '</div>' : '') +
      '<button class="btn" data-act="nav" data-p="importar">' + ic('upload') + '<span class="lbl-opt"> Trocar arquivos</span></button>' +
      '<button class="btn icon" data-act="tema" aria-label="' + (tema ? 'Usar tema claro' : 'Usar tema escuro') + '" data-tip="' + (tema ? 'Tema claro' : 'Tema escuro') + '">' + ic(tema ? 'sun' : 'moon') + '</button>' +
      '</div>';
    ligarFallbackLogo(document.getElementById('hdrLogo'));
  }

  function menuExport() {
    const it = [
      ['completo', 'Relatório completo (todas as abas)', true],
      ['todos', 'Todos os resultados cruzados'], ['filtrados', 'Somente resultados filtrados'],
      ['efetivas', 'Somente ligações com 1min30 ou mais'], ['perdidosEf', 'Leads perdidos com ligação efetiva'],
      ['naoloc', 'Somente não localizados'], ['ambiguos', 'Somente correspondências ambíguas'],
      ['ranking', 'Ranking de Closers'], ['etapas', 'Resumo por etapa do Board'],
    ];
    return '<div class="pop right menu" role="menu"><h4>Exportar</h4>' + it.map(([k, l, soX]) =>
      '<div class="menu-row"><span class="t">' + l + '</span><button class="btn sm" data-act="exportar" data-t="' + k + '" data-f="xlsx">XLSX</button>' + (soX ? '' : '<button class="btn sm" data-act="exportar" data-t="' + k + '" data-f="csv">CSV</button>') + '</div>').join('') +
      '<div class="muted small" style="padding:6px">Exceto "todos os resultados", as exportações respeitam os filtros ativos.</div></div>';
  }

  function pagVisao(rows) {
    const k = C.kpis(rows);
    return kpiCards(k) +
      '<div class="grid2">' + gCloserEfetivas(rows) + gEtapa(rows) + '</div>' +
      '<div class="grid2">' + gEvolucao(rows) + gFaixas(rows) + '</div>' +
      '<div class="grid2">' + gCloserEmpilhado(rows) + gMotivos(rows) + '</div>' +
      '<div class="grid2">' + gQualidade(rows) + cardResumoRapido(rows) + '</div>';
  }
  function cardResumoRapido(rows) {
    const multi = C.agrupar(rows, r => r.lead_key).filter(g => g.total > 1).sort((a, b) => b.efetivas - a.efetivas || b.total - a.total).slice(0, 8);
    const corpo = multi.length ? '<div class="tbl-wrap" style="max-height:none;border-top:0"><table class="tbl"><thead><tr><th>Lead</th><th class="num">Ligações</th><th class="num">1min30+</th><th class="num">Duração média</th></tr></thead><tbody>' +
      multi.map(g => { const r = g.linhas[0]; return '<tr data-act="detalhe" data-id="' + r.id + '" tabindex="0"><td>' + esc(r.lead_name || r.lead_code || r.phone) + ' <span class="muted small">' + esc(r.lead_code) + '</span></td><td class="num">' + nf(g.total) + '</td><td class="num">' + nf(g.efetivas) + '</td><td class="num">' + dur(g.media) + '</td></tr>'; }).join('') + '</tbody></table></div>' : vazioGrafico('Nenhum lead com mais de uma ligação nos filtros atuais.');
    return card('Leads com várias ligações', 'Leads com mais de uma ligação no período, priorizando os com mais ligações de 1min30 ou mais. Clique para ver o histórico.', corpo);
  }

  /* ---------------------------- tabela de ligacoes ---------------------------- */
  function ordenar(rows) {
    const col = COLUNAS.find(c => c.k === S.tab.sort.k) || COLUNAS[0];
    const d = S.tab.sort.d;
    return rows.map(r => [col.s(r), r]).sort((a, b) => (a[0] < b[0] ? -d : a[0] > b[0] ? d : b[1].ts - a[1].ts)).map(x => x[1]);
  }
  function pagLigacoes(rows) {
    const cols = COLUNAS.filter(c => S.tab.cols.includes(c.k));
    const ord = ordenar(rows);
    const tot = ord.length, size = S.tab.size, pags = Math.max(1, Math.ceil(tot / size));
    if (S.tab.page > pags) S.tab.page = pags;
    const ini = (S.tab.page - 1) * size;
    const pag = ord.slice(ini, ini + size);
    const todasSel = pag.length && pag.every(r => S.tab.sel.has(r.id));
    const nEf = rows.filter(r => r.ligacao_efetiva === 'Sim').length;
    const th = c => {
      const at = S.tab.sort.k === c.k;
      return '<th class="' + (c.num ? 'num ' : '') + (c.k === 'data' ? 'fz2' : '') + '" aria-sort="' + (at ? (S.tab.sort.d > 0 ? 'ascending' : 'descending') : 'none') + '"><button class="sort" data-act="sort" data-k="' + c.k + '">' + esc(c.l) + (at ? (S.tab.sort.d > 0 ? ' ▲' : ' ▼') : '') + '</button></th>';
    };
    const toolbar = '<div class="toolbar">' +
      '<div class="grow input-ic">' + ic('search') + '<input class="input" id="tab-busca" type="search" data-filtro="texto" placeholder="Buscar em nome, Closer, etapa, código, telefone…" value="' + esc(S.filtros.texto) + '" aria-label="Busca textual na tabela"></div>' +
      '<div class="ms"><button class="btn" data-act="pop" data-id="cols" aria-expanded="' + (S.pop === 'cols') + '">' + ic('columns') + ' Colunas</button>' + (S.pop === 'cols' ? popColunas() : '') + '</div>' +
      '<button class="btn" data-act="copiarCodigos" data-tip="Copia os códigos de lead (sem repetir) das ligações com 1min30 ou mais visíveis nos filtros atuais — pronto pra colar na monitoria do Dryve.">' + ic('copy') + ' Copiar códigos efetivos (' + nf(new Set(rows.filter(r => r.ligacao_efetiva === 'Sim' && r.lead_code).map(r => r.lead_code)).size) + ')</button>' +
      '<button class="btn" data-act="exportar" data-t="filtrados" data-f="xlsx">' + ic('download') + ' Exportar filtradas</button>' +
      (S.tab.sel.size ? '<button class="btn primary" data-act="exportarSel" data-f="xlsx">' + ic('download') + ' Exportar selecionadas (' + nf(S.tab.sel.size) + ')</button><button class="btn ghost" data-act="limparSel">Limpar seleção</button>' : '') +
      '</div>';
    const corpo = pag.map(r => '<tr data-act="detalhe" data-id="' + r.id + '" tabindex="0" class="' + (r.ligacao_efetiva === 'Sim' ? 'ef ' : '') + (S.tab.sel.has(r.id) ? 'sel' : '') + '">' +
      '<td class="fz1"><input type="checkbox" data-selrow="' + r.id + '"' + (S.tab.sel.has(r.id) ? ' checked' : '') + ' aria-label="Selecionar ligação de ' + esc(r.lead_name || r.lead_code) + '"></td>' +
      cols.map(c => '<td class="' + (c.num ? 'num ' : '') + (c.k === 'data' ? 'fz2' : '') + '">' + c.h(r) + '</td>').join('') + '</tr>').join('');
    const cardsMob = pag.map(r => '<button class="call-card' + (r.ligacao_efetiva === 'Sim' ? ' ef' : '') + '" data-act="detalhe" data-id="' + r.id + '"><span class="row1"><span>' + esc(r.lead_name || '(sem nome)') + '</span><span>' + (r.duracao_segundos == null ? 'Revisar' : C.fmtDuracao(r.duracao_segundos)) + '</span></span>' +
      '<span class="meta"><span>' + esc(r.data_hora_ligacao) + '</span><span>' + esc(r.closer_ligacao) + '</span><span>' + esc(r.etapa || r.status_cruzamento) + '</span><span class="mono">' + esc(r.lead_code) + '</span></span><span>' + badgeEfetiva(r) + (r.lead_perdido === 'Sim' ? ' <span class="badge b-err">Perdido</span>' : '') + (r.status_cruzamento !== 'Localizado' ? ' ' + badgeStatus(r) : '') + '</span></button>').join('');
    return '<section class="card">' +
      '<div class="card-h"><h3>Ligações</h3><div class="sub">' + nf(tot) + ' resultados após os filtros · ' + nf(nEf) + ' com 1min30 ou mais</div></div>' + toolbar +
      (tot ? '<div class="tbl-wrap resp"><table class="tbl freeze"><thead><tr><th class="fz1"><input type="checkbox" data-act="selPagina"' + (todasSel ? ' checked' : '') + ' aria-label="Selecionar todas as linhas desta página"></th>' + cols.map(th).join('') + '</tr></thead><tbody>' + corpo + '</tbody></table></div>' +
        '<div class="cards-list">' + cardsMob + '</div>' : '<div class="empty"><p>Nenhuma ligação encontrada com os filtros atuais.</p><button class="btn" data-act="limparFiltros">Limpar filtros</button></div>') +
      '<div class="tbl-foot"><label>Linhas por página <select class="select" style="width:auto;height:30px" data-act="pageSize" aria-label="Linhas por página">' + [25, 50, 100, 250].map(n => '<option' + (n === size ? ' selected' : '') + '>' + n + '</option>').join('') + '</select></label>' +
      '<span>' + (tot ? nf(ini + 1) + '–' + nf(Math.min(tot, ini + size)) + ' de ' + nf(tot) : '0 resultados') + '</span>' +
      '<div class="pg"><button class="btn sm" data-act="pag" data-v="1" ' + (S.tab.page <= 1 ? 'disabled' : '') + ' aria-label="Primeira página">«</button><button class="btn sm" data-act="pag" data-v="' + (S.tab.page - 1) + '" ' + (S.tab.page <= 1 ? 'disabled' : '') + ' aria-label="Página anterior">‹</button><span>Página ' + S.tab.page + ' de ' + pags + '</span><button class="btn sm" data-act="pag" data-v="' + (S.tab.page + 1) + '" ' + (S.tab.page >= pags ? 'disabled' : '') + ' aria-label="Próxima página">›</button><button class="btn sm" data-act="pag" data-v="' + pags + '" ' + (S.tab.page >= pags ? 'disabled' : '') + ' aria-label="Última página">»</button></div></div>' +
      '</section>';
  }
  function popColunas() {
    return '<div class="pop right" role="dialog" aria-label="Colunas visíveis"><div class="ms-list">' +
      COLUNAS.map(c => '<label class="ms-opt"><input type="checkbox" data-col="' + c.k + '"' + (S.tab.cols.includes(c.k) ? ' checked' : '') + '><span>' + esc(c.l) + '</span></label>').join('') +
      '</div><div class="ms-foot"><button class="btn sm ghost" data-act="colsPadrao">Restaurar padrão</button><button class="btn sm" data-act="popFechar">Fechar</button></div></div>';
  }

  /* ------------------------------- closers ------------------------------- */
  function ranking(rows) {
    const g = C.agrupar(rows, r => r.closer_ligacao);
    const k = S.rank.k, d = S.rank.d;
    const val = x => (k === 'label' ? x.label.toLowerCase() : k === 'supervisor' ? (x.linhas[0].supervisor_closer || '~').toLowerCase() : x[k] == null ? -1 : x[k]);
    return g.sort((a, b) => { const va = val(a), vb = val(b); return va < vb ? -d : va > vb ? d : b.efetivas - a.efetivas; });
  }
  const COLS_RANK = [['label', 'Closer'], ['supervisor', 'Supervisor'], ['total', 'Total de ligações'], ['efetivas', '1min30 ou mais'], ['pct', '% 1min30 ou mais'], ['media', 'Duração média'], ['leads', 'Leads únicos'], ['perdidos', 'Leads perdidos atendidos'], ['etapas', 'Etapas distintas'], ['divergencias', 'Divergências com Kanban']];
  function tabelaRanking(rows) {
    const g = ranking(rows);
    if (!g.length) return vazioGrafico();
    return '<div class="tbl-wrap" style="border-top:0"><table class="tbl"><thead><tr><th class="num">Posição</th>' + COLS_RANK.map(([k, l]) => { const at = S.rank.k === k; return '<th class="' + (k === 'label' || k === 'supervisor' ? '' : 'num') + '" aria-sort="' + (at ? (S.rank.d > 0 ? 'ascending' : 'descending') : 'none') + '"><button class="sort" data-act="rankSort" data-k="' + k + '">' + l + (at ? (S.rank.d > 0 ? ' ▲' : ' ▼') : '') + '</button></th>'; }).join('') + '</tr></thead><tbody>' +
      g.map((x, i) => '<tr data-act="chartFiltro" data-f="closer_ligacao" data-v="' + esc(x.label === '(vazio)' ? '' : x.label) + '" tabindex="0" data-tip="Clique para filtrar por este Closer"><td class="num">' + (i + 1) + 'º</td><td>' + esc(x.label) + '</td><td>' + (esc(x.linhas[0].supervisor_closer) || '<span class="muted">—</span>') + '</td><td class="num">' + nf(x.total) + '</td><td class="num">' + nf(x.efetivas) + '</td><td class="num">' + pf(x.pct) + '</td><td class="num">' + dur(x.media) + '</td><td class="num">' + nf(x.leads) + '</td><td class="num">' + nf(x.perdidos) + '</td><td class="num">' + nf(x.etapas) + '</td><td class="num">' + (x.divergencias ? '<span class="warn-ic">' + ic('alert') + '</span> ' : '') + nf(x.divergencias) + '</td></tr>').join('') + '</tbody></table></div>';
  }
  function matrizCloserEtapa(rows) {
    const loc = rows.filter(r => r.etapa);
    if (!loc.length) return vazioGrafico('Nenhuma ligação localizada no Kanban nos filtros atuais.');
    const closers = C.agrupar(loc, r => r.closer_ligacao).sort((a, b) => b.total - a.total).slice(0, S.expand.matriz ? 999 : 12);
    const etapas = C.agrupar(loc, r => r.etapa).sort((a, b) => b.total - a.total).map(e => e.label);
    const cel = new Map();
    for (const r of loc) { if (r.duracao_segundos == null) continue; const key = r.closer_ligacao + '\u0001' + r.etapa; const c = cel.get(key) || { s: 0, n: 0 }; c.s += r.duracao_segundos; c.n++; cel.set(key, c); }
    const total = C.agrupar(loc, r => r.closer_ligacao).length;
    return '<div class="tbl-wrap" style="border-top:0"><table class="tbl matrix"><thead><tr><th>Closer</th>' + etapas.map(e => '<th class="num">' + esc(e) + '</th>').join('') + '</tr></thead><tbody>' +
      closers.map(c => '<tr><td>' + esc(c.label) + '</td>' + etapas.map(e => { const x = cel.get(c.label + '\u0001' + e); if (!x) return '<td class="num muted">—</td>'; const m = x.s / x.n; return '<td class="num' + (m >= C.EFETIVA_SEG ? ' hot' : '') + '" data-tip="' + esc(c.label + ' · ' + e + '\nDuração média: ' + dur(m) + '\n' + nf(x.n) + ' ligações') + '">' + dur(m) + ' <span class="muted small">(' + x.n + ')</span></td>'; }).join('') + '</tr>').join('') +
      '</tbody></table></div>' + (total > 12 ? '<button class="btn ghost sm more-link" data-act="expand" data-id="matriz">' + (S.expand.matriz ? 'Mostrar menos' : 'Mostrar todos os Closers (' + total + ')') + '</button>' : '');
  }
  function pagClosers(rows) {
    return card('Ranking de Closers', 'Visão comparativa da atividade de ligações por Closer. Use como apoio à análise, junto com o contexto de cada carteira — não como avaliação isolada. Clique nos títulos para ordenar.', tabelaRanking(rows)) +
      '<div class="grid2">' + gCloserEfetivas(rows, 'gCloser2') + gCloserEmpilhado(rows, 'gCloserEmp2') + '</div>' +
      card('Duração média por Closer e etapa', 'Média das ligações localizadas no Kanban. Entre parênteses, a quantidade de ligações. Células em verde têm média de 1min30 ou mais.', matrizCloserEtapa(rows));
  }

  /* -------------------------------- etapas -------------------------------- */
  function pagEtapas(rows) {
    const g = C.agrupar(rows, r => r.etapa || (r.status_cruzamento === 'Localizado' ? '' : '\u0000nl'));
    const k = S.etapaSort.k, d = S.etapaSort.d;
    g.sort((a, b) => { const va = k === 'label' ? a.label : a[k] == null ? -1 : a[k], vb = k === 'label' ? b.label : b[k] == null ? -1 : b[k]; return va < vb ? -d : va > vb ? d : 0; });
    const cols = [['label', 'Etapa do Board'], ['total', 'Ligações'], ['efetivas', '1min30 ou mais'], ['pct', '% 1min30 ou mais'], ['media', 'Duração média'], ['leads', 'Leads únicos'], ['perdidos', 'Leads perdidos']];
    const tabela = '<div class="tbl-wrap" style="border-top:0"><table class="tbl"><thead><tr>' + cols.map(([c, l]) => { const at = S.etapaSort.k === c; return '<th class="' + (c === 'label' ? '' : 'num') + '" aria-sort="' + (at ? (d > 0 ? 'ascending' : 'descending') : 'none') + '"><button class="sort" data-act="etapaSort" data-k="' + c + '">' + l + (at ? (d > 0 ? ' ▲' : ' ▼') : '') + '</button></th>'; }).join('') + '</tr></thead><tbody>' +
      g.map(x => { const nl = x.label === '\u0000nl'; const label = nl ? 'Sem etapa (não localizado no Kanban)' : x.label; return '<tr data-act="chartFiltro" data-f="etapa" data-v="' + esc(nl || x.label === '(vazio)' ? '' : x.label) + '" tabindex="0"><td>' + esc(label) + '</td><td class="num">' + nf(x.total) + '</td><td class="num">' + nf(x.efetivas) + '</td><td class="num">' + pf(x.pct) + '</td><td class="num">' + dur(x.media) + '</td><td class="num">' + nf(x.leads) + '</td><td class="num">' + nf(x.perdidos) + '</td></tr>'; }).join('') + '</tbody></table></div>';
    return '<div class="info-box">' + ic('help') + '<span><b>Etapa do Board</b> é a etapa de atendimento do lead no Kanban no momento da exportação da base. Não confundir com <b>Status Geral</b> (ONGOING/LOST/GAIN).</span></div>' +
      '<div class="grid2">' + gEtapa(rows, 'gEtapa2') + card('Resumo por etapa', 'Clique numa linha para filtrar.', tabela) + '</div>' +
      card('Duração média por Closer e etapa', 'Células em verde têm média de 1min30 ou mais.', matrizCloserEtapa(rows));
  }

  /* ------------------------------- perdidos ------------------------------- */
  function pagPerdidos(rows) {
    const p = rows.filter(r => r.lead_perdido === 'Sim');
    const leads = C.agrupar(p, r => r.lead_key).sort((a, b) => b.efetivas - a.efetivas || b.total - a.total);
    const leadsEf = leads.filter(x => x.efetivas > 0).length;
    const porPag = 50, pags = Math.max(1, Math.ceil(leads.length / porPag));
    if (S.perdPage > pags) S.perdPage = pags;
    const vis = leads.slice((S.perdPage - 1) * porPag, S.perdPage * porPag);
    const tabela = leads.length ? '<div class="tbl-wrap" style="border-top:0"><table class="tbl"><thead><tr><th>Lead</th><th>Código</th><th>Closer do Kanban</th><th>Etapa do Board</th><th>Motivo da Perda</th><th class="num">Ligações</th><th class="num">1min30+</th><th class="num">Maior duração</th><th>Última ligação</th><th>Dryve</th></tr></thead><tbody>' +
      vis.map(x => { const ult = x.linhas.reduce((a, b) => ((b.ts || 0) > (a.ts || 0) ? b : a)); const maior = Math.max(...x.linhas.map(r => r.duracao_segundos || 0)); return '<tr data-act="detalhe" data-id="' + ult.id + '" tabindex="0"' + (x.efetivas ? ' class="ef"' : '') + '><td>' + esc(ult.lead_name) + '</td><td class="mono">' + esc(ult.lead_code) + '</td><td>' + esc(ult.closer_kanban) + '</td><td>' + esc(ult.etapa) + '</td><td class="wrap">' + (esc(ult.motivo_perda) || '<span class="muted">Sem motivo informado</span>') + '</td><td class="num">' + nf(x.total) + '</td><td class="num">' + (x.efetivas ? '<span class="badge b-ok">' + nf(x.efetivas) + '</span>' : '0') + '</td><td class="num">' + C.fmtDuracao(maior) + '</td><td>' + esc(ult.data_hora_ligacao) + '</td><td>' + linksDryve(ult, true) + '</td></tr>'; }).join('') + '</tbody></table></div>' +
      (pags > 1 ? '<div class="tbl-foot"><div class="pg"><button class="btn sm" data-act="perdPag" data-v="' + (S.perdPage - 1) + '"' + (S.perdPage <= 1 ? ' disabled' : '') + ' aria-label="Página anterior">‹</button><span>Página ' + S.perdPage + ' de ' + pags + '</span><button class="btn sm" data-act="perdPag" data-v="' + (S.perdPage + 1) + '"' + (S.perdPage >= pags ? ' disabled' : '') + ' aria-label="Próxima página">›</button></div></div>' : '')
      : vazioGrafico('Nenhuma ligação de lead perdido nos filtros atuais.');
    return '<div class="kpis">' +
      '<div class="card kpi t-err"><div class="k-l">Ligações de leads perdidos</div><div class="k-v">' + nf(p.length) + '</div></div>' +
      '<div class="card kpi t-ok"><div class="k-l">Dessas, com 1min30 ou mais</div><div class="k-v">' + nf(p.filter(r => r.ligacao_efetiva === 'Sim').length) + '</div></div>' +
      '<div class="card kpi"><div class="k-l">Leads perdidos únicos</div><div class="k-v">' + nf(leads.length) + '</div></div>' +
      '<div class="card kpi t-err"><div class="k-l">Leads perdidos com ligação efetiva</div><div class="k-v">' + nf(leadsEf) + '</div></div></div>' +
      '<div class="actions-row"><button class="btn" data-act="verPerdidosTabela">' + ic('list') + ' Ver essas ligações na tabela</button><button class="btn" data-act="exportar" data-t="perdidosEf" data-f="xlsx">' + ic('download') + ' Exportar perdidos com ligação efetiva</button></div>' +
      '<div class="grid2">' + gMotivos(rows, 'gMotivos2') + gEtapa(p, 'gEtapaPerd') + '</div>' +
      card('Leads perdidos', 'Um lead por linha, com o total de ligações encontradas. Clique para ver o histórico completo.', tabela);
  }

  /* ---------------------------- nao localizados ---------------------------- */
  function candidatosPara(r) {
    const K = S.dados.K;
    if (r.candidatos.length) return r.candidatos;
    const nN = C.normName(r.lead_name), cN = C.normName(r.closer_ligacao), fim8 = r.phone_norm.slice(-8);
    const sc = [];
    for (const k of K) {
      let s = 0;
      if (fim8.length === 8 && k.phones.some(p => p.endsWith(fim8))) s += 0.6;
      const sim = C.similaridade(nN, k.nomeN);
      if (sim >= 0.5) s += sim * 0.5 + (k.closerN === cN ? 0.2 : 0);
      if (s >= 0.45) sc.push([k.idx, s]);
    }
    return sc.sort((a, b) => b[1] - a[1]).slice(0, 4).map(x => x[0]);
  }
  function htmlCandidato(r, idx, sugerido) {
    const k = S.dados.K[idx];
    return '<div class="cand"><div class="grow"><div><b>' + esc(k.f.nome || '(sem nome)') + '</b> ' + (k.code ? '<span class="mono small">' + esc(k.code) + '</span>' : '') + (sugerido ? ' <span class="badge b-warn">Sugestão</span>' : '') + '</div>' +
      '<div class="m">' + [k.f.telefone, k.f.closer && 'Closer: ' + k.f.closer, k.f.etapa && 'Etapa: ' + k.f.etapa, k.f.data_lead && 'Lead de ' + k.f.data_lead].filter(Boolean).map(esc).join(' · ') + '</div></div>' +
      '<button class="btn sm" data-act="associar" data-ch="' + esc(r.chave) + '" data-k="' + idx + '">' + ic('link') + ' Associar</button></div>';
  }
  function pagNaoLoc(rows) {
    const abas = [['Não localizado', 'Não localizados'], ['Revisar', 'Sugestões para revisar'], ['Correspondência ambígua', 'Ambíguos']];
    const cont = {};
    for (const [k] of abas) cont[k] = 0;
    for (const r of rows) if (cont[r.status_cruzamento] != null) cont[r.status_cruzamento]++;
    const lista = rows.filter(r => r.status_cruzamento === S.naoloc.aba).sort((a, b) => (b.duracao_segundos || 0) - (a.duracao_segundos || 0));
    const porPag = 25, pags = Math.max(1, Math.ceil(lista.length / porPag));
    if (S.naoloc.page > pags) S.naoloc.page = pags;
    const vis = lista.slice((S.naoloc.page - 1) * porPag, S.naoloc.page * porPag);
    const nManuais = Object.keys(S.dados.demo ? S.manuaisDemo : S.manuais).length;
    const cards = vis.map(r => {
      const cands = candidatosPara(r);
      return '<section class="card card-b unm-card"><div class="actions-row"><b>' + esc(r.lead_name || '(sem nome)') + '</b>' + badgeEfetiva(r) + badgeStatus(r) + '<span style="margin-left:auto">' + linksDryve(r, false) + '</span></div>' +
        (r.motivo_resumo ? '<div><span class="badge b-orange">' + esc(r.motivo_resumo) + '</span></div>' : '') + '<dl class="kv"><dt>Código (ligações)</dt><dd class="mono">' + (esc(r.lead_code) || '—') + (r.lead_code ? acoesCopia(r.lead_code, 'código') : '') + '</dd><dt>Telefone</dt><dd class="mono">' + (esc(r.phone) || '—') + '</dd><dt>Closer da ligação</dt><dd>' + esc(r.closer_ligacao) + '</dd><dt>Data</dt><dd>' + esc(r.data_hora_ligacao) + '</dd><dt>Duração</dt><dd>' + C.fmtDuracao(r.duracao_segundos) + '</dd><dt>Por quê</dt><dd>' + esc(r.motivo_falha || '—') + '</dd></dl>' +
        '<div class="small muted">' + (cands.length ? 'Possíveis candidatos no Kanban:' : 'Nenhum candidato parecido encontrado no Kanban.') + '</div>' +
        cands.map(i => htmlCandidato(r, i, r.sugestao === i)).join('') +
        '<div><button class="btn sm" data-act="buscarKanban" data-ch="' + esc(r.chave) + '">' + ic('search') + ' Buscar no Kanban e associar manualmente</button></div></section>';
    }).join('');
    return explicacaoNaoLoc(rows) +
      '<div class="info-box">' + ic('help') + '<span>Abaixo, cada ligação não encontrada com o motivo. Se você souber qual é o lead, dá pra associar manualmente — fica salvo neste navegador' + (S.dados.demo ? ' (na demonstração, só até fechar a página)' : '') + '.</span></div>' +
      '<div class="actions-row"><div class="seg" role="tablist">' + abas.map(([k, l]) => '<button role="tab" aria-selected="' + (S.naoloc.aba === k) + '" aria-pressed="' + (S.naoloc.aba === k) + '" data-act="naolocAba" data-v="' + esc(k) + '">' + l + ' (' + nf(cont[k]) + ')</button>').join('') + '</div>' +
      '<span style="margin-left:auto" class="actions-row"><button class="btn" data-act="exportar" data-t="' + (S.naoloc.aba === 'Correspondência ambígua' ? 'ambiguos' : 'naoloc') + '" data-f="xlsx">' + ic('download') + ' Exportar</button>' +
      (nManuais ? '<button class="btn danger" data-act="limparManuais">' + ic('trash') + ' Limpar associações manuais (' + nManuais + ')</button>' : '') + '</span></div>' +
      (lista.length ? cards : '<div class="card empty"><p>Nenhum registro nesta categoria com os filtros atuais.</p></div>') +
      (pags > 1 ? '<div class="tbl-foot"><div class="pg"><button class="btn sm" data-act="naolocPag" data-v="' + (S.naoloc.page - 1) + '"' + (S.naoloc.page <= 1 ? ' disabled' : '') + ' aria-label="Página anterior">‹</button><span>Página ' + S.naoloc.page + ' de ' + pags + ' · ' + nf(lista.length) + ' registros (ordenados pela maior duração)</span><button class="btn sm" data-act="naolocPag" data-v="' + (S.naoloc.page + 1) + '"' + (S.naoloc.page >= pags ? ' disabled' : '') + ' aria-label="Próxima página">›</button></div></div>' : '');
  }

  function explicacaoNaoLoc(rows) {
    const M = C.MOTIVOS;
    const nao = rows.filter(r => r.status_cruzamento !== 'Localizado');
    const cont = {};
    for (const r of nao) cont[r.motivo_resumo] = (cont[r.motivo_resumo] || 0) + 1;
    const perfis = C.perfilCloseres(S.dados.K);
    const closersLig = new Set(todas().map(r => C.normName(r.closer_ligacao)).filter(Boolean));
    const fora = [...closersLig].filter(c => !perfis.has(c)).length;
    const sups = [...new Set([...perfis.values()].map(p => p.supervisor).filter(Boolean))];
    const txt = {
      [M.closerFora]: ['O Closer que fez a ligação não tem nenhum lead no Kanban importado. Normalmente é porque o Kanban exportado é de outra equipe/supervisão.', 'Exporte o Kanban com as outras equipes (ou todas) e importe de novo.'],
      [M.leadFora]: ['O Closer está no Kanban, mas este lead não. O lead pode estar numa etapa ou board que não foi exportado, ou mudou depois da exportação.', 'Exporte o Kanban com mais etapas/boards, ou associe manualmente.'],
      [M.parecido]: ['Código e telefone não bateram, mas há um lead com nome parecido e o mesmo Closer.', 'Confira e clique em "Associar" se for o mesmo lead.'],
      [M.ambiguo]: ['Mais de um lead do Kanban bate com a ligação e não dá pra saber qual é o certo.', 'Escolha o lead certo em "Associar".'],
      [M.semId]: ['A ligação veio sem código, telefone e nome.', 'Não há como cruzar — confira a base de ligações.'],
    };
    const itens = Object.keys(txt).filter(k => cont[k]).map(k => '<button type="button" class="cand motivo" data-act="chartFiltro" data-f="motivo_resumo" data-v="' + esc(k) + '" style="text-align:left;background:var(--surface);cursor:pointer;width:100%"><div class="grow"><div><b>' + esc(k) + '</b> <span class="badge b-orange">' + nf(cont[k]) + ' ligações</span></div><div class="m">' + esc(txt[k][0]) + '</div><div class="m"><b>O que fazer:</b> ' + esc(txt[k][1]) + '</div></div>' + ic('filter') + '</button>').join('');
    const foraTop = C.agrupar(nao.filter(r => r.motivo_resumo === M.closerFora), r => r.closer_ligacao).sort((a, b) => b.total - a.total);
    const resumo = '<p style="margin:0 0 10px">O Kanban importado tem leads de <b>' + nf(perfis.size) + ' Closers</b>' + (sups.length ? ' (supervisão: <b>' + sups.map(esc).join(', ') + '</b>)' : '') + '. Na base de ligações aparecem <b>' + nf(closersLig.size) + ' Closers</b> — <b>' + nf(fora) + '</b> deles não têm nenhum lead no Kanban, então as ligações deles não têm como ser encontradas.</p>';
    const listaFora = foraTop.length ? '<details style="margin-top:8px"><summary class="small" style="cursor:pointer">Ver Closers fora do Kanban (' + foraTop.length + ')</summary><div class="small muted" style="margin-top:6px;columns:2 220px">' + foraTop.map(g => esc(g.label) + ' — ' + nf(g.total) + ' lig. (' + nf(g.efetivas) + ' de 1min30+)').join('<br>') + '</div></details>' : '';
    return card('Por que algumas ligações não foram encontradas?', 'Clique num motivo para filtrar.', (nao.length ? resumo + '<div style="display:grid;gap:8px">' + itens + '</div>' + listaFora : '<p class="muted" style="margin:0">Todas as ligações dos filtros atuais foram encontradas no Kanban.</p>'));
  }

  /* ------------------------------- qualidade ------------------------------- */
  function pagQualidade(rows) {
    const k = C.kpis(rows);
    const pares = C.agrupar(rows.filter(r => r.divergencia_closer === 'Sim'), r => r.closer_ligacao + ' → ' + r.closer_kanban).sort((a, b) => b.total - a.total).slice(0, 15);
    const div = pares.length ? '<div class="tbl-wrap" style="border-top:0"><table class="tbl"><thead><tr><th>Closer da ligação → Closer do Kanban</th><th class="num">Ligações</th><th class="num">1min30+</th></tr></thead><tbody>' + pares.map(p => '<tr><td>' + esc(p.label) + '</td><td class="num">' + nf(p.total) + '</td><td class="num">' + nf(p.efetivas) + '</td></tr>').join('') + '</tbody></table></div>' : vazioGrafico('Nenhuma divergência de Closer nos filtros atuais.');
    const regras = '<ol class="steps small">' +
      '<li><b>Código do lead</b>: <code>lead_code</code> da ligação = <code>reference_code</code> do Kanban (texto, sem espaços, sem ".0" do Excel, mantendo zeros à esquerda).</li>' +
      '<li><b>Telefone</b>: só dígitos; primeiro o número completo, depois os últimos 11 ou 10 dígitos — apenas se apontar para um único registro.</li>' +
      '<li><b>Nome + Closer</b>: nome do lead e Closer iguais depois de remover acentos, pontuação e espaços extras.</li>' +
      '<li><b>Sugestão por similaridade</b>: nome parecido com o mesmo Closer — nunca vira válida sozinha, fica como <i>Revisar</i>.</li>' +
      '<li><b>Duplicidade no Kanban</b>: vence o registro com Data do Lead mais recente; empate ou sem data → <i>Correspondência ambígua</i>. Uma ligação nunca é multiplicada.</li>' +
      '<li><b>Lead perdido</b>: Etapa do Board ou Status Geral indicando perda (ex.: "Perdido", "LOST").</li></ol>';
    return '<div class="kpis">' +
      '<div class="card kpi t-acc"><div class="k-l">Taxa de localização</div><div class="k-v">' + pf(k.taxaLocalizacao) + '</div><div class="k-s">' + nf(k.localizados) + ' de ' + nf(k.total) + '</div></div>' +
      '<div class="card kpi t-warn"><div class="k-l">Não localizados</div><div class="k-v">' + nf(k.naoLocalizados - k.revisar) + '</div></div>' +
      '<div class="card kpi t-warn"><div class="k-l">Sugestões para revisar</div><div class="k-v">' + nf(k.revisar) + '</div></div>' +
      '<div class="card kpi t-warn"><div class="k-l">Correspondências ambíguas</div><div class="k-v">' + nf(k.ambiguos) + '</div></div>' +
      '<div class="card kpi t-warn"><div class="k-l">Divergências de Closer</div><div class="k-v">' + nf(k.divergencias) + '</div></div>' +
      '<div class="card kpi"><div class="k-l">Durações inválidas</div><div class="k-v">' + nf(k.invalidas) + '</div></div></div>' +
      '<div class="grid2">' + gQualidade(rows) + card('Como o cruzamento funciona', 'Estratégia em camadas, da mais segura para a menos segura.', regras) + '</div>' +
      card('Divergências entre Closer da ligação e Closer do Kanban', 'Pares mais frequentes.', div);
  }

  /* -------------------------------- importar -------------------------------- */
  function zonaUpload(base) {
    const a = S.arq[base];
    const titulo = base === 'ligacoes' ? 'Base de ligações' : 'Base do Kanban';
    const texto = base === 'ligacoes' ? 'Importe a base de ligações em XLSX, XLS ou CSV' : 'Importe a base do Kanban em XLSX, XLS ou CSV';
    const campos = base === 'ligacoes' ? C.CAMPOS_LIGACOES : C.CAMPOS_KANBAN;
    let corpo;
    if (a.status === 'carregando') {
      corpo = '<div class="file-ok"><div class="skel" style="height:56px"></div><div class="skel" style="height:14px;width:60%"></div><div class="skel" style="height:14px;width:40%"></div><div class="small muted">Lendo ' + esc(a.nome) + '…</div></div>';
    } else if (a.status === 'ok' || (a.status === 'erro' && a.pasta)) {
      const falt = base === 'ligacoes' ? C.faltandoLigacoes(a.map) : C.faltandoKanban(a.map);
      const detectados = campos.filter(c => a.map[c.key]).length;
      corpo = '<div class="file-ok"><div class="file-row">' + ic('file') + '<div class="grow"><div class="nm" title="' + esc(a.nome) + '">' + esc(a.nome) + '</div><div class="inf">' + (a.tabela ? nf(a.tabela.rows.length) + ' linhas · aba "' + esc(a.aba) + '"' : '') + '</div></div><span class="badge ' + (falt.length ? 'b-warn' : 'b-ok') + '">' + (falt.length ? 'Mapeamento pendente' : 'Pronto') + '</span></div>' +
        (a.pasta && a.pasta.abas.length > 1 ? '<div class="field"><label for="aba-' + base + '">Aba da planilha</label><select class="select" id="aba-' + base + '" data-aba="' + base + '">' + a.pasta.abas.map(n => '<option' + (n === a.aba ? ' selected' : '') + '>' + esc(n) + '</option>').join('') + '</select></div>' : '') +
        (a.erro ? '<div class="err-box" role="alert">' + ic('alert') + '<span>' + esc(a.erro) + '</span></div>' : '') +
        (falt.length ? '<div class="err-box" role="alert">' + ic('alert') + '<span>Não reconhecemos: <b>' + esc(falt.join(', ')) + '</b>. Clique em "Conferir mapeamento" para associar manualmente.</span></div>' : '') +
        '<div class="small muted">' + detectados + ' de ' + campos.length + ' campos reconhecidos.</div>' +
        '<div class="actions-row"><button class="btn" data-act="mapear" data-b="' + base + '">' + ic('columns') + ' Conferir mapeamento</button><button class="btn" data-act="escolher" data-b="' + base + '">' + ic('refresh') + ' Substituir</button><button class="btn ghost danger" data-act="remover" data-b="' + base + '">' + ic('trash') + ' Remover</button></div></div>';
    } else {
      corpo = '<div class="drop" data-drop="' + base + '" data-act="escolher" data-b="' + base + '" role="button" tabindex="0" aria-label="' + esc(texto) + '">' + ic('upload', 'big') + '<p><b>' + esc(texto) + '</b></p><p class="hint">Arraste o arquivo aqui ou clique para selecionar</p><span class="btn sm primary">Selecionar arquivo</span></div>' +
        (a.erro ? '<div class="err-box" role="alert" style="margin-top:10px">' + ic('alert') + '<span>' + esc(a.erro) + '</span></div>' : '');
    }
    return '<section class="card" data-drop="' + base + '"><div class="card-h"><h3>' + titulo + '</h3><div class="sub">' + (base === 'ligacoes' ? 'Campos esperados: lead_code, created_at, duracao_chamada, effective, user_name, lead_name, phone, tipo_chamada.' : 'Campos esperados: Nome do Lead, Telefone, ID, Closer, Etapa do Board, Status Geral, Motivo da Perda, reference_code…') + '</div></div><div class="card-b">' + corpo + '</div></section>' +
      '<input type="file" id="file-' + base + '" accept=".xlsx,.xls,.xlsm,.csv,text/csv" hidden data-file="' + base + '">';
  }
  function pagImportar() {
    const pronto = S.arq.ligacoes.status === 'ok' && S.arq.kanban.status === 'ok';
    return '<div class="section-title"><h2>Importar bases</h2><p>Os arquivos são lidos no seu navegador. Nada é enviado para a internet.</p></div>' +
      '<div class="uploads">' + zonaUpload('ligacoes') + zonaUpload('kanban') + '</div>' +
      '<div class="actions-row"><button class="btn primary" data-act="processar"' + (pronto && !S.processando ? '' : ' disabled') + '>' + ic('play') + ' Processar bases</button>' +
      '<button class="btn danger" data-act="limparTudo">' + ic('trash') + ' Limpar dados</button>' +
      (!pronto ? '<span class="small muted">Importe as duas bases para liberar o processamento.</span>' : '') + '</div>' +
      '<div class="grid2">' + cardEquipes() + cardRenomes() + '</div>' +
      (!S.dados ? guia(false) : '');
  }
  function cardEquipes() {
    const q = (window.MR_EQUIPES || []).filter(Array.isArray);
    const comSup = q.filter(l => l[1] && String(l[1]).trim()).length;
